/* a confirmed contract writes the lease terms, and says what it changed */
/* DUAL-03. This changed the flat on screen, closed the drawer and announced
   "{u} updated from the contract" before the database had answered — the
   same defect CON-02 removed from the five action buttons, left standing on
   the two document buttons. It waits now, like they do. */
async function docApplyLease(){
  if(!writeGate()) return;
  const u = UNITS.find(x=>x.u===DOCCTX.ref.unit); if(!u) return;
  const start = $('dStart').value, end = $('dEnd').value;
  const value = Number($('dValue').value)||0, n = Number($('dInst').value)||0;
  if(!start && !end && !value){ toast(T('doc_need')); return; }
  const key = 'lease:' + u.u; if(PENDING.has(key)) return;
  const was = {start:u.leaseStart, end:u.leaseEnd, rent:u.rent, inst:u.inst.length};
  let rows = null;
  if(value && n && start){
    /* Money already received is not the contract's to rewrite. This rebuilt the
       schedule with paid:false on every line, so applying a lease document to a
       flat that had paid wiped its receipts off the screen — and then the
       database refused the write, because DATA-01 made it refuse exactly this,
       leaving the console showing a schedule Postgres had rejected. The paid
       lines are carried across by instalment number, the way the reconciliation
       panel matches them. */
    const had = {};
    (u.inst || []).forEach(x => { if(x.paid) had[x.q] = x; });
    rows=[]; let left=value;
    for(let i=0;i<n;i++){
      const d=addMonthsClamped(start, i);
      const amt = i===n-1 ? left : Math.round(value/n);
      left -= amt;
      const k = had[i+1];
      rows.push({q:i+1, amt, due:d, billed:d<=TODAY,
                 paid: !!k, paidOn: k ? (k.paidOn || null) : null,
                 ref: k ? (k.ref || null) : null});
    }
    /* A receipt with no line to sit on is the reconciliation case, and the
       operator has to see it before the database answers. */
    const orphan = Object.keys(had).map(Number).filter(q => q > n);
    /* DUAL-03. This used to warn — under a sentence that said nothing had been
       sent — and then send anyway. It stops here. The database would refuse
       the schedule in any case (a paid row cannot be dropped); the point is
       that the operator hears it from the figures, not from a refusal. */
    if(orphan.length){
      toast(L('Instalment ' + orphan.join(', ') + ' has been paid and the new schedule has no '
              + 'line for it. Nothing has been sent — check the figures.',
              'الدفعة ' + orphan.join('، ') + ' مسددة ولا يوجد لها سطر في الجدول الجديد. '
              + 'لم يُرسل شيء — راجع الأرقام.'));
      return;
    }
  }
  saving(key, true);
  LINK.commit(s=>{
    s.leases = s.leases || {};
    s.leases[u.u] = {start: start||null, end: end||null, value: value||null, n: n||null,
                     doc: DOCCTX.rec.id, at: new Date().toISOString()};
  }, 'console');
  const ok = await settledOK();
  saving(key, false);
  if(!ok){ toast(notSaved('lease_not_applied')); return; }
  /* Only now, with the lease in the database, does the flat on screen change. */
  if(start) u.leaseStart = new Date(start);
  if(end)   u.leaseEnd   = new Date(end);
  if(value) u.rent = value;
  if(rows)  u.inst = rows;
  if(!u.occupied && (value||start)) u.occupied = true;
  recompute(); closeDrawer(); render();
  toast(T('doc_applied').replace('{u}', u.u)
    + (was.rent!==u.rent ? ' ' + money(was.rent) + ' → ' + money(u.rent) : ''));
}

/* a confirmed receipt settles the instalment it is attached to */
/* DUAL-02. Two things this did that a ledger must not.

   It settled the instalment whatever the receipt said: a SAR 1 receipt
   marked a SAR 100 instalment paid, with a toast that noted the difference
   and settled it anyway. The instalments table records whether a line is
   paid — there is no partial allocation in it — so a receipt that does not
   cover the line cannot be applied to the line, and is refused here with
   both figures in the sentence. And a receipt whose date could not be read
   was recorded as paid TODAY, which is a date nobody knew dressed as one
   somebody did. The date stays unknown.

   DUAL-03. And it announced before the database answered. It waits now. */
async function docApplyReceipt(){
  if(!writeGate()) return;
  const r = DOCCTX.ref;
  const u = UNITS.find(x=>x.u===r.unit); if(!u) return;
  const row = u.inst.find(x=>x.q===r.inst); if(!row) return;
  const amt = Number($('dAmt').value)||0;
  const on  = $('dPaidOn').value;
  if(!amt){ toast(T('doc_amt_need')); return; }
  if(Math.abs(amt - row.amt) > 1){
    toast(T('doc_amt_mismatch').replace('{a}',money(amt)).replace('{n}',NUM(row.q)).replace('{b}',money(row.amt)));
    return;
  }
  const key = 'pay:' + r.unit + ':' + r.inst; if(PENDING.has(key)) return;
  const ref = 'RCT-' + DOCCTX.rec.hash.slice(0,6).toUpperCase();
  saving(key, true);
  LINK.commit(s=>{
    s.pay = s.pay || {};
    s.pay[r.unit] = s.pay[r.unit] || {paid:{}};
    s.pay[r.unit].paid[r.inst] = {ref, on: on ? new Date(on + 'T12:00:00').toISOString() : null, doc:DOCCTX.rec.id};
  }, 'console');
  const ok = await settledOK();
  saving(key, false);
  if(!ok){ toast(notSaved('receipt_not_applied')); return; }
  row.paid = true; row.paidOn = on ? new Date(on + 'T12:00:00') : null; row.ref = ref;
  recompute(); closeDrawer(); render();
  toast(on ? T('doc_receipted').replace('{r}', ref)
           : T('doc_receipted_nodate').replace('{r}', ref));
}

/* ------------------------------ coverage ------------------------------ */
function docCoverage(){
  const rows = [];
  UNITS.forEach(u=>{
    if(!u.occupied) return;
    /* F-01. Evidence is counted for THIS lease and THESE instalments. A
       renewal opens a new lease with no documents until its own are attached;
       the old term's contract and receipts stay with the old term. */
    const c = docsFor({type:'unit',unit:u.u,lease:u.leaseId}).filter(d=>d.kind==='contract').length;
    const billed = u.inst.filter(x=>x.billed);
    const paid = billed.filter(x=>x.paid);
    const withR = paid.filter(x=>docsFor({type:'inst',unit:u.u,inst:x.q,id:x.id,lease:u.leaseId}).length).length;
    rows.push({unit:u.u, tenant:L(u.tenant,u.tenant_ar), contract:c,
      value:u.rent, paid:paid.length, receipts:withR,
      gap: paid.length - withR,
      state: c && paid.length===withR ? T('doc_full') : c ? T('doc_part') : T('doc_none')});
  });
  return rows.sort((a,b)=>(b.gap-a.gap)||a.unit.localeCompare(b.unit,'en',{numeric:true}));
}

function repEvidence(){
  const rows = docCoverage();
  const withC = rows.filter(r=>r.contract).length;
  const paid = rows.reduce((a,r)=>a+r.paid,0), rec = rows.reduce((a,r)=>a+r.receipts,0);
  const jobs = WOS.filter(w=>w.status==='done');
  const jobsWith = jobs.filter(w=>docsFor({type:'wo',wo:w.id}).length).length;
  return {
    stats:[[T('doc_contracts'), NUM(withC)+' / '+NUM(rows.length), T('doc_contracts_d')],
           [T('doc_receipts'), NUM(rec)+' / '+NUM(paid), T('doc_receipts_d')],
           [T('doc_invoices'), NUM(jobsWith)+' / '+NUM(jobs.length), T('doc_invoices_d')]],
    cols:[{k:'unit',l:T('unit')},{k:'tenant',l:T('tenant')},{k:'value',l:T('h_annual'),num:1,money:1},
          {k:'contract',l:T('doc_k_contract'),num:1},{k:'paid',l:T('doc_settled'),num:1},
          {k:'receipts',l:T('doc_k_receipt'),num:1},{k:'gap',l:T('doc_gap'),num:1},
          {k:'state',l:T('status')}],
    rows,
    foot:{unit:T('rp_total'), value:rows.reduce((a,r)=>a+(r.value||0),0),
          contract:withC, paid, receipts:rec, gap:paid-rec},
    note:T('doc_cov_n')
  };
}

/* The actions a report row may carry, by name. rpAction looks the name up
   here and nowhere else, so a row can only ever invoke what this list allows,
   and the handler in the markup is a constant. */
const RP_ACTIONS = { owingSettle: id => owingSettle(id) };
function rpAction(btn){
  const f = RP_ACTIONS[btn && btn.dataset && btn.dataset.act];
  if(f) f(Number(btn.dataset.id));
}
/* ------------------------------ rendering ------------------------------ */
function rpCell(c, v){
  /* An action column: the value is the row's own id, the handler is a function
     THIS file named on the column — never a string off a row. Shown only to
     someone who may write; a viewer sees the figure and no button. */
  if(c.act) return (v === null || v === undefined || rolesViewer()) ? ''
    : `<button class="tbtn" data-id="${Number(v)}" data-act="${esc(c.act)}" onclick="rpAction(this)">${I('check',13,2.2)}<span>${T('ow_record')}</span></button>`;
  if(v === null || v === undefined || v === '') return '<span class="sub2">—</span>';

     else wrote — a supplier name, a unit type, a note off an invoice. It
     returned that string into a table cell unchanged. The 8 September audit put

  return esc(v);

/* DATA-08. There were three Export buttons in this console. ONE of them
   worked — the one inside a report, which called the function below. The other
   two, the header button and the one over the arrears table, were:

       onclick="toast('Prototype — export would produce an Excel workbook.')"

   The machinery here was complete and hardened and reachable from exactly one
   place. That is the fourth time in this repair that a correct mechanism turned
   out to have a site that did not call it.

   The header button is GONE rather than wired. An Export sitting above the
   table it exports tells you what you are about to take; one in the header, on
   every screen, does not. Ahmed's call, 16 September 2026.

   ORDER. record_export() runs FIRST, and the file is built only if it returns.
   It decides whether this caller may take a copy — a viewer may read resident
   details on screen and may not export them — and it writes the log row with
   the actor taken from the token, never from what this page sends. A log
   written after the file is a log missing every export that went wrong, and a
   permission checked after the file is not a permission at all.

   AND WHAT IT IS WORTH. This is an accountability record, not a technical
   prevention. Anybody who can read a screen can copy it — with the browser,
   with a script, with a photograph. Written down here so that nobody later
   reads the log as a guarantee it cannot be. */

/* One cell. Lifted out of rpExport unchanged so that every export gets it and
   not just the one that happened to be written first. */
const csvCell = v => {
    if(v === null || v === undefined) return '';
    if(v instanceof Date) return v.toISOString().slice(0,10);
    /* CON-05. A finite NUMBER is a number and leaves as one. The formula guard
       below is for text somebody typed; applied to -670 it produced '-670 — a
       legitimate negative balance turned into a string a spreadsheet will not
       sum. The type is decided here, from the value, before any text rule. */
    if(typeof v === 'number') return Number.isFinite(v) ? String(v) : '';
    let s = String(v).replace(/<[^>]*>/g,'');
    /* DATA-03. Commas and quotes were escaped; formulas were not. A field that
       begins = + - @ (or a tab or carriage return before one) is executed by
       Excel, Numbers and LibreOffice when the file is opened — a supplier name
       or a resident's own request title is enough to carry it. Prefixing an
       apostrophe is the documented neutralisation: the cell shows the text and
       the sheet does not evaluate it.

       Leading whitespace and control characters are stripped first, because
       "  =cmd()" is the same attack wearing a space. */
    s = s.replace(/^[\s\u0000-\u001F\u200B-\u200F\u2028\u2029]+/, '');
    if(/^[=+\-@]/.test(s)) s = "'" + s;
    /* CON-05. A carriage return is a row delimiter to some readers, and one in
       the middle of a value could start a new row with a formula-looking cell.
       It is quoted like the line feed it was already quoting. */
    return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
};

const csvSheet = (title, cols, rows, foot) => {
  const lines = [title, cols.map(c=>csvCell(c.l)).join(',')];
  rows.forEach(r=>lines.push(cols.map(c=>csvCell(r[c.k])).join(',')));
  if(foot) lines.push(cols.map(c=>csvCell(foot[c.k])).join(','));
  return lines.join('\n');
};

/* Which refusal it was, in words the person can act on. A bare "failed" sends
   somebody to the wrong place: a missing function is the administrator's job,
   a refused role is theirs to ask about, and a dropped connection is neither. */
function exportRefusal(e){
  const st = e && e.status;
  const msg = String((e && e.message) || '');
  if(st === 404 || /PGRST202|could not find the function/i.test(msg)) return T('x_notready');
  if(st === 401 || st === 403 || /42501/.test(msg)) return T('x_denied');
  return T('x_failed');
}

/* The one door every export goes through. */
async function exportRows(spec){
  const rows = spec.rows || [];
  if(!rows.length){ toast(T('x_empty')); return false; }
  try{
    await SB.rpcAppend('record_export', {
      p_what:      spec.what,
      p_personal:  !!spec.personal,
      p_row_count: rows.length,
      p_filters:   spec.filters || null
    });
  }catch(e){
    console.error('exportRows', e);
    toast(exportRefusal(e));
    return false;                       /* and no file is written */
  }
  /* Assembled by concatenation, not with a template literal, and that is not a
     matter of style.

     check_html_sinks.mjs walks every `${…}` in this file on the premise that a
     substitution is a markup sink. That premise holds everywhere else here. The
     first version of these lines used template literals and tripped it on
     `spec.note` — and the ORIGINAL rpExport escaped the same check only because
     its local CSV escaper happened to be named `esc`, the same name as the HTML
     escaper the scanner looks for. A markup check was being satisfied by a CSV
     function that shared its name.

     Renaming it to csvCell made that visible. The answer is not a new entry in
     the scanner's allow-list; it is to stop writing non-markup strings in the
     one syntax the scanner has to read as markup. */
  const line = (a, b) => '\n' + csvCell(a) + (b === undefined ? '' : ',' + csvCell(b));

  /* CON-05a. The screen warned when the cost register could not be read; the
     file did not, and went out with a cost of zero in every cell. A zero in a
     spreadsheet is a figure somebody will sum. When the register has NEVER
     arrived the cost cells leave empty, and either way the file carries the
     warning the screen carried — with the time of the last good read, so the
     reader knows how stale "stale" is. */
  let costState = {ok:true};
  try{ costState = LIVE.costsState(); }catch(e){}
  const costCols = (spec.costCols || []).filter(k => (spec.cols || []).some(c => c.k === k));
  let outRows = rows, outFoot = spec.foot;
  if(costState && !costState.ok && !costState.everLoaded && costCols.length){
    const strip = r => { const c = Object.assign({}, r); costCols.forEach(k => { c[k] = null; }); return c; };
    outRows = rows.map(strip);
    outFoot = spec.foot ? strip(spec.foot) : spec.foot;
  }
  let csv = csvSheet(spec.title, spec.cols, outRows, outFoot);
  if(spec.extra && spec.extra.rows && spec.extra.rows.length)
    csv += '\n\n' + csvSheet(spec.extra.title, spec.extra.cols, spec.extra.rows, spec.extra.foot);
  /* TODAY, not fmtD(TODAY). csvCell turns a Date into an ISO date; fmtD is for
     a reader and in Arabic it renders ٠١٢٣, which a spreadsheet takes as text.
     Same reason the columns below carry Dates rather than formatted strings. */
  csv += '\n' + line(T('rp_exported'), TODAY);
  csv += line(T('x_rows'), rows.length);
  if(spec.period)  csv += line(T('rp_period'), spec.period);
  if(spec.filters) csv += line(T('x_filters'), spec.filters);
  if(spec.note)    csv += line(String(spec.note).replace(/<[^>]*>/g, ''));
  if(costState && !costState.ok && costCols.length){
    const when = costState.since instanceof Date
      ? String(costState.since.getHours()).padStart(2,'0') + ':' + String(costState.since.getMinutes()).padStart(2,'0') : '';
    csv += line(costState.everLoaded ? T('x_costs_stale').replace('{t}', when) : T('x_costs_gone'));
  }

  await saveFile('almaria-' + spec.what + '-' + TODAY.toISOString().slice(0,10) + '.csv',
                 '﻿' + csv, 'text/csv;charset=utf-8');
  return true;
}

function rpExport(id){
  const meta = REPORTS.find(r=>r.id===id); if(!meta) return;
  const out = meta.f(); if(out.blocked) return;
  /* A report that names tenants is a report of personal data, and the decision
     is read off the columns rather than kept in a second list beside them that
     somebody has to remember to update. */
  const personal = (out.cols||[]).some(c => ['tenant','name','resident','phone','email'].includes(c.k));
  /* CON-05a. The columns that come from the cost register. In a maintenance
     report every money column does; elsewhere only `cost`, `maint` and `net`
     (collected less maintenance) do — `rent`, `billed`, `avg` rent and the
     like come from the lease schedule and a failed cost read leaves them
     exactly as they are. The key alone is not enough: `avg` is average rent
     in one report and average job cost in another, which is why the group
     decides first. */
  const costCols = (out.cols||[]).filter(c => c.money &&
      (meta.g === 'maint' || ['cost','maint','net'].includes(c.k))).map(c => c.k);
  return exportRows({
    what: id, personal, title: rpName(id), costCols,
    cols: (out.cols||[]).filter(c => !c.act), rows: out.rows||[], foot: out.foot, extra: out.extra,
    period: out.period ? rpPeriodLabel() : null,
    note: out.note
  });
}

/* Saving a file means different things in different places. Opened from a
   folder or a memory stick, a link does it. Inside a viewer that will not let
   a page start its own download, the host has to be asked and the person
   confirms. Try the host first, fall back to the link, and if neither will
   work put the text on the clipboard rather than pretending it saved. */
async function saveFile(name, text, mime){
  try{
    if(typeof claude !== 'undefined' && claude.use){
      const dl = await claude.use('downloads');
      if(dl){ await dl.save({filename:name, data:text}); toast(T('rp_exported_ok')); return; }
    }
  }catch(e){
    if(e && e.code === 'declined') return;                    /* they said no */
    if(e && (e.code === 'extension_not_enabled' || e.code === 'rejected_extension')){
      try{
        await navigator.clipboard.writeText(text);
        toast(L('This viewer will not save files, so the report is on your clipboard.',
                'هذا العارض لا يسمح بحفظ الملفات، وقد نُسخ التقرير إلى الحافظة.'));
        return;
      }catch(_){}
    }
  }
  try{
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:mime}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(T('rp_exported_ok'));
  }catch(e){
    toast(L('Could not save the file here.','تعذّر حفظ الملف في هذا العارض.'));
  }
}

/* DATA-09. The register holds 39 rows because the HEAD LEASE holds 39; 37 of
   them can be let. B-305 and B-306 are in head lease 10174568252/1-0 and not in
   the rent register, and Ahmed confirmed them as not lettable on 15 September.

   The occupancy stat has divided by `lettable` since the 15th. The units table
   and its export mapped over the whole register. Same console, two denominators,
   and a file that said "Rows,39" under a subtitle that said 37 apartments —
   which is how the 22/39 confusion started in the first place.

   `units.lettable` is the mechanism and one site did not use it. Fifth time.

   Both now read from here, so they cannot drift apart again, and the count that
   is left out is STATED rather than quietly subtracted — the two flats are real,
   head-lease rent is paid on them, and a reader who finds 37 where the lease says
   39 needs the sentence, not silence. */
const lettableUnits    = () => UNITS.filter(u => u.lettable !== false);
/* `notLettable` already exists — recompute() sets it to the COUNT. This is the
   same fact as a list, named so it cannot be mistaken for that variable, and
   check_unit_count.mjs asserts the two agree. Two names for one fact is how the
   denominators came apart to begin with. */
const notLettableUnits = () => UNITS.filter(u => u.lettable === false);
const headLeaseNote = () => { const out = notLettableUnits();
  return out.length ? T('u_headlease').replace('{n}', NUM(out.length))
                                      .replace('{ids}', out.map(u => u.u).join(', ')) : null; };

    /* woFiltered(), not the page slice. SCALE-01 was the console showing 60 of

    rows: rows.map(w=>{

function exportContacts(){
  const rows = CRM.contacts().filter(c => {
    if(CF.kind !== 'all' && c.kind !== CF.kind) return false;
    if(!CF.q) return true;
    const q = CF.q.toLowerCase();
    return (c.name_en||'').toLowerCase().includes(q) || (c.name_ar||'').includes(CF.q)
        || (c.phone||'').includes(CF.q) || (c.email||'').toLowerCase().includes(q);
  });
  const filters = [CF.kind!=='all' ? T('crm_kind')+': '+kindName(CF.kind) : null,
                   CF.q ? T('search')+': '+CF.q : null].filter(Boolean).join(' · ');
  return exportRows({
    what:'contacts', personal:true, title:T('t_crm'), filters,
    cols:[{k:'name',l:T('crm_name')},{k:'kind',l:T('crm_kind')},{k:'phone',l:T('crm_phone')},
          {k:'unit',l:T('crm_unit')},{k:'lease',l:T('crm_lease')},
          {k:'email',l:T('crm_email')},{k:'idType',l:T('crm_id_on_file')}],
    /* The identity NUMBER is not here, and that is deliberate. The console
       holds it, the screen shows it to one person at a time behind a drawer,
       and a spreadsheet of 40 of them on somebody's laptop is a different
       thing entirely. The export says whether one is on file, not what it is. */
    rows: rows.map(c=>{
      const t = CRM.tenancy(c.id), cur = t[0] || null;
      return {name:cName(c), kind:kindName(c.kind), phone:c.phone||'',
        unit: cur ? cur.unit_id + (cur.is_current ? '' : ' (' + T('crm_ended') + ')') : '',

           half-truth the screen refused to tell. */
        lease: cur ? (cur.starts_on ? fmtISO(cur.starts_on) : '—') + ' → ' +
                     (cur.ends_on   ? fmtISO(cur.ends_on)   : '—') +

    })
  });
}

let FSORT={k:'unit',dir:1}, FONLY=false;
function fsort(k){ FSORT = (FSORT.k===k) ? {k,dir:-FSORT.dir} : {k,dir:k==='unit'?1:-1}; render(); }
function finRows(){
 const rows=UNITS.map(u=>{
  const maint=unitCost(u), coll=u.collected||0;
  return {u, annual:u.occupied?u.rent:0, billed:u.billed||0, coll,
    out:u.arrears||0, pre:u.prepaid||0,
    od:u.overdueDays||0, maint,
    net:coll-maint, pct:u.billed?maint/u.billed*100:0};
 });
 const k=FSORT.k, d=FSORT.dir;
 rows.sort((a,b)=>{
  if(k==='unit') return a.u.u.localeCompare(b.u.u,'en',{numeric:true})*d;
  return ((a[k]||0)-(b[k]||0))*d;
 });
 return rows;
}
const sortable=(k,label,cls='')=>`<th class="${cls}" style="cursor:pointer;user-select:none" onclick="fsort('${k}')">${label}${FSORT.k===k?(FSORT.dir>0?' ▲':' ▼'):''}</th>`;

/* One apartment, one line, aged from its oldest unpaid instalment — the same
   convention the collections sheet uses, so the two can be compared directly. */
function arrearsRows(){
 return UNITS.filter(u=>u.occupied && u.arrears>0).map(u=>{
   const unpaid=u.inst.filter(x=>x.billed&&!x.paid).sort((a,b)=>a.due-b.due);
   const due=unpaid.length?unpaid[0].due:null;
   return {u, amt:u.arrears, due,
           days: due?Math.floor((TODAY-due)/864e5):0};
 }).sort((a,b)=>b.days-a.days);
}

/* ---------- the renewal decision on an expired lease ----------
   Two outcomes, both real writes, both behind can_write(). "Renewed" is a NEW
   term: renew_lease supersedes the current lease and opens a fresh one at the
   new dates and rent, with its own schedule — seq 1..N on a new lease row, so
   the closed term's paid instalments are never touched or misfiled. "Not
   renewed" ends the tenancy and vacates the flat through set_lease_outcome.
   Neither guesses: the renewal's figures are typed and previewed, and a vacancy
   is confirmed, before the database is asked. A pure date correction on the SAME
   term stays in the lease-document editor; this button is for a real renewal. */
let RENEW_UNIT = null;
function renewStep(f){ return f==='monthly'?1 : f==='quarterly'?3 : f==='semiannual'?6 : f==='annual'?12 : 3; }
/* The new term's rows, computed exactly as renew_lease does server-side — an
   even base with the rounding remainder on the last instalment, dates stepped by
   frequency — so the preview is the schedule that will be written, not a guess. */
function renewRows(start, rent, n, freq){
  const rows = [];
  if(!start || !(rent > 0) || !(n >= 1)) return rows;
  const s0 = dateUTC(start);
  if(isNaN(s0)) return rows;
  const step = renewStep(freq);
  const totalHal = Math.round(rent * 100);
  const baseHal  = Math.floor(totalHal / n);
  const restHal  = totalHal - baseHal * n;
  for(let i = 1; i <= n; i++){
    const amt = (i === n ? baseHal + restHal : baseHal) / 100;
    rows.push({seq:i, amount:amt, due:addMonthsClampedUTC(s0, (i - 1) * step)});
  }
  return rows;
}
/* The number of instalments that fit the term at this cadence — the largest n
   whose last due date is on or before the end. The renewal form opens with
   this, so what it proposes is a plan it would accept. It opened A-103 with the
   old schedule's six instalments and quarterly selected, and refused its own
   default before anything was typed. */
function planFit(start, end, freq){
  if(!start || !end) return 1;
  const step = renewStep(freq), s0 = dateUTC(start);
  if(isNaN(s0)) return 1;
  let n = 0;
  while(n < 60 && isoUTC(addMonthsClampedUTC(s0, n * step)) <= end) n++;
  return Math.max(1, n);
}
function renewVals(){
  return {
    start: $('rnStart') ? $('rnStart').value : '',
    end:   $('rnEnd')   ? $('rnEnd').value   : '',

    n:     $('rnCount') ? parseInt($('rnCount').value, 10) : NaN,
    freq:  $('rnFreq')  ? $('rnFreq').value : 'quarterly'
  };
}
/* N-03. renewValid and editValid were byte-identical and neither checked the
   one thing that matters about a generated plan: that it fits inside the term.
   With the count defaulted from the existing schedule and the frequency
   defaulting to quarterly, opening A-103 → Renewed proposed six quarterly
   instalments across a one-year term — the fifth and sixth falling after the
   lease had ended — with nothing typed. Both forms now ask the same function,
   and it answers with the reason, so the preview can say what is wrong rather
   than only that something is. */
function planReason(v){
  if(!(v.start && v.end && v.rent > 0 && v.n >= 1)) return {k:'f_plan_fields'};
  if(!(v.end > v.start)) return {k:'f_plan_order'};
  const rows = renewRows(v.start, v.rent, v.n, v.freq);
  if(rows.length !== v.n) return {k:'f_plan_fields'};
  /* Calendar day against calendar day. The end used to be built at LOCAL
     midnight and compared with dues held at UTC midnight — F-03. */
  const over = rows.filter(r => isoUTC(r.due) > v.end);
  if(over.length) return {k:'f_plan_past', n:over.length, first:over[0].due};
  return null;
}
function planWhy(v){
  const r = planReason(v); if(!r) return '';
  return r.k === 'f_plan_past'
    ? T('f_plan_past').replace('{n}', NUM(r.n)).replace('{d}', fmtDay(r.first))
    : T(r.k);
}

/* Changing the cadence re-fits the count to the term; the number typed for one
   cadence is rarely the number meant for another. Dates and rent are left to
   the operator — the preview says what does not fit. */
function renewFit(){
  const c = $('rnCount'); if(!c) return;
  const v = renewVals();
  if(v.start && v.end && v.end > v.start) c.value = planFit(v.start, v.end, v.freq);

async function applyRenewal(){
  if(!writeGate()) return;
  const u = UNITS.find(x => x.u === RENEW_UNIT); if(!u) return;
  const v = renewVals();
  if(!renewValid(v)){ toast(planWhy(v)); return; }
  const key = 'renew:' + u.u; if(PENDING.has(key)) return;
  saving(key, true);
  let ok = false, rec = null;
  /* A renewal is a new term: renew_lease supersedes the current lease and opens
     a new one at the new rent with its own schedule, in one transaction behind
     can_write(). The screen changes only after the database has done it, and
     only from the receipt it returns — never from the typed figures alone. */
  try{
    rec = await SB.rpc('renew_lease', {p_unit_id: u.u, p_starts_on: v.start, p_ends_on: v.end,
            p_contract_value: v.rent, p_count: v.n, p_frequency: v.freq, p_dry_run: false});
    ok = !!(rec && rec.new_lease && rec.occupied === true);
  }catch(e){ ok = false; }
  saving(key, false);
  if(!ok){ toast(T('f_renew_fail')); return; }
  /* N-01. This is the line whose absence let a payment recorded straight after
     a renewal be written against the SUPERSEDED lease. The receipt carries the
     new lease id; the screen adopted its instalments and threw the id away, and
     the payment writer went on resolving the unit through a map that is only
     rebuilt by a full read. Between the renewal and the next successful read,
     `instalment 1 paid` targeted the old term's seq 1 — a row that usually
     exists and is usually already settled, so one row was affected, the write
     reported success, and a historical receipt reference and payment date were
     overwritten. Adopting the id here, from the same receipt that supplied the
     instalments, is what makes those two things one fact. */
  u.leaseId    = rec.new_lease;
  u.leaseStart = new Date(v.start);
  u.leaseEnd   = new Date(v.end);
  u.rent       = v.rent;
  u.occupied   = true;
  u.inst = (rec.instalments || []).map(x => ({q: Number(x.seq), amt: Number(x.amount),
            due: new Date(x.due_on), billed: new Date(x.due_on) <= TODAY,
            paid: false, paidOn: null, ref: null}));
  recompute(); closeDrawer(); render();
  toast(T('f_renewed_ok').replace('{u}', u.u).replace('{d}', fmtDay(u.leaseEnd)).replace('{r}', money(v.rent)));
}

       honest screen is the one that does not offer a choice it cannot keep. -->
  <div class="note" style="margin-bottom:16px">${I('users',16,2.2)}
   <p>${L('Announcements go to every resident. Targeting a floor or a block is not available yet.',
          'تصل الإعلانات إلى جميع السكان. تخصيص الإعلان لدور أو مبنى غير متاح حالياً.')}</p></div>
  <div class="warnbox" style="margin-bottom:16px">${I('alert',16,2.2)}<span>${L('Both languages are required before an announcement can be published.','اللغتان مطلوبتان قبل نشر أي إعلان.')}</span></div>
  <button class="btn pri" onclick="pubAnn()">${I('mega',16,2.2)} ${L('Publish','نشر')}</button>`);
}
/* DUAL-04. This put the notice in the list, closed the drawer and said
   "Published and pushed to residents" while the insert was still in flight —
   a refused insert left a notice on the office's screen that no resident
   would ever see, and the draft was gone with the drawer. It waits now; the
   draft stays in the form until the database has the row; the row that joins
   the list is the database's, under the id the database gave it; and a second
   press while the first is in flight does nothing. */
async function pubAnn(){
 if(!writeGate()) return;
 if(!$('aEn').value.trim()||!$('aAr').value.trim()){toast(T('t_annblock'));return;}
 const d=new Date();
 const rec={id:'AN-'+d.getTime(), en:$('aEn').value.trim(), ar:$('aAr').value.trim(),
   body_en:($('aBodyEn')&&$('aBodyEn').value.trim())||$('aEn').value.trim(),
   body_ar:($('aBodyAr')&&$('aBodyAr').value.trim())||$('aAr').value.trim(),
   aud:'all', st:'published',
   date:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),
   ok:true};
 /* The same notice, already published today, is a second press that found
    its way round the guard — after a lost answer, or from a second tab. */
 if(ANNS.some(a => a.st==='published' && a.en===rec.en && a.ar===rec.ar && a.date===rec.date)){
   toast(T('ann_dup')); return;
 }
 const key = 'ann'; if(PENDING.has(key)) return;
 saving(key, true);
 LINK.commit(s=>{ s.anns.unshift(rec); }, 'console');
 const ok = await settledOK();
 saving(key, false);
 if(!ok){ toast(notSaved('ann_not_published')); return; }
 const row = LAST_SAVE && LAST_SAVE.landed && LAST_SAVE.landed['ann:' + rec.id];
 if(row){
   if(row.id != null) rec.id = row.id;
   if(row.published_at) rec.date = String(row.published_at).slice(0,10);
   if(row.status) rec.st = row.status;
   /* The shared record's copy carries the database's id too, so the next
      reload and the next diff both recognise it as the same notice. */
   try{ (LINK.get().anns || []).forEach(a => { if(a === rec || a.id === 'AN-' + d.getTime()) a.id = rec.id; }); }catch(e){}
 }
 if(!ANNS.some(a => a.id === rec.id)) ANNS.unshift(rec);
 closeDrawer();render();toast(L('Published and pushed to residents.','تم النشر وإرسال إشعار للسكان.'));
}

/* ==========================================================================
   CRM — who the office deals with, and what was said

   Added 6 Sep 2026, against almaria_patch_crm.sql.

   LIVE ONLY, and that is the design rather than an unfinished corner. Every
   other screen in this console has a seeded copy so the page is useful before
   anyone signs in. These three must not: the tables behind them hold a record
   of real conversations, and a demonstration copy would be a fabricated
   contact history sitting one screenshot away from being believed. The
   database ships zero rows for the same reason.

   So unconnected, these pages say what they are and why they are empty. There
   is nothing to look at, which is the honest answer.
   ========================================================================== */
const CRM = (function(){
  let contacts = [], deals = [], tasks = [], renewals = [], agreements = [], timeline = {};
  let tenancy = {}, idDocs = {};
  let loaded = false, loading = false, err = null;

  const uid = () => { const c = SB.claims(); return (c && c.sub) || null; };

  async function load(){
    if(loading) return loaded;
    loading = true; err = null;
    try{
      const [c, d, t, r, a, ten, ids] = await Promise.all([
        /* CON-08. Whole collections, paged, with a unique key at the end of
           every order. The views carry the key of the row they derive from. */
        SB.selAll('contacts',   'select=*&order=name_en.asc,id.asc'),
        SB.selAll('deals',      'select=*,contacts(name_en,name_ar)&order=stage_since.desc,id.desc'),
        SB.selAll('tasks_open', 'select=*&order=due_on.asc.nullslast,id.asc'),
        SB.selAll('renewals_due','select=*&order=ends_on.asc,lease_id.asc'),
        SB.selAll('supplier_agreements_due','select=*&order=ends_on.asc.nullslast,id.asc'),
        SB.selAll('contact_tenancy','select=*&order=contact_id.asc,ends_on.desc,lease_id.desc'),
        SB.selAll('identity_documents','select=*&order=uploaded_at.desc,id.desc')
      ]);
      contacts = c; deals = d; tasks = t; renewals = r; agreements = a;
      /* Grouped by person, current lease first. A resident with a renewal
         history has several rows and none of them is dropped. */
      idDocs = {};
      ids.forEach(x => { (idDocs[x.contact_id] = idDocs[x.contact_id] || []).push(x); });
      tenancy = {};
      ten.forEach(x => { (tenancy[x.contact_id] = tenancy[x.contact_id] || []).push(x); });
      Object.values(tenancy).forEach(list => list.sort(
        (x,y) => (y.is_current - x.is_current) || String(y.ends_on).localeCompare(String(x.ends_on))));
      loaded = true;
    }catch(e){ err = e; loaded = false; console.error('CRM.load', e); }
    finally{ loading = false; }
    return loaded;
  }

  async function timelineFor(id){
    /* Ordered by when things HAPPENED, not when they were typed. */
    timeline[id] = await SB.sel('contact_timeline',
      'select=*&contact_id=eq.' + id + '&order=at.desc');
    return timeline[id];
  }

  const on   = () => loaded;
  const busy = () => loading;

  return {
    load, timelineFor, on, busy, uid,
    err:        () => err,
    contacts:   () => contacts,
    deals:      () => deals,
    tasks:      () => tasks,
    renewals:   () => renewals,
    agreements: () => agreements,
    tenancy:    id => tenancy[id] || [],
    idDocs:     id => idDocs[id] || [],
    cached:     id => timeline[id] || null,
    reload:     async () => { loaded = false; return load(); }
  };
})();

/* ==========================================================================
   ROLES — who works here, and what each of them may do

   The console does NOT decide any of this. Postgres does: is_staff() lets a
   person read, can_write() lets them change something, is_admin() lets them
   change who else may do what. This module asks the database which of those
   the signed-in person is, and then arranges the screen to match.

   Two things follow from that division, and both matter.

   First, hiding a button is a courtesy, not a control. A viewer with the
   browser console open can call SB.ins() directly; the database refuses it,
   and check_roles.sh proves the database refuses it. What this module does is
   stop somebody being invited to try.

   Second, this module cannot create a sign-in account and does not pretend to.
   Creating a Supabase user, and marking it staff, needs the service key. This
   console has never held that key. So adding a colleague is two steps and the
   screen says which step you are on, rather than offering a button that fails.
   ========================================================================== */
const ROLES = (function(){
  let roster = [], history = [], mine = null;
  let loaded = false, loading = false, err = null;

  async function load(){
    if(loading) return loaded;
    loading = true; err = null;
    try{
      /* link_staff_member() is idempotent and is the only write this module
         makes by itself: it fills in the account id on a roster row that was
         created before the account existed, and returns the caller's role. It
         refuses to link anything unless the token already carries the staff
         claim, so it cannot be used to claim a colleague's waiting row. */
      try{ mine = await SB.rpc('link_staff_member'); }
      catch(e){ mine = null; }
      if(!mine){ try{ mine = await SB.rpc('staff_role'); }catch(e){ mine = null; } }

      if(mine === 'admin'){
        /* P3, from the 14 September security audit. The roster used to be read
           from the `staff_roster` VIEW, whose only protection is one
           `WHERE is_admin()` in its body — one clause, in one place, with
           nothing behind it, over a join to auth.users. A WHERE filters, and a
           filter that removes your rows looks exactly like rows that were never
           there. staff_roster_admin() RAISES instead, before it touches a row.

           The view has not been dropped yet — it cannot be until this build is
           live — so the read falls back to it. That fallback is the transition
           and nothing more: once the view is gone it becomes dead code and
           should go with it. */
        const [r,h] = await Promise.all([
          SB.rpc('staff_roster_admin')
            .catch(e => {
              console.warn('staff_roster_admin unavailable, falling back to the view', e);
              return SB.sel('staff_roster', 'select=*&order=active.desc,role.asc,email.asc');
            }),
          SB.sel('staff_role_history', 'select=*&limit=200')
        ]);
        roster = r || []; history = h;
      }else{
        /* Not a mistake and not an empty state: a manager and a viewer are
           refused these two by policy, and the screen they would go to is not
           shown to them at all. */
        roster = []; history = [];
      }
      loaded = true;
    }catch(e){ err = e; loaded = false; console.error('ROLES.load', e); }
    finally{ loading = false; }
    return loaded;
  }

  return {
    load, on: () => loaded, err: () => err,
    mine:     () => mine,
    isAdmin:  () => mine === 'admin',
    canWrite: () => mine === 'admin' || mine === 'manager',
    readOnly: () => mine === 'viewer',
    roster:   () => roster,
    history:  () => history,
    reload:   async () => { loaded = false; return load(); }
  };
})();

/* Same temporal-dead-zone hazard as crmReady(): the navigation is built at
   boot, long before SB and ROLES are initialised, and a bare reference throws
   rather than returning undefined. */
const rolesAdmin = () => {
  try { return SB.signedIn() && SB.isStaff() && ROLES.isAdmin(); }
  catch (e) { return false; }
};
const rolesViewer = () => {
  try { return SB.signedIn() && SB.isStaff() && ROLES.readOnly(); }
  catch (e) { return false; }
};
/* Called at the top of every write the console offers. The database refuses a
   viewer's write anyway — this exists so the refusal arrives as a sentence
   rather than as a 42501 from PostgREST. */
function writeGate(){
  if(rolesViewer()){ toast(T('ro_toast')); return false; }
  return true;
}

/* ------------------------------- CON-02 -------------------------------
   Say it happened after it happened.

   recordPayment, logJobSave, assignWO, startWO and closeWO all did the same
   thing: change the row on screen, hand the change to LINK.commit, close the
   drawer and announce success — before the database had answered. A refused
   save still produced a paid row and a green toast, and a reload a moment
   later quietly took the row back. The operator had already told the resident.

   The rule now: nothing on screen changes and nothing is announced until the
   write is acknowledged. LINK.settled() is the promise of the most recent
   push, resolving to {held, failed}. On failure the drawer stays open with its
   values, the person is told in words that the thing did NOT happen, and the
   row is exactly as it was. On success the row changes, the drawer closes, and
   the toast is earned.

   PENDING guards a second press on the same control while the first is in
   flight; body.saving greys the drawer's controls so that the wait is visible
   rather than implied. */
const PENDING = new Set();
function saving(key, on){
  if(on) PENDING.add(key); else PENDING.delete(key);
  try{ document.body.classList.toggle('saving', PENDING.size > 0); }catch(e){}
}
let LAST_SAVE = null;
async function settledOK(){
  LAST_SAVE = null;
  try{
    /* Not signed in: LINK is the localStorage record, commit is synchronous,
       and the only failure it knows is a full store, which healthy() reports. */
    if(typeof LINK.settled !== 'function')
      return typeof LINK.healthy === 'function' ? LINK.healthy() !== false : true;
    const r = await LINK.settled();
    LAST_SAVE = r || null;
    /* Held is not failed, but it is not recorded either: the write is sitting
       in the reconciliation panel waiting for a decision. Nothing was saved. */
    if(r && (r.failed || r.held)) return false;
    /* DUAL-01. A push that sent nothing confirms nothing. The shared record
       already matched what was asked, so there was no write to acknowledge —
       and "the database did not object" is not the sentence "the database
       did this". A caller that is about to speak treats it as not done. */
    if(r && r.wrote === 0) return false;
    return true;
  }catch(e){ return false; }
}
/* The sentence for a save that did not happen. The caller's own words unless
   the write is held for a decision, or nothing was sent at all — each of
   those is its own fact and gets its own sentence. */
function notSaved(key){
  if(LAST_SAVE && !LAST_SAVE.failed && LAST_SAVE.held) return T('save_held');
  if(LAST_SAVE && !LAST_SAVE.failed && !LAST_SAVE.held && LAST_SAVE.wrote === 0) return T('save_nothing');
  return T(key);
}

/* One person, everything recorded against them, most recent first. */
async function contactDrawer(id){
  const c = CRM.contacts().find(x => x.id === id); if(!c) return;
  /* The timeline is fetched. Open one contact, then another before the first
     answers, and the first one's late paint used to replace the second one's
     drawer — the operator reading one name in the list and somebody else's
     record, identity number included, beside it. */
  const mine = ++DRAWER_SEQ;
  const paint = rows => mine !== DRAWER_SEQ ? undefined : openDrawer(esc(cName(c)), `
    <div class="note" style="margin-bottom:12px">
      ${kindName(c.kind)}${c.phone?' · <span class="mono">'+esc(c.phone)+'</span>':''}${c.email?' · '+esc(c.email):''}
    </div>
    ${tenancyBlock(c)}
    ${identityBlock(c)}
    ${idDocBlock(c)}

    <button class="btn pri" onclick="logContactOpen(${id})">${I('plus',15)} ${T('crm_log')}</button>
    <button class="btn" style="margin-${LANG==='ar'?'right':'left'}:8px"
            onclick="contactOpen(${id})">${T('crm_edit')}</button>`}
    <div class="f" style="margin:18px 0 8px">${T('crm_timeline')}</div>
    ${rows === null ? `<div class="note">${T('crm_loading')}</div>`
      : !rows.length ? `<div class="note">${T('crm_tl_none')}</div>`
      : `<div class="tw"><table><tbody>${rows.map(r=>`<tr>
          <td class="mono sub2" style="white-space:nowrap">${fmtISO(r.at)}</td>
          <td><span class="pill ${r.entry==='interaction'?'p-info':r.entry==='deal'?'p-good':'p-neut'}">${tlWhat(r)}</span></td>
          <td>${esc(r.detail || '')}</td></tr>`).join('')}</tbody></table></div>`}`);
  paint(CRM.cached(id));
  try{ paint(await CRM.timelineFor(id)); }
  catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

const IDTYPES = [['unknown','idt_unknown'],['national_id','idt_nid'],['iqama','idt_iqama'],

/* An identity number is never printed in a list and never printed by default.
   Masked to its last four here, revealed only when somebody deliberately asks —
   because the alternative is an ID sitting on screen through every screen-share
   and every walk past the desk. Revealing is per-view and per-click; nothing is
   remembered and nothing is written down about who looked. */
let ID_SHOWN = null;
function maskId(v){
  const s = String(v || '');
  return s.length <= 4 ? s : '•'.repeat(Math.max(4, s.length - 4)) + s.slice(-4);

/* The scan of the document, rather than the number typed off it.
   The file itself is never linked directly: the bucket is private and there is

function idDocBlock(c){

async function idDocOpen(path){
  try{
    /* Sixty seconds. Long enough to open, short enough that a copied link in a
       chat message is dead before anyone else clicks it. */
    const url = await SB.signedUrl(path, 60);
    window.open(url, '_blank', 'noopener');
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

async function idDocUpload(contactId){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const el = $('idDocFile');
  const file = el && el.files && el.files[0];
  if(!file) return toast(T('idoc_pick'));
  if(file.size > 15 * 1024 * 1024) return toast(T('idoc_big'));
  try{
    toast(T('idoc_working'));
    const buf  = await file.arrayBuffer();
    const fp   = await docFingerprint(buf);
    /* DOC-01. The same key builder as every other upload — this path had its
       own copy of the same colliding scheme. */
    const path = await SB.upload(objectKey(file, 'identity/' + contactId + '/'), file);
    await SB.ins('documents', [{
      kind:'identity', storage_path:path, filename:file.name,
      mime:file.type || 'application/octet-stream', bytes:file.size,
      sha256: fp.hex, readable:false,
      /* Keyed on the CONTACT, never on the flat — see the patch comment. A
         unit-keyed ref_key would be readable by the resident of that unit. */
      ref_key:'identity:' + contactId
    }]);
    await CRM.reload(); await contactDrawer(contactId); toast(T('idoc_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

/* A contact's flat and lease term, from contact_tenancy. Both facts were
   already in `leases`; nothing here is deduced.

   A lease that has ENDED is shown as ended rather than left blank. Three of the
   twenty residents are in that state, and a blank cell would read as "we do not
   know" — which is a different thing and this project keeps them apart. */
function unitCell(c){
  const t = CRM.tenancy(c.id);
  if(!t.length) return '<span class="sub2">—</span>';
  const cur = t[0];
  return esc(cur.unit_id) + (cur.is_current ? ''
    : ` <span class="pill p-neut">${T('crm_ended')}</span>`);
}
function leaseCell(c){
  const t = CRM.tenancy(c.id);
  if(!t.length) return '<span class="sub2">—</span>';
  const cur = t[0];
  const term = (cur.starts_on ? fmtISO(cur.starts_on) : '—') + ' → ' +
               (cur.ends_on   ? fmtISO(cur.ends_on)   : '—');
  /* Never show one of several without saying there are others. */
  const more = t.length > 1
    ? ` <span class="sub2" title="${T('crm_earlier_t')}">+${NUM(t.length-1)} ${T('crm_earlier')}</span>`
    : '';
  return term + more;
}

async function contactSave(id){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const v = k => ($(k) && $(k).value || '').trim();
  if(!v('cNameEn')) return toast(T('crm_need_name'));
  try{
    /* Stored canonically — the database requires digits only, so the same
       person cannot arrive twice as one string with spaces and one without.
       No worked example is given here on purpose: an ID-shaped literal in a
       comment stops every scanner looking for a leaked identity number, and a
       check that cries wolf gets switched off. Upper-
       cased for passports, which are alphanumeric. */
    const idNo = v('cIdNo').replace(/[\s-]/g,'').toUpperCase() || null;
    const idType = $('cIdType').value;
    if(idNo && idType === 'unknown') return toast(T('crm_id_need_type'));
    const row = {
      name_en: v('cNameEn'), name_ar: v('cNameAr') || null,
      kind: $('cKind').value,
      phone: v('cPhone') || null, email: v('cEmail') || null,
      id_type: idType,
      id_expires_on: v('cIdExp') || null,
      nationality: v('cNat') || null,
      job_title:   v('cJob') || null,
      employer:    v('cEmp') || null,
      note: v('cNote') || null
    };
    /* An empty number box on an EDIT means "leave it as it is", not "delete
       it". Only send the field when something was actually typed. On a new
       contact an empty box does mean none, so it is sent as null. */
    if(idNo || !id) row.id_number = idNo;
    if(id) await SB.upd('contacts', 'id=eq.' + id, row);
    else   await SB.ins('contacts', [row]);
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

async function logContactSave(contactId){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const when = $('iWhen') && $('iWhen').value;
  if(!when) return toast(T('crm_need_when'));
  const at = new Date(when);
  if(at.getTime() > Date.now() + 60000) return toast(T('crm_future'));
  try{
    /* recorded_by is NOT sent: the database defaults it to the signed-in user,
       and its policy refuses any other value. A call logged under a colleague's
       name would make the whole log stop being evidence of anything. */
    await SB.ins('interactions', [{
      contact_id: contactId,
      channel: $('iCh').value, direction: $('iDir').value,
      occurred_at: at.toISOString(),
      subject: (($('iSub') && $('iSub').value) || '').trim() || null,
      body:    (($('iBody') && $('iBody').value) || '').trim() || null
    }]);
    closeDrawer(); await contactDrawer(contactId); toast(T('crm_logged'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

const STAGES = [['enquiry','sg_enq'],['viewing','sg_view'],['offer','sg_offer'],['contract','sg_con']];

/* The database stores a source as an enum — walk_in, agent, renewal. Those are
   column values, not words for a person to read, and in Arabic they are not
   words at all. Anything shown on screen goes through here. */
const SOURCES = {unknown:'src_unknown', walk_in:'src_walk', phone:'src_phone',
                 whatsapp:'src_wa', email:'src_email', agent:'src_agent',
                 referral:'src_ref', portal:'src_portal', renewal:'src_renewal',
                 other:'src_other'};
const srcName = v => SOURCES[v] ? T(SOURCES[v]) : T('src_other');

/* contact_timeline.what is assembled in SQL, so it arrives as column values:
   'whatsapp (in)', 'enquiry', 'open'. Those are fine as data and wrong on a
   screen — in Arabic they are not words at all. The view stays as it is; the
   translation belongs here, where the language is known. */
const CHANNELS = {call:'ch_call', whatsapp:'ch_wa', sms:'ch_sms', email:'ch_email',
                  visit:'ch_visit', letter:'ch_letter', other:'ch_other'};
const STAGEKEY = {enquiry:'sg_enq', viewing:'sg_view', offer:'sg_offer',
                  contract:'sg_con', won:'sg_won', lost:'sg_lost'};
const TASKKEY  = {open:'todo_open', done:'todo_done', cancelled:'todo_cancelled'};

function tlWhat(r){
  const w = String(r.what || '');
  if(r.entry === 'interaction'){
    const m = w.match(/^(\w+)\s*\((in|out)\)$/);
    if(!m) return esc(w);
    return T(CHANNELS[m[1]] || 'ch_other') + ' · ' + T(m[2] === 'in' ? 'dir_in_s' : 'dir_out_s');
  }
  if(r.entry === 'deal') return T(STAGEKEY[w] || 'sg_enq');
  if(r.entry === 'task') return T(TASKKEY[w]  || 'todo_open');
  return esc(w);
}

async function dealMove(id){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const stage = $('mStage').value;
  const lost  = ($('mLost') && $('mLost').value || '').trim();
  if(stage === 'lost' && !lost) return toast(T('pipe_need_why'));
  const patch = {stage};
  if(stage === 'won' || stage === 'lost'){ patch.closed_on = new Date().toISOString().slice(0,10); }
  if(stage === 'lost') patch.lost_reason = lost;
  try{
    await SB.upd('deals', 'id=eq.' + id, patch);
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }

async function taskSave(){

     sentence rather than as a 42501 from PostgREST. */

/* Cancelling asks why, because the database refuses without a reason — and it
   refuses on purpose: a dropped commitment with no note becomes no record that
   anything was ever promised. */
function taskClose(id, how){
  if(how === 'done'){ return taskCloseSave(id, 'done', null); }
  openDrawer(T('todo_cancel'), `

      onclick="taskCloseSave(${id},'cancelled',($('tWhy').value||'').trim())">${T('save')}</button>`);
}

async function taskCloseSave(id, status, outcome){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  if(status === 'cancelled' && !outcome) return toast(T('todo_need_why'));
  try{
    await SB.upd('tasks', 'id=eq.' + id, {
      status, outcome: outcome || null,
      closed_at: new Date().toISOString(), closed_by: CRM.uid()
    });
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

/* ------------------------------ language ------------------------------ */
/* Set by the backend boot block below, which owns the header's Connect button.
   Without this the button keeps the previous language until its own 5-second
   timer comes round — a visible English word sitting in an Arabic header.
   Constitution II: Arabic is not a layer that catches up later. */
let sbLabelTick = () => {};

function setLang(l){
 /* Found while measuring the header at phone width. Switching language flips
    the writing direction, and the CLOSED drawer is parked off the right edge in
    English and off the left in Arabic — so the transform changes from +102% to
    -102% and the transition obligingly animates it ACROSS the screen. For a
    quarter of a second a drawer nobody opened sweeps over the whole console,
    and anything tapped in that moment lands on it instead.

    Nothing moved. The page was re-laid out, which is not an animation, so
    transitions are suspended for the frame it takes. */
 try{ document.documentElement.classList.add('reflowing'); }catch(e){}
 LANG=l;
 document.documentElement.lang=l;
 document.documentElement.dir=l==='ar'?'rtl':'ltr';
 document.body.classList.toggle('ar',l==='ar');
 closeDrawer(); render(); sbLabelTick();
 try{
   requestAnimationFrame(() => requestAnimationFrame(() =>
     document.documentElement.classList.remove('reflowing')));
 }catch(e){ document.documentElement.classList.remove('reflowing'); }
}

/* ==========================================================================
   SB — Supabase, without a library

   Both prototypes are single files with nothing loaded from anywhere else,
   and that is worth keeping: a file that works from a memory stick works in
   a site office. So the backend is spoken to directly — PostgREST over
   fetch, storage over fetch, Realtime over a WebSocket. No CDN, no bundle.

   The key below is the PUBLISHABLE key. It is meant to sit in a public page:
   it identifies the project, it does not grant anything. Every row this
   application can see or change is decided by the access rules in the
   database, against the signed-in user. Without a session it reads nothing —
   which is checked, not assumed.
   ========================================================================== */
/* ==========================================================================
   Users and roles — the administrator's screen
   ========================================================================== */

/* Shown above every page, on every screen, for a viewer. A person who finds

const rlPill = r => r==='admin' ? 'p-crit' : r==='manager' ? 'p-info' : 'p-neut';

/* The three different things that can be wrong with somebody's sign-in, kept
   apart, because the fix for each is different and an administrator staring at
   "cannot sign in" has no way to guess which one it is. */
function acctCell(m){
  if(!m.has_account) return `<span class="pill p-warn">${T('rl_acc_none')}</span>`;
  if(!m.claim_ok)    return `<span class="pill p-warn">${T('rl_acc_noclaim')}</span>`;

const ACTIONS = {added:'ac_added', role_changed:'ac_role_changed',
                 deactivated:'ac_deactivated', reactivated:'ac_reactivated',
                 details_changed:'ac_details_changed', linked:'ac_linked',
                 removed:'ac_removed'};
/* The trail is written in the database's own vocabulary; nothing raw reaches
   the screen. An unrecognised action is shown as itself rather than as a
   guess — this console has had three separate leaks of raw enum values and
   every one of them was a translation table missing a row. */
function acName(a){ return ACTIONS[a] ? T(ACTIONS[a]) : String(a || ''); }
function trailWhat(h){
  if(h.action === 'role_changed' && h.old_role && h.new_role)
    return acName(h.action) + ': ' + rlName(h.old_role) + ' → ' + rlName(h.new_role);
  if(h.action === 'added' && h.new_role)
    return acName(h.action) + ': ' + rlName(h.new_role);
  return acName(h.action);
}

async function roleSave(id){
  const val = k => ($(k) && $(k).value || '').trim();
  const m = id ? ROLES.roster().find(x => String(x.id) === String(id)) : null;
  const mail = (m ? m.email : val('rMail')).toLowerCase();
  if(!mail) return toast(T('rl_need_mail'));
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)) return toast(T('rl_bad_mail'));
  const row = {
    name_en:   val('rNameEn') || null,
    name_ar:   val('rNameAr') || null,
    job_title: val('rJob')    || null,
    phone:     val('rPhone')  || null,
    note:      val('rNote')   || null
  };
  /* Never sent for your own row. The database refuses it by trigger, but a
     request that is certain to be refused should not be made at all — the
     refusal would arrive as an error where the honest answer is that the box
     was disabled on purpose. */
  const mine = !!m && m.email === (SB.email() || '').toLowerCase();
  if(!mine) row.role = ($('rRole') && $('rRole').value) || 'viewer';
  if(!m){ row.email = mail; row.active = true; }
  try{
    if(m) await SB.upd('staff_members', 'id=eq.' + encodeURIComponent(m.id), row);
    else  await SB.ins('staff_members', [row]);
    await ROLES.reload(); closeDrawer(); render(); toast(T('rl_saved'));
  }catch(e){ toast(T('rl_err') + ' ' + (e.message || e)); }
}

    await ROLES.reload(); closeDrawer(); render(); toast(T('rl_saved'));

const SB = (function(){
  const BASE = ENV.base;
  const KEY  = ENV.key;
  const SKEY = ENV.prefix + '.sb.session.v1';
  const TOPIC = 'realtime:' + ENV.prefix;

  let sess = null;
  try{ sess = JSON.parse(localStorage.getItem(SKEY) || 'null'); }catch(e){ sess = null; }

  /* CON-06. The socket sent its token once, when it opened, and never again.
     save() updated memory and storage, so every HTTP request went out with the
     fresh token while the subscription sat on the one that had expired — a
     console left open across an expiry had current credentials for reads and a
     dead channel for changes. Realtime has a message for exactly this; it is
     sent whenever the token this tab holds changes hands, by whichever route. */
  function pushToken(){
    try{
      if(sess && sess.access_token && typeof onTokenChange === 'function') onTokenChange(sess.access_token);
    }catch(e){}
  }
  function save(s){
    const was = sess && sess.access_token;
    sess = s || null;
    try{ sess ? localStorage.setItem(SKEY, JSON.stringify(sess)) : localStorage.removeItem(SKEY); }
    catch(e){}
    if(sess && sess.access_token !== was) pushToken();
  }
  /* What is in storage RIGHT NOW, which is not always what this tab has in
     hand: another tab signing in, refreshing or signing out writes here. */
  function stored(){
    try{ return JSON.parse(localStorage.getItem(SKEY) || 'null'); }catch(e){ return null; }
  }

  const token = () => (sess && sess.access_token) || KEY;
  const hdr = extra => Object.assign({apikey:KEY, Authorization:'Bearer '+token()}, extra||{});

  /* AUTH-01. A request with no deadline is a screen that waits for ever. The
     audit asked for timeouts and there were none: a connection that opens and
     then stops answering — a captive portal, a dead mobile cell, a proxy that
     swallows the response — left `await fetch` pending with no upper bound, and
     the spinner with it.

     A timeout is deliberately shaped like an outage rather than a refusal: no
     `status`, so `revoked()` answers false, so a request that timed out during
     a refresh leaves the session alone. That is the same distinction AUTH-01
     turns on, arriving by a second route. */
  const TIMEOUT = 20000;
  async function call(path, opt){
    opt = opt || {};
    const ctl = new AbortController();
    const bell = setTimeout(() => ctl.abort(), opt.timeout || TIMEOUT);
    let r, txt;
    /* CON-07. The deadline used to be cleared the moment the HEADERS arrived,
       and the body was read outside it. A server or proxy that sends headers
       and then stalls left the request pending for ever, past the timeout the
       caller thought it had. The body is read inside the timed region now, and
       the clock stops only when the whole response is in hand. */
    try {
      r = await fetch(BASE + path, Object.assign({}, opt, {signal: ctl.signal}));
      txt = await r.text();
    } catch(e) {
      if(e && e.name === 'AbortError')
        throw Object.assign(new Error('the request timed out'), {timeout: true});
      throw e;
    } finally { clearTimeout(bell); }
    let body = null;
    try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
    if(!r.ok){
      const msg = (body && (body.message || body.error_description || body.msg ||
                            body.error || body.hint)) || ('HTTP ' + r.status);
      throw Object.assign(new Error(msg), {status:r.status, body:body});
    }
    /* CON-08. A paging loop needs to know how many rows exist, not only how
       many came back — a server cap below the page size makes those two
       different numbers, and "fewer than I asked for" then means "capped",
       not "finished". PostgREST says in Content-Range: "0-99/250". */
    if(opt.withRange){
      let range = null;
      try{ range = r.headers && r.headers.get ? r.headers.get('content-range') : null; }catch(e){}
      return {body, range};
    }
    return body;
  }

  /* ------------------------------- session ------------------------------- */
  function claims(){
    if(!sess || !sess.access_token) return null;
    try{
      let p = sess.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      const bin = atob(p);
      const u8 = Uint8Array.from(bin, c=>c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(u8));
    }catch(e){ return null; }
  }
  const stale   = () => { const c = claims(); return !c || (c.exp*1000) < Date.now() + 60000; };
  const isStaff = () => { const c = claims(); const m = c && (c.app_metadata || c.user_metadata) || {};
                          return m.role === 'staff'; };
  const email   = () => { const c = claims(); return (c && c.email) || ''; };
  const signedIn= () => !!(sess && sess.access_token);

  async function signIn(mail, pass){
    const s = await call('/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email:mail, password:pass})});
    save(s);
    return s;
  }
  /* AUTH-01. This used to be `catch(e){ save(null); return null; }` — one line,
     and it threw the session away for ANY reason the refresh did not succeed.
     A tunnel, a dropped wifi, a five-second outage at the auth server: the
     refresh token was erased from storage, and erased is permanent. The person
     was signed out and had to find their password, because the network went
     away for a moment.

     Three things are now separated that were one thing before.

     REFUSED versus UNREACHABLE. Only an answer from the server ends a session.
     `call` attaches `status` to everything the server answered; a request that
     never arrived throws a TypeError with no status at all. So no status, or a
     5xx, or a timeout, means "ask again later" and the session is left exactly
     as it was. 400, 401, 403 and 422 mean the server looked at the token and
     said no, and only then is it cleared.

     ONE AT A TIME. Supabase rotates the refresh token: the moment one refresh
     succeeds, the token it used stops working. Two refreshes racing meant the
     loser got "Invalid Refresh Token: Already Used" — a 400, a refusal — and
     destroyed a session that had just been renewed successfully by the winner.
     Every caller now shares one in-flight promise.

     AND THE OTHER TAB. The same rotation across two tabs is not something a
     shared promise can fix. Before ending anything, look at what is actually in
     storage: if it holds a different session with time left on it, another tab
     refreshed and this failure was a race rather than a revocation, so adopt it
     instead of signing the person out of both tabs. */
  const revoked = e => {
    const s = e && e.status;
    return s === 400 || s === 401 || s === 403 || s === 422;
  };
  let refreshing = null;
  function refresh(){
    if(!sess || !sess.refresh_token) return Promise.resolve(null);
    if(refreshing) return refreshing;
    refreshing = (async () => {
      try{
        const s = await call('/auth/v1/token?grant_type=refresh_token', {
          method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'},
          body: JSON.stringify({refresh_token: sess.refresh_token})});
        save(s); return s;
      }catch(e){
        const other = stored();
        if(other && other.access_token && sess && other.access_token !== sess.access_token){
          sess = other;                       /* adopt, do not overwrite */
          pushToken();                        /* CON-06: the socket follows */
          return stale() ? null : sess;
        }
        if(revoked(e)) save(null);
        return null;
      }finally{ refreshing = null; }
    })();
    return refreshing;
  }
  function signOut(){
    try{ fetch(BASE+'/auth/v1/logout', {method:'POST', headers:hdr()}); }catch(e){}
    save(null);
    try{ if(ws) ws.close(); }catch(e){}
  }
  /* A stored session that has expired is refreshed before anything is read,
     so a console left open overnight does not come back to empty screens. */
  async function ready(){
    if(!signedIn()) return false;
    if(stale()) return !!(await refresh());
    return true;
  }

  /* …and it is true because EVERY authenticated request goes through here,
     rather than because `ready()` happens to be called first somewhere at
     start-up. It was the latter before: one call at boot, and a page left open
     past the token's hour sent an expired one and got an empty screen.

     The header must be built INSIDE the callback. A header built before the
     refresh carries the token the refresh has just replaced, which is the
     failure this is meant to remove, arriving by a different door.

     One retry, not a loop. If a request comes back 401 despite the check above
     — the clock is off, the token was revoked elsewhere — the session is
     refreshed once and the request is made once more. A second 401 is a real
     answer and is allowed through to the caller. */
  async function authed(make, opts){
    if(signedIn() && stale()) await refresh();
    try{
      return await make();
    }catch(e){
      /* AUTH-01. The retry used to apply to everything, writes included. A 401
         from PostgREST is refused at the auth layer before the statement runs,
         so replaying an insert almost certainly does not write twice — but
         "almost certainly" is not a thing to build a rent ledger on, and the
         audit asked for the opposite default in as many words: retry writes
         only with an idempotency mechanism.

         So a read retries on its own. A write retries only when the caller has
         said how a duplicate would be recognised, by passing `replay`. The one
         caller that does is the work-order insert, which recognises its own row
         by reading it back. */
      if(e && e.status === 401 && signedIn() && (!opts || opts.replay !== false)
         && await refresh()) return await make();
      throw e;
    }
  }
  /* A read: replaying it changes nothing. */
  const authedRead = make => authed(make, {replay: true});
  /* A write: not replayed unless the caller can tell a duplicate from a first
     attempt. */
  const authedWrite = make => authed(make, {replay: false});

  /* ----------------------------- passwords -------------------------------
     Two things the console could not do before, and both are needed by
     everyone who will ever hold an account here.

     setPassword changes it for whoever is signed in. It goes out on the
     session token, so the server decides whether the caller is entitled —
     there is no client-side check to get wrong, and no way to aim it at
     another account.

     adoptRecovery reads the session Supabase puts in the URL fragment after
     someone follows a recovery link. Without this the link was worthless:
     the fragment was ignored, the page showed its ordinary sign-in card, and
     the link — which is single use — had been spent for nothing. The tokens
     are taken out of the address bar immediately afterwards, because a
     recovery link left in history is a way back into the account. */
  async function setPassword(next){
    if(!signedIn()) throw new Error('not signed in');
    return await call('/auth/v1/user', {
      method:'PUT',
      headers: hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({password: next})});
  }

  function adoptRecovery(){
    const h = String(location.hash || '').replace(/^#/, '');
    if(!h) return null;
    const p = new URLSearchParams(h);
    const at = p.get('access_token');
    const kind = p.get('type');
    const err = p.get('error_description') || p.get('error');
    const clean = () => { try{ history.replaceState(null, '',
                            location.pathname + location.search); }catch(e){} };
    if(err){ clean(); return {type:'error', message:err.replace(/\+/g,' ')}; }
    if(!at) return null;
    save({access_token: at, refresh_token: p.get('refresh_token') || null,
          token_type: p.get('token_type') || 'bearer',
          expires_in: Number(p.get('expires_in') || 3600)});
    clean();
    return {type: kind || 'session'};
  }

  /* --------------------------------- rest -------------------------------- */
  /* CON-08. sel() can be asked for the count. It then sends Prefer:
     count=exact, reads the server's total off Content-Range, and hands the
     rows back with `total` attached as a non-enumerable property — so a
     caller that did not ask sees the same plain array it always saw, and a
     harness that stubs SB.sel with a plain array is read as "no total
     offered". The paging loop below goes through API.sel for exactly that
     reason: a private counted read broke twenty-seven suites in one go, each
     of which had stubbed SB.sel and was suddenly talking to the network. */
  const sel = (t,q,o) => authedRead(() => call('/rest/v1/'+t+(q?'?'+q:''),
      {headers:hdr(o && o.count ? {Prefer:'count=exact'} : undefined), withRange: !!(o && o.count)}))
    .then(r => {
      if(!(o && o.count)) return r;
      const rows = Array.isArray(r.body) ? r.body : [];
      const m = /^(\d+)-(\d+)\/(\d+|\*)$/.exec(String(r.range || ''));
      try{ Object.defineProperty(rows, 'total', {value: m && m[3] !== '*' ? Number(m[3]) : null, enumerable:false}); }catch(e){}
      return rows;
    });
  const ins = (t,rows)   => authedWrite(() => call('/rest/v1/'+t, {method:'POST',
                              headers:hdr({'Content-Type':'application/json', Prefer:'return=representation'}),
                              body:JSON.stringify(rows)}));
  /* An upsert IS its own idempotency mechanism: the conflict target decides,
     and a second attempt merges rather than duplicating. */
  const ups = (t,rows,c) => authedRead(() => call('/rest/v1/'+t+(c?'?on_conflict='+c:''), {method:'POST',
                              headers:hdr({'Content-Type':'application/json',
                                Prefer:'resolution=merge-duplicates,return=representation'}),
                              body:JSON.stringify(rows)}));
  /* A PATCH to a filtered set writes the same values twice with the same
     result; it is idempotent by construction, unlike an insert. */
  const upd = (t,q,patch)=> authedRead(() => call('/rest/v1/'+t+'?'+q, {method:'PATCH',
                              headers:hdr({'Content-Type':'application/json', Prefer:'return=representation'}),
                              body:JSON.stringify(patch)}));
  const del = (t,q)      => authedRead(() => call('/rest/v1/'+t+'?'+q, {method:'DELETE', headers:hdr()}));
  /* The three Postgres functions a signed-in user is allowed to call. All
     three answer about the CALLER and nobody else: what role they hold, and —
     once, on first sign-in — linking their roster row to their account. */
  /* A named write. `rate_wo` sets one column to a value the caller supplies, so
     running it twice leaves the same row; `save_register` applies a whole
     register and is likewise a replacement rather than an addition. Neither
     accumulates, so a replay is safe. A function that ever appends would have
     to be called through authedWrite instead. */
  const rpc = (fn,args)  => authedRead(() => call('/rest/v1/rpc/'+fn, {method:'POST',
                              headers:hdr({'Content-Type':'application/json'}),
                              body:JSON.stringify(args || {})}));
  /* The comment above says a function that appends would have to go through
     authedWrite. `record_export` appends, so here is that door rather than a
     fifth use of the wrong one. A replayed export log is a second row claiming
     a second export that never happened — a quiet lie in the one table whose
     whole purpose is to be believed. */
  const rpcAppend = (fn,args) => authedWrite(() => call('/rest/v1/rpc/'+fn, {method:'POST',
                              headers:hdr({'Content-Type':'application/json'}),
                              body:JSON.stringify(args || {})}));

  /* ------------------------------- storage ------------------------------- */
  /* The bucket is private. Nothing is ever fetched by a plain URL; a link is
     signed on demand and stops working shortly afterwards. */
  const UPLOAD_TIMEOUT = 2 * 60 * 1000;
  function upload(path, file){
    /* Not replayed: an upload that landed and lost its answer would be stored
       twice under two keys, and the second would be an orphan nobody knows
       about. A file takes longer than a row, so its deadline is its own. */
    return authedWrite(async () => {
      const ctl = new AbortController();
      const bell = setTimeout(() => ctl.abort(), UPLOAD_TIMEOUT);
      let r;
      try {
        r = await fetch(BASE + '/storage/v1/object/documents/' + encodeURI(path), {
          method:'POST', signal: ctl.signal,
          headers: hdr({'x-upsert':'false', 'Content-Type': file.type || 'application/octet-stream'}),
          body: file});
      } catch(e) {
        if(e && e.name === 'AbortError')
          throw Object.assign(new Error('the upload timed out'), {timeout: true});
        throw e;
      } finally { clearTimeout(bell); }
      if(!r.ok){
        const t = await r.text();
        throw Object.assign(new Error('upload failed'), {status:r.status, body:t});
      }
      return 'documents/' + path;
    });
  }
  function signedUrl(path, secs){
    const p = String(path).replace(/^documents\//, '');
    return authedRead(async () => {
      const b = await call('/storage/v1/object/sign/documents/' + encodeURI(p), {
        method:'POST', headers:hdr({'Content-Type':'application/json'}),
        body: JSON.stringify({expiresIn: secs || 60})});
      return BASE + '/storage/v1' + b.signedURL;
    });
  }

  /* ------------------------------- realtime ------------------------------ */
  let ws = null, ref = 0, hb = null, watchers = [], tables = [], back = 0, joinRef = null;
  let joined = false;                     /* has this page ever had a live channel */
  let rt = 'off';                                  /* off | joining | live | error */

  const send = o => { try{ if(ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }catch(e){} };

  /* CON-06. Called by save() and by the adopt-another-tab path with the token
     the tab now holds. Sent only when there is a socket to send it on; a socket
     that opens later sends the current token itself in onopen. */
  let lastSentToken = null;
  function onTokenChange(tok){
    if(!tok || tok === lastSentToken) return;
    if(ws && ws.readyState === 1){
