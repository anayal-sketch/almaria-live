<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<!-- SEC-04. What a static page can do about its own response headers, which
     on GitHub Pages is: this, and not the rest.

     The valuable clause is connect-src. The staff token lives in localStorage
     and this application has had unescaped HTML sinks as recently as this
     morning, so the question that matters is not only "can a script be
     injected" but "where could it send what it found". With this, nowhere: the
     only host the page may talk to is the project's own API.

     WHAT THIS DOES NOT DO, said plainly rather than left to be assumed.

     script-src carries 'unsafe-inline' because the whole application is one
     inline script and about a hundred inline handlers. So this does NOT stop an
     injected inline script from running. Removing that clause means moving
     every handler to an addEventListener and every style to a class, which is
     real work and real risk, and it is not done here.

     frame-ancestors cannot be set from a meta element at all — only as a
     response header — so clickjacking protection is not available from this
     file. Nor are X-Content-Type-Options, Referrer-Policy or Permissions-Policy.
     Those need a host that serves configurable headers, which GitHub Pages is
     not. That is a hosting decision and it is recorded as one. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob:;
  font-src 'self' data:;
  connect-src 'self' https://oaxasgfdfxrkbllzwvna.supabase.co wss://oaxasgfdfxrkbllzwvna.supabase.co;
  base-uri 'none';
  form-action 'none';
  object-src 'none';
  frame-src 'none';
  worker-src 'self' blob:;
  manifest-src 'self'">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00293B">
<title>Almaria Residence — Building Management Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 540'%3E%3Crect width='640' height='540' fill='%2300293B'/%3E%3Cg fill='none' stroke='%23E8C058' stroke-width='40'%3E%3Cpath d='M35 520V225L230 25L320 116'/%3E%3Cpath d='M229 520V226L425 25L615 226V520'/%3E%3Cpath d='M365 155L425 218V520'/%3E%3Cpath d='M325 375V520'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  /* Almaria brand — UI chrome only */
  --teal-900:#00293B; --teal-800:#00374E; --teal:#004860; --teal-600:#0A5B75;
  --gold:#E8C058; --gold-deep:#C99B32; --gold-soft:#FBF3DE; --gold-ink:#7A5C12;

  /* chart series — validated set (see note in the app) */
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100;
  /* status — fixed, never themed; always with icon + label */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-soft:#E6F4E6; --warning-soft:#FDF3DD; --serious-soft:#FCEDE6; --critical-soft:#FAE8E8;

  /* chart chrome */
  --surface:#FFFFFF; --plane:#F4F6F7;
  --ink:#0F2530; --ink-2:#41545F; --muted:#7C8D97;
  --grid:#E8EDEF; --axis:#CBD5D9; --line:#E2E8EA;
  --r:12px; --shadow:0 1px 2px rgba(15,37,48,.05), 0 6px 18px rgba(15,37,48,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",sans-serif;
  background:var(--plane); color:var(--ink); font-size:14px; line-height:1.5;
  display:flex; overflow:hidden;
}
body.ar{font-family:"Noto Sans Arabic",system-ui,"Segoe UI",sans-serif}
button{font-family:inherit}

/* ---------------- sidebar ---------------- */
.side{
  width:236px; flex:none; background:var(--teal-900); color:#fff;
  display:flex; flex-direction:column; height:100vh
}
.side .brand{padding:20px 18px 16px; border-bottom:1px solid rgba(255,255,255,.10)}
.side .brand img{height:15px;width:206px;object-fit:contain;display:block;opacity:.95}
.side .brand .sub{
  font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:rgba(255,255,255,.5);
  margin-top:9px; font-weight:700
}
.nav{flex:1; overflow-y:auto; padding:12px 10px}
.nav button{
  width:100%; display:flex; align-items:center; gap:11px; padding:10px 12px; margin-bottom:2px;
  border:none; background:none; color:rgba(255,255,255,.72); border-radius:9px;
  font-size:13.5px; font-weight:600; cursor:pointer; text-align:start
}
.nav button:hover{background:rgba(255,255,255,.07); color:#fff}
.nav button.on{background:rgba(232,192,88,.14); color:var(--gold)}
.nav .grp{
  font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.34);
  padding:16px 12px 7px; font-weight:800
}
.nav .cnt{
  margin-inline-start:auto; background:rgba(255,255,255,.14); color:#fff; border-radius:20px;
  padding:1px 7px; font-size:11px; font-weight:700
}
.nav button.on .cnt{background:var(--gold); color:var(--teal-900)}
.side .foot{padding:14px 18px; border-top:1px solid rgba(255,255,255,.10); font-size:11.5px; color:rgba(255,255,255,.45)}

/* ---------------- main ---------------- */
.main{flex:1; display:flex; flex-direction:column; height:100vh; overflow:hidden}
.top{
  flex:none; background:#fff; border-bottom:1px solid var(--line);
  padding:14px 26px; display:flex; align-items:center; gap:16px
}
.top h1{margin:0; font-size:19px; font-weight:800; letter-spacing:-.01em}
.top .sub{font-size:12.5px; color:var(--muted); margin-top:1px}
.spacer{flex:1}
.pgid{min-width:0}
.pgid h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* MOB-01. On a desktop the group is not a box at all, so the header is exactly
   the flex row it always was. */
.topacts{display:contents}
.tbtn{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 13px;
  font-size:12.5px; font-weight:700; color:var(--ink-2); cursor:pointer; display:flex; align-items:center; gap:7px
}
.tbtn:hover{border-color:var(--teal-600); color:var(--teal)}
.tbtn.pri{background:var(--teal); border-color:var(--teal); color:#fff}
.tbtn.pri:hover{background:var(--teal-600)}
.who{display:flex; align-items:center; gap:10px; padding-inline-start:14px; border-inline-start:1px solid var(--line)}
.who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#0A5B75,#00293B);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.who .nm{font-size:12.5px;font-weight:700;line-height:1.25}
.who .rl{font-size:11px;color:var(--muted)}

.scroll{flex:1; overflow-y:auto; padding:22px 26px 40px}

/* ---------------- primitives ---------------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card .hd{padding:15px 18px 0; display:flex; align-items:flex-start; gap:12px}
.card .hd h2{margin:0; font-size:14.5px; font-weight:800}
.card .hd .d{font-size:12px; color:var(--muted); margin-top:2px}
.card .bd{padding:16px 18px 18px}
.grid{display:grid; gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g21{grid-template-columns:2fr 1fr}
.g12{grid-template-columns:1fr 2fr}
@media (max-width:1240px){.g6{grid-template-columns:repeat(3,1fr)} .g21,.g12,.g2{grid-template-columns:1fr}}
.mb{margin-bottom:16px}
.sect{font-size:12px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted); font-weight:800; margin:26px 0 12px}
.sect:first-child{margin-top:0}

/* stat tile */
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px 16px; box-shadow:var(--shadow)}
.stat .k{font-size:11.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.stat .v{font-size:27px; font-weight:800; letter-spacing:-.02em; margin:7px 0 3px; line-height:1}
.stat .m{font-size:11.5px; font-weight:700; display:flex; align-items:center; gap:5px}
.up{color:var(--good)} .down{color:var(--critical)} .flat{color:var(--muted)}
.meter{height:5px;border-radius:99px;background:var(--grid);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--teal-600)}

/* pill / status — icon + label, never colour alone */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 9px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill svg{flex:none}
.p-good{background:var(--good-soft);color:#0a7a0a}
.p-warn{background:var(--warning-soft);color:#8a6205}
.p-ser{background:var(--serious-soft);color:#a54f26}
.p-crit{background:var(--critical-soft);color:#a52c2c}
.p-neut{background:#EEF2F3;color:#546873}
.p-info{background:#E7F0F4;color:#00506B}

/* table */
table{width:100%;border-collapse:collapse}
th{
  text-align:start; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  font-weight:800; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; background:#FBFCFC
}
td{padding:11px 12px; border-bottom:1px solid var(--grid); font-size:13px; vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr.click{cursor:pointer}
tbody tr.click:focus-visible{outline:2px solid var(--teal-600);outline-offset:-2px}
tbody tr.click:hover{background:#F7FAFB}
.num{text-align:end; font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--ink-2)}
.tw{overflow-x:auto}
.strong{font-weight:700}
.sub2{font-size:11.5px;color:var(--muted)}

/* inline magnitude bar inside a table cell */
.ibar{display:flex;align-items:center;gap:8px;min-width:120px}
.ibar .t{flex:1;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.ibar .t i{display:block;height:100%;border-radius:99px;background:var(--series-1)}
.ibar .n{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-2);min-width:56px;text-align:end}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{
  border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 11px;
  font-size:12.5px; font-family:inherit; color:var(--ink); font-weight:600; outline:none
}
.filters select:focus,.filters input:focus{border-color:var(--teal-600)}
.chipf{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.chipf.on{background:var(--teal);border-color:var(--teal);color:#fff}

/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2);font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-inline-end:6px;vertical-align:-1px}
.viewtog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.viewtog button{border:none;background:#fff;padding:6px 11px;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.viewtog button.on{background:var(--teal);color:#fff}

/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{
  position:absolute;pointer-events:none;background:var(--teal-900);color:#fff;border-radius:8px;
  padding:8px 11px;font-size:12px;font-weight:600;opacity:0;transition:opacity .12s;z-index:5;white-space:nowrap;
  box-shadow:0 6px 20px rgba(0,41,59,.25)
}
.tip.on{opacity:1}
.tip b{display:block;font-size:11px;color:var(--gold);font-weight:700;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px}
.tip .r i{width:8px;height:8px;border-radius:2px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(9,26,34,.42);opacity:0;pointer-events:none;transition:.2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
/* CON-02. While a write is in flight the drawer stays open and its controls
   are visibly out of reach. The person sees the thing they pressed, greyed,
   until the database has answered — not a green toast and a closed drawer
   over a refusal that has not arrived yet. */
body.saving #drawer .btn, body.saving #drawer .tbtn, body.saving #drawer .inp,
body.saving #drawer select{opacity:.55; pointer-events:none}
body.saving #drawer{cursor:progress}
.drawer{
  position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(600px,94vw);background:var(--plane);
  z-index:50;transform:translateX(102%);transition:transform .26s cubic-bezier(.3,.8,.35,1);
  display:flex;flex-direction:column;box-shadow:-14px 0 40px rgba(9,26,34,.18)
}
html[dir="rtl"] .drawer{transform:translateX(-102%)}
/* A language change is a re-layout, not a movement. See setLang. */
html.reflowing *, html.reflowing *::before, html.reflowing *::after{
  transition:none!important; animation:none!important
}
.drawer.on{transform:translateX(0)!important}
.drawer .dh{background:#fff;border-bottom:1px solid var(--line);padding:16px 20px;display:flex;align-items:flex-start;gap:12px;flex:none}
.drawer .dh h2{margin:0;font-size:16px;font-weight:800}
.drawer .db{flex:1;overflow-y:auto;padding:18px 20px 30px}
.x{border:none;background:none;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px;display:flex}
.x:hover{background:var(--grid);color:var(--ink)}

.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;font-weight:700}

.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding-inline-start:24px;padding-bottom:16px}
.tl li::before{content:"";position:absolute;inset-inline-start:0;top:4px;width:10px;height:10px;border-radius:50%;background:var(--good)}
.tl li.now::before{background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.tl li.todo::before{background:#fff;border:2px solid var(--axis)}
.tl li::after{content:"";position:absolute;inset-inline-start:4.5px;top:15px;bottom:0;width:1.5px;background:var(--grid)}
.tl li:last-child::after{display:none}
.tl .s{font-size:13px;font-weight:700}
.tl .m{font-size:11.5px;color:var(--muted);margin-top:1px}

label.f{display:block;font-size:11.5px;font-weight:800;color:var(--ink-2);margin:0 0 6px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;font-weight:600;color:var(--ink);outline:none}
.inp:focus{border-color:var(--teal-600)}
.req{color:var(--critical)}
.hint{font-size:11.5px;color:var(--muted);margin-top:5px}
.warnbox{background:var(--warning-soft);border:1px solid #F2DFB0;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#7A5C12;display:flex;gap:9px;align-items:flex-start}
.okbox{background:var(--good-soft);border:1px solid #C8E6C8;border-radius:9px;padding:11px 13px;font-size:12.5px;font-weight:600;color:#0a7a0a;display:flex;gap:9px;align-items:flex-start}
.btn{border:none;border-radius:9px;padding:11px 16px;font-size:13.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--teal);color:#fff}
.btn.pri:disabled{background:#B9C6CC;cursor:not-allowed}
.btn.gh{background:#fff;color:var(--ink-2);border:1px solid var(--line)}

.toast{position:fixed;bottom:22px;inset-inline-end:22px;background:var(--teal-900);color:#fff;border-radius:10px;
  padding:13px 17px;font-size:13px;font-weight:700;z-index:80;opacity:0;transform:translateY(8px);transition:.2s;
  display:flex;gap:9px;align-items:center;max-width:420px;box-shadow:0 10px 30px rgba(0,41,59,.3)}
.toast.on{opacity:1;transform:none}

.empty{text-align:center;padding:46px 20px}
.empty .ei{color:#C7D2D7}
.empty .et{font-size:15px;font-weight:800;color:var(--ink-2);margin:12px 0 5px}
.empty .ed{font-size:13px;color:var(--muted)}
.note{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:10px}
.demo{
  background:var(--gold-soft);border:1px solid #EFDFB4;border-radius:9px;padding:10px 13px;
  font-size:12px;font-weight:700;color:var(--gold-ink);display:flex;gap:9px;align-items:center;margin-bottom:16px
}
html[dir="rtl"] .flipi{transform:scaleX(-1)}
/* MOB-01. Below 900px this was `.side{display:none}` and nothing else — the
   sidebar is the console's only navigation, so on a phone there was no way to
   leave the page you landed on. Staff use phones; that is not a degraded
   experience, it is a dead end.

   The sidebar becomes an off-canvas sheet rather than being replaced by a
   second, cut-down navigation. One panel, built by one renderNav from one
   NAVDEF: a destination added later cannot appear on the desktop and go missing
   on the phone, and the role gates that hide Administration keep working
   without being written twice. */
.menubtn{
  display:none; border:1px solid var(--line); background:#fff; border-radius:8px;
  padding:8px 10px; color:var(--ink-2); cursor:pointer; align-items:center; flex:none
}
.menubtn:hover{border-color:var(--teal-600); color:var(--teal)}
.navscrim{display:none}
@media (max-width:900px){
  body{overflow:auto}
  .main{height:auto}
  .side{
    position:fixed; top:0; bottom:0; inset-inline-start:0; z-index:70;
    height:auto; transform:translateX(-100%);
    transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.35)
  }
  /* The environment banner is pinned to the bottom of the viewport, so the
     sheet stops above it rather than running underneath it. */
  html.has-envbar .side{bottom:var(--envbar-h,32px)}
  html[dir="rtl"] .side{transform:translateX(100%)}
  body.navopen .side{transform:none}
  .navscrim{
    display:block; position:fixed; inset:0; background:rgba(0,41,59,.44); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s ease; border:0
  }
  body.navopen .navscrim{opacity:1; pointer-events:auto}
  .menubtn{display:flex}
  .top{padding:12px 14px; gap:10px}
  .scroll{padding:16px 14px 40px}
}
/* MOB-01. At 390 wide, the header was one flex row that did not fit: the
   connection control started at x=440, Import at x=562, Export at x=663, and
   the document itself stayed 390 wide — so they were clipped rather than
   reachable by scrolling. In Arabic they ran off the other edge, which is
   worse, because the first thing past the edge is the language button.

   The actions become a row of their own, full width, scrollable if the labels
   are long. Nothing is hidden, nothing moves into a menu that has to be
   discovered, and the tab order is unchanged — which matters for ACC-01 as much
   as for this. */
@media (max-width:560px){
  .top{flex-wrap:wrap; row-gap:10px; padding:10px 12px; gap:8px}
  .pgid{flex:1 1 auto}
  .pgid h1{font-size:16px}
  .pgid .sub{font-size:11px}
  .spacer{display:none}
  .who{order:2; padding-inline-start:10px}
  .who .rl{display:none}
  /* They WRAP rather than scroll. A horizontally scrolling strip keeps every
     control reachable on paper and hides half of them in practice — the whole
     finding is that a control which is not visible is not available, and a
     sideways scroll nobody knows is there is the same thing wearing a better
     excuse. The header gets taller. That is the trade. */
  .topacts{
    display:flex; order:3; width:100%; gap:8px; flex-wrap:wrap; row-gap:8px
  }
  .topacts > *{flex:none; max-width:100%}
}
@media (prefers-reduced-motion:reduce){
  .side, .navscrim{transition:none}
}

/* ACC-01. Keyboard focus has to be visible, and visible on top of whatever it
   lands on. The default ring disappears against the dark navigation and under
   overlapping cards. */
:focus-visible{outline:3px solid #0A5B75; outline-offset:2px; border-radius:4px}
.side :focus-visible{outline-color:#8FD3E8}
.repcard:focus-visible{outline-offset:-3px}
.linkchip{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border-radius:999px;
  background:#E8F5EE;color:#136B43;font-size:12px;font-weight:700;border:1px solid #BFE3D0;white-space:nowrap}
.linkchip i{width:7px;height:7px;border-radius:50%;background:#1B9E5F;flex:none}
.linkchip.off{background:#F3F5F6;color:#6B7780;border-color:#DDE3E6}
.linkchip.off i{background:#9AA4AC}
@keyframes linkpulse{0%{box-shadow:0 0 0 0 rgba(27,158,95,.55)}70%{box-shadow:0 0 0 9px rgba(27,158,95,0)}100%{box-shadow:0 0 0 0 rgba(27,158,95,0)}}
.linkchip.pulse i{animation:linkpulse 1.1s ease-out}
tr.fromapp td:first-child::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--gold,#B8912F);margin-inline-start:6px;vertical-align:middle}
</style>
</head>
<body>

<aside class="side">
  <div class="brand">
    <img id="brandLock" alt="Almaria Residence">
    <div class="sub" id="brandSub">Management Console</div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="foot" id="sideFoot"></div>
</aside>

<button class="navscrim" id="navscrim" type="button" tabindex="-1" aria-hidden="true" onclick="navClose()"></button>

<div class="main">
  <header class="top">
    <button class="menubtn" id="menuBtn" type="button" onclick="navToggle()"

/* DATA-02. Date.setMonth overflows whenever the day does not exist in the
   target month, so a lease starting 31 January generated instalments due
   3 March, 3 May and 3 July — three of twelve rows on the wrong side of a
   month boundary, and every arrears calculation downstream of them wrong by a
   few days. The day is clamped to the last day of the target month, which is
   what a rent schedule means. This is the same rule as add_months_clamped in
   Postgres, and the two must agree: the console previews a schedule the
   database then generates. */
function clampMonth(y, m, d, n){
  const t = new Date(Date.UTC(y, m + n, 1));
  const last = new Date(Date.UTC(t.getUTCFullYear(), t.getUTCMonth() + 1, 0)).getUTCDate();
  return {y: t.getUTCFullYear(), m: t.getUTCMonth(), d: Math.min(d, last)};
}
/* F-03. One rule, two projections. clampMonth is the calendar arithmetic; these
   two only choose which fields of a Date it reads and writes.

   addMonthsClamped works on the LOCAL fields. Its callers step dates built from
   TODAY — report windows, forecast buckets — and TODAY carries Riyadh's calendar
   in the reader's local fields, so local is the right projection there.

   addMonthsClampedUTC works on the UTC fields, for a date-only value: this
   console parses '2026-09-08' as UTC midnight, so its calendar day lives in the
   UTC fields and only there. renewRows stepped such a start with the LOCAL
   setters, which is correct only for a reader at UTC or east of it — and even
   in Riyadh the due date it produced sat three hours after an end that
   planReason had built at local midnight, so a plan whose last instalment fell
   on the lease's final day was refused. A reader west of Greenwich saw every
   due date a day early. The tests ran in a UTC container, the one zone in which
   the two projections agree, which is why they passed. */
function addMonthsClamped(d, n){
  const x = new Date(d);
  const c = clampMonth(x.getFullYear(), x.getMonth(), x.getDate(), n);
  x.setFullYear(c.y, c.m, c.d);
  return x;
}
function addMonthsClampedUTC(d, n){
  const x = new Date(d);
  const c = clampMonth(x.getUTCFullYear(), x.getUTCMonth(), x.getUTCDate(), n);
  x.setUTCFullYear(c.y, c.m, c.d);
  return x;
}

/* A non-production build says so on every screen, permanently. A banner that
   can be dismissed is a banner that is dismissed on the first morning and never
   seen again, which is how somebody ends up believing a test figure.

   MOB-04, found by the 8 September audit: the first version was
   position:fixed;bottom:0 with body.paddingBottom to compensate. The resident
   shell is position:fixed;inset:0 on a phone, so padding on the body reserved
   nothing and the bar covered the tab labels — 48px of it, over a tab bar
   occupying y=770-844 at 390x844. pointer-events:none meant automation still
   clicked through and every navigation test passed while a person could not
   read the tabs. A warning that hides the controls is its own defect.

   It now measures itself and the app shell gives up exactly that much room.

   MOB-05, same audit: the text stayed English after switching to Arabic,
   because the repaint returned early whenever the element already existed. It
   now re-reads the language every tick and follows the document's direction. */
(function environmentBanner(){
  if(ENV.name === 'production') return;
  const css = document.createElement('style');
  css.textContent =
    '#envbar{position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#7a2418;'
    + 'color:#fff;font:600 12px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;'
    + 'letter-spacing:.03em;text-align:center;box-sizing:border-box;'
    + 'padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));'
    + 'box-shadow:0 -1px 0 rgba(0,0,0,.25);pointer-events:none}'
    /* The shell gives up the bar's measured height rather than overlapping it. */
    + 'html.has-envbar body{padding-bottom:var(--envbar-h,32px)}'
    + '@media (max-width:820px){html.has-envbar .phone{bottom:var(--envbar-h,32px)!important;'
    + 'height:auto!important}}';
  const paint = function(){
    let b = document.getElementById('envbar');
    if(!b){
      if(!document.body) return;
      if(!css.parentNode) document.head.appendChild(css);
      b = document.createElement('div');
      b.id = 'envbar';
      b.setAttribute('role', 'status');
      document.body.appendChild(b);
      document.documentElement.classList.add('has-envbar');
    }
    /* Re-read every tick: the language toggle rewrites the document. */
    const ar = (document.documentElement.getAttribute('lang') === 'ar');
    const want = ar ? ENV.label_ar : ENV.label_en;
    if(b.textContent !== want) b.textContent = want;
    b.dir = ar ? 'rtl' : 'ltr';
    /* Reserve what it actually occupies, not what it was assumed to be. */
    const h = Math.ceil(b.getBoundingClientRect().height);
    if(h && document.documentElement.style.getPropertyValue('--envbar-h') !== h + 'px')
      document.documentElement.style.setProperty('--envbar-h', h + 'px');
  };
  if(document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', paint);
  else paint();
  setInterval(function(){ try{ paint(); }catch(e){} }, 700);
  window.addEventListener('resize', function(){ try{ paint(); }catch(e){} });
})();

const LINK = (function(){
  const KEY = ENV.prefix + '.link.v1';
  const CHAN = ENV.prefix + '.link';
  const BLANK = () => ({v:1, rev:0, at:0, by:'', wo:{}, newWO:[], anns:[], pay:{}});

  let cache = null, subs = [], bc = null, ok = true;

  function read(){
    try{
      const raw = localStorage.getItem(KEY);
      cache = raw ? JSON.parse(raw) : null;
    }catch(e){ cache = null; ok = false; }
    if(!cache || cache.v !== 1) cache = BLANK();
    /* a stored record must still carry every branch */
    if(!cache.wo) cache.wo = {};
    if(!Array.isArray(cache.newWO)) cache.newWO = [];
    if(!Array.isArray(cache.anns)) cache.anns = [];
    if(!cache.pay) cache.pay = {};
    return cache;
  }

  /* Mutate under a fresh read so a change made in the other tab between our
     last read and this write is never overwritten. */
  function commit(mutate, who){
    const s = read();
    try{ mutate(s); }catch(e){ console.error('LINK.commit', e); return s; }
    s.rev  = (s.rev||0) + 1;
    s.at   = Date.now();
    s.by   = who || '';
    try{ localStorage.setItem(KEY, JSON.stringify(s)); }
    catch(e){ ok = false; console.error('LINK.persist', e); }
    if(bc){ try{ bc.postMessage({rev:s.rev, by:s.by}); }catch(e){} }
    return s;
  }

  function fire(msg){
    const s = read();
    subs.forEach(fn => { try{ fn(s, msg||{}); }catch(e){ console.error('LINK.subscriber', e); } });
  }

  try{ bc = ('BroadcastChannel' in window) ? new BroadcastChannel(CHAN) : null; }
  catch(e){ bc = null; }
  if(bc) bc.onmessage = ev => fire(ev && ev.data);
  /* fires only in the OTHER tabs, which is exactly what is wanted */
  window.addEventListener('storage', e => { if(e.key === KEY) fire({by:'storage'}); });

  function reset(){
    try{ localStorage.removeItem(KEY); }catch(e){}
    cache = BLANK();
    if(bc){ try{ bc.postMessage({rev:0, by:'reset'}); }catch(e){} }
    return cache;
  }

  read();
  return {
    get: read,
    commit,
    reset,
    onChange: fn => subs.push(fn),
    healthy: () => ok,
    live: () => !!bc
  };
})();

/* ---------------------------- LINK: console side ----------------------------
   Applies the shared record over the seeded data. Deltas are absolute field
   values and new items are guarded by id, so applying twice is the same as
   applying once — a re-render can never double-count. */
function LINK_apply(s){
  /* 1. requests raised by residents in the app */
  (s.newWO||[]).forEach(n=>{
    if(WOS.some(w=>w.id===n.id)) return;
    const u = UNITS.find(x=>x.u===n.unit);
    const c = CAT(n.cat) || {sla:8};
    const raised = new Date(n.raised);
    WOS.unshift({
      id:n.id, cat:n.cat, unit:n.unit,
      tenant:(u&&u.tenant)||n.tenant||'—', tenant_ar:(u&&u.tenant_ar)||n.tenant_ar||'—',
      desc:n.desc||'Service request', pri:priOK(n.pri), ch:'app', raised,
      respH:0, closeH:0, target:c.sla, breached:false,
      status:'submitted', tech:'—', tech_ar:'—', supplier:false,
      labH:0, mat:0, rating:null,
      month:raised.getFullYear()+'-'+String(raised.getMonth()+1).padStart(2,'0'),
      fromApp:true
    });
  });

  /* 2. status, assignment, cost and rating changes */
  Object.keys(s.wo||{}).forEach(id=>{
    const w = WOS.find(x=>x.id===id); if(!w) return;
    const d = s.wo[id];
    if(d.status !== undefined) w.status = d.status;
    if(d.tech   !== undefined){ w.tech = d.tech; w.tech_ar = d.tech_ar || d.tech;
                                const t = TECHS.find(x=>x.n===d.tech); w.supplier = !!(t && t.type==='sup'); }
    if(d.labH   !== undefined) w.labH = d.labH;
    if(d.mat    !== undefined) w.mat  = d.mat;
    if(d.note   !== undefined) w.note = d.note;
    if(d.rating !== undefined) w.rating = d.rating;
    /* A close recorded in the other console stops the clock here too, at the
       moment that console recorded it. Applied last, so it reads the status
       and target this delta has just set. */
    if(d.closedAt) markClosed(w, new Date(d.closedAt));
  });
  WOS.sort(byRaised);

  /* 3. announcements — the console is where they are written, but a second
        console tab or a reload has to pick them up too */
  (s.anns||[]).forEach(a=>{
    if(ANNS.some(x=>x.id && x.id===a.id)) return;
    ANNS.unshift({id:a.id, en:a.en, ar:a.ar, aud:a.aud||'all', st:a.st||'published', date:a.date, ok:true});
  });

  /* 4. lease terms confirmed against a contract document */
  Object.keys(s.leases||{}).forEach(id=>{
    const u = UNITS.find(x=>x.u===id); if(!u) return;
    const c = s.leases[id];
    if(c.start) u.leaseStart = new Date(c.start);
    if(c.end)   u.leaseEnd   = new Date(c.end);
    if(c.value) u.rent = c.value;
    if(c.value && c.n && c.start){
      /* DUAL-02. Paid lines are carried across by instalment number, as
         docApplyLease carries them; this rebuilt every line unpaid. */
      /* N-02. This rebuilt the schedule one MONTH apart whatever the cadence —
         `applyLeaseEdit` writes `freq` into the shared record and this ignored
         it, so a confirmed quarterly plan replayed as monthly and pulled every
         due date, and the arrears they drive, forward. It also carried its own
         money split, a second implementation of a rule that already had one.
         Both are now renewRows(), the generator the forms preview from, so a
         replayed schedule is the schedule that was confirmed. */
      const had = {};
      (u.inst || []).forEach(x => { if(x.paid) had[x.q] = x; });
      u.inst = renewRows(c.start, c.value, c.n, c.freq).map(r => {
        const k = had[r.seq];
        return {q:r.seq, amt:r.amount, due:r.due, billed:r.due<=TODAY,
                paid: !!k, paidOn: k ? (k.paidOn || null) : null, ref: k ? (k.ref || null) : null};
      });
    }
    if(c.value || c.start) u.occupied = true;
  });

  /* 5. instalments recorded as received — after the schedule they settle */
  Object.keys(s.pay||{}).forEach(uid=>{
    const u = UNITS.find(x=>x.u===uid); if(!u || !u.inst) return;
    const paid = (s.pay[uid]||{}).paid || {};
    Object.keys(paid).forEach(n=>{
      const row = u.inst.find(x=>String(x.q)===String(n)); if(!row) return;
      row.paid = true;
      /* DUAL-02. This substituted the due date, then today, for a payment date
         nobody had. A blank is the truthful value. */
      row.paidOn = paid[n].on ? new Date(paid[n].on) : null;
      row.ref = paid[n].ref;
    });
  });

  /* jobs entered from supplier invoices */
  /* SCALE-02. One sort for the whole replay, not one per job. */
  const jbulk = bulkAdd();
  (s.jobs||[]).forEach(j=>{
    const u = UNITS.find(x=>x.u===j.unit);
    logJobAdd(j, u, new Date(j.date + 'T12:00:00'), jbulk);
  });
  bulkDone();

  /* a register imported on this machine replaces the published one */
  if(s.register && s.register.length && typeof applyRegister === 'function'){
    applyRegister(s.register);
  } else {
    recompute();
  }
}

/* Every write goes through here so the shape stays in one place. */
const LINK_wo = (id, delta) => LINK.commit(s=>{ s.wo[id] = Object.assign({}, s.wo[id], delta); }, 'console');

function LINK_boot(){
  /* The console owns the reference series. Publishing the next free number
     means a request raised in the app continues the same run rather than
     colliding with a job that already exists here. */
  LINK.commit(s=>{
    const maxSeq = WOS.reduce((m,w)=>{
      const n = parseInt(String(w.id).split('-').pop(), 10);
      return isNaN(n) ? m : Math.max(m, n);
    }, 0);
    s.nextSeq = Math.max(s.nextSeq||0, maxSeq+1);
  }, 'console');
  LINK_apply(LINK.get());
  /* N-02. A notification that follows a failed read repaints but does not
     replay: nothing new was learned, so nothing should be rebuilt from it. */
  LINK.onChange((s,m)=>{ if(!(m && m.stale)) LINK_apply(s); render(); linkFlash(); });
}

/* A visible sign that the change came from the other side, so a demonstration

  el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
}

/* shared helpers — declared early; function declarations hoist, so recompute() can use them */
function woCost(w){return Math.round(w.mat + w.labH*85)}
/* shared status predicates — declared early because the ledger and recompute() both use them */
const isOpenWO=w=>['submitted','assigned','progress','hold'].includes(w.status);

/* ---------- rent ledger ----------
   Instalments, amounts and due dates are the real schedule from the register.
   Payment status is reconstructed from the sheet's own collected totals. */
const addM=(d,n)=>addMonthsClamped(d,n);
/* The payment profile used to be stamped here and again in applyRegister, with
   the rule written out twice and recomputed never. recompute() derives it now,
   and runs before the first render. */

/* An instalment is only in this table once it is billed — due today or
   earlier — so overdueDays is never negative and the first bucket is the money
   that fell due TODAY and has not been received. It was labelled "Not yet due",
   which is the one thing it can never contain: a payment that is not yet due is
   not outstanding, and is not counted here at all. */
const AGE_BUCKETS=[
 {k:'b_cur',lo:0,hi:0},{k:'b_30',lo:1,hi:30},{k:'b_60',lo:31,hi:60},
 {k:'b_90',lo:61,hi:90},{k:'b_90p',lo:91,hi:1e9}
];
/* One rule for the payment profile, derived rather than stamped in two places.
   It is a statement about what is unpaid NOW. It is not a statement about
   whether past instalments arrived on time — nothing in this register records
   that, and the labels beside it must not claim it either. */
/* A payment record the console can actually evidence.
 *
 * This returned 'good' — "On time" — for any flat with nothing overdue RIGHT
 * NOW. Three different situations got that badge and only one of them earned
 * it: a tenancy that had genuinely paid everything punctually; a lease signed
 * last week with no instalment due yet; and a tenant who had paid every single
 * instalment weeks late and happened to be square today. The screen said "On
 * time" under the heading "Payment record" in all three.
 *
 * Punctuality was never measured. It could not have been when this was
 * written — `paid_on` was being dropped on the way out of the database, which
 * was DATA-07 — but the label claimed it anyway. The date is carried now, so
 * the claim can be checked instead of asserted.
 *
 *   none        nothing has fallen due yet; there is no record to report
 *   problem     something has been overdue more than 60 days
 *   late        something is overdue, or something was paid after its due date
 *   unrecorded  everything due is paid, but not every payment has a date, so
 *               "on time" is not established
 *   good        everything due is paid, every payment has a date, and none of
 *               those dates is after the due date
 *
 * `unrecorded` is the one that matters. It is the state the old code called
 * 'good', and the difference between "we have no evidence of lateness" and "we
 * have evidence of punctuality" is the whole finding. */
const payProfile = u => {
  const due = (u.inst || []).filter(x => x.billed);
  if(!due.length) return 'none';
  const overdue = due.filter(x => !x.paid);
  if(overdue.length)
    return Math.max(...overdue.map(x => (TODAY - x.due)/864e5)) > 60 ? 'problem' : 'late';
  if(due.some(x => x.paidOn && x.paidOn > x.due)) return 'late';
  return due.every(x => x.paidOn) ? 'good' : 'unrecorded';
};
const unitCost=u=>{const c=costByUnitLookup[u.u];return c?c.cost:0;};
let costByUnitLookup={};

/* assets & PPM */
/* The asset register has to be walked and confirmed on site before it can be listed */
const ASSETS=[];
/* Planned maintenance follows from the asset register and the statutory schedule */
const PPM=[];

/* Suppliers appear here as jobs are logged against them */
const SUPPLIERS=[];
/* supplier aggregates are derived — see recompute() */

/* Read from the announcements table. See REGISTER above. */
const ANNS=[];
/* F-02. Unpaid instalments on closed terms — money the active register has no
   place for. Read whole from Postgres, keyed by instalment id, settled by it. */
const OWING=[];

/* ------------------------------ derived figures ------------------------------ */
/* One definition of "breached", used by the queue, the panels and the SLA
   figures alike. An open job that has passed target counts as breached from the
   moment it does.

   Hours a job has been open, measured exactly the way a closed job's closeH is
   measured. Until 14 September this carried an unexplained "* 0.42", so an open
   job had to run about two and a half times past target before it registered as
   breached while a closed one breached on the hour — two clocks behind one word.
   Rounding belongs to the places that print a number, not here.

   And it measures against the real instant rather than TODAY. TODAY is shifted
   on purpose so its fields read as Riyadh's wall clock, which is right for
   "what day is it" and wrong for "how long has this been open": subtracting a
   real timestamp from it adds the gap between the reader's clock and the
   building's. In Riyadh that gap is zero, so it never showed; read from
   anywhere else every open job aged by the difference, and the 0.42 was hiding
   it. Durations use nowInstant, calendars use TODAY. */
const nowInstant = () => Date.now();
const workedH=w=>Math.max(0,(nowInstant()-w.raised)/36e5);
/* A job logged from a supplier invoice has no response clock at all — the same
   reason byMonth excludes it from the SLA percentage keeps it out of the breach
   count, rather than it being judged against a target nobody ever set. */
const isBreached=w=> (w.status==='cancelled'||w.noSla) ? false
                   : (isOpenWO(w) ? workedH(w)>w.target : w.breached);

/* The one place the clock stops. Every route into a closed job goes through it
   — this console's own close, a close arriving from another console, and a row
   read back from the database — so all three record the same two numbers.
   `at` is when the job was closed, never when the code happens to run. */
function markClosed(w, at){
  w.closeH   = Math.max(0, (at - w.raised)/36e5);
  w.breached = !w.noSla && w.closeH > w.target;
  return w;
}

let byMonth,costByCat,costByUnit,totalCost,monthCost,prevCost,slaNow,slaPrev,
    avgClose,breached,occupied,activated,appShare,ratings,avgRating,ageing,FIN,measured,
    lettable,notLettable;

/* Every figure in the console is derived from WOS and UNITS. Anything that mutates
   those (closing a work order, recording a payment) must call this, or the reports
   quietly disagree with the queue. */
function recompute(){
 const cost=woCost;
 /* APP-04. Derived here rather than once at load, so a console left open over
    the midnight that starts a month reports the month it is now in. The
    day-roll timer calls this. */
 MONTHS = monthWindow(TODAY, MONTH_WINDOW);
 OPEN=WOS.filter(isOpenWO);
 DONE=WOS.filter(w=>w.status==='done');

 byMonth=MONTHS.map(M=>{
  const r=WOS.filter(w=>w.month===M.k);
  const d=r.filter(w=>w.status==='done');
  /* a job entered from a supplier invoice has no response time — it must not
     be counted as met or missed */
  const measurable=r.filter(w=>w.status!=='cancelled'&&!w.noSla);
  const inSla=measurable.filter(w=>!isBreached(w)).length;
  return {...M, raised:r.length, closed:d.length, measured:measurable.length,
    sla: measurable.length? Math.round(inSla/measurable.length*100):null,
    cost: d.reduce((a,w)=>a+cost(w),0)};
 });
 costByCat=CATS.map(c=>{
  const d=DONE.filter(w=>w.cat===c.id);
  return {c, jobs:d.length, cost:d.reduce((a,w)=>a+cost(w),0)};
 }).filter(x=>x.jobs>0).sort((a,b)=>b.cost-a.cost);
 costByUnit=UNITS.map(u=>{
  const d=DONE.filter(w=>w.unit===u.u);
  return {u, jobs:d.length, cost:d.reduce((a,w)=>a+cost(w),0)};
 }).sort((a,b)=>b.cost-a.cost);
 costByUnitLookup={};
 costByUnit.forEach(x=>{costByUnitLookup[x.u.u]=x;});

 totalCost=DONE.reduce((a,w)=>a+cost(w),0);
 /* APP-04. "This month" is the last bucket in the window and "last month" the
    one before it, whichever months those now are — never positions 5 and 4 of
    a list that had stopped moving. */
 const LM=byMonth.length-1;
 monthCost=byMonth[LM].cost; prevCost=byMonth[LM-1].cost;
 slaNow=byMonth[LM].sla; slaPrev=byMonth[LM-1].sla;
 const timed=DONE.filter(w=>!w.noSla);
 avgClose=timed.length? timed.reduce((a,w)=>a+w.closeH,0)/timed.length : null;
 measured=WOS.filter(w=>!w.noSla&&w.status!=='cancelled').length;
 breached=OPEN.filter(isBreached);
 occupied=UNITS.filter(u=>u.occupied).length;
 /* DATA-03. The occupancy denominator was the literal 37, in four places, over
    a register of 39 rows. Two of those rows are marked not lettable, so 37 was
    the right answer to a question nobody had written down — and it stayed 37
    whatever the register said, which is the part that matters. It is counted
    now, from the same rows the numerator comes from. */
 lettable=UNITS.filter(u=>u.lettable).length;
 notLettable=UNITS.length-lettable;
 activated=UNITS.filter(u=>u.account==='verified').length;
 appShare=WOS.length? Math.round(WOS.filter(w=>w.ch==='app').length/WOS.length*100):0;
 ratings=DONE.filter(w=>w.rating);
 avgRating=ratings.length? ratings.reduce((a,w)=>a+w.rating,0)/ratings.length : 0;

 SUPPLIERS.forEach(s=>{
  const mine=DONE.filter(w=>w.tech===s.n);
  s.jobs=mine.length; s.spend=mine.reduce((a,w)=>a+cost(w),0);
 });

 /* rent ledger */
 UNITS.forEach(u=>{
  if(!u.occupied)return;
  /* Whether an instalment has fallen due is derived here, not stamped when the
     schedule was built. A console left open across the midnight an instalment
     falls due kept yesterday's answer: recompute() re-added the same flags and
     the money stayed out of arrears until somebody reloaded the page. Same
     defect as APP-04, one level down. A row with no usable date keeps whatever
     was stamped, because guessing is worse than stale. */
  u.inst.forEach(x=>{
    const d = x.due instanceof Date ? x.due : (x.due ? new Date(x.due) : null);
    if(d && !isNaN(d)) x.billed = d <= TODAY;
  });
  const sum = f => u.inst.filter(f).reduce((a,x)=>a+x.amt,0);
  u.billed    = sum(x => x.billed);        /* has fallen due */
  u.collected = sum(x => x.paid);          /* cash in, whenever it was due */
  /* DATA-01. Three positions, not one net.
     An instalment that has fallen due and is unpaid is ARREARS. One paid before
     it fell due is PREPAID. What is unpaid at all is the remaining contractual
     balance. These are different facts about a tenancy and netting them hides
     both: a flat owing SAR 100 on an instalment that fell due last month, with
     SAR 100 already received against one due next quarter, reported NOTHING
     outstanding — and dropped out of the arrears table altogether, while the
     line beside it still read 45 days overdue.
     The rule was already written three lines below, for the portfolio total,
     and had never been applied to an apartment. */
  u.arrears   = sum(x =>  x.billed && !x.paid);
  u.prepaid   = sum(x => !x.billed &&  x.paid);
  u.unpaid    = sum(x => !x.paid);
  /* `outstanding` means arrears wherever it is read, and can no longer go
     negative: money paid early is a position of its own, not a discount on a
     debt that is already late. */
  u.outstanding = u.arrears;
  const unpaid=u.inst.filter(x=>x.billed&&!x.paid).sort((a,b)=>a.due-b.due)[0];
  u.overdueDays=unpaid?Math.floor((TODAY-unpaid.due)/864e5):0;
  /* Derived here rather than stamped twice at load, so a payment recorded in
     this session moves it without a reload. */
  u.profile = payProfile(u);
 });
 ageing=AGE_BUCKETS.map(b=>{
  const hit=UNITS.filter(u=>u.occupied&&u.arrears>0&&u.overdueDays>=b.lo&&u.overdueDays<=b.hi);
  return {b, amt:hit.reduce((a,u)=>a+u.arrears,0), n:hit.length};
 });
 FIN={billed:UNITS.reduce((a,u)=>a+(u.billed||0),0),
      collected:UNITS.reduce((a,u)=>a+(u.collected||0),0),
      contracted:UNITS.filter(u=>u.occupied).reduce((a,u)=>a+u.rent,0)};
 /* arrears and prepayments are separate positions — netting them hides both */
 FIN.outstanding=UNITS.reduce((a,u)=>a+(u.arrears||0),0);
 FIN.credit=UNITS.reduce((a,u)=>a+(u.prepaid||0),0);
 FIN.rate=FIN.billed?Math.min(100,Math.round(FIN.collected/FIN.billed*100)):0;
 FIN.over30=ageing.filter(x=>x.b.lo>=31).reduce((a,x)=>a+x.amt,0);
}
recompute();


/* ==========================================================================
   REGISTER IMPORT

   Reads بيان ايجارات الشقق .xlsx in the browser and rebuilds the register from
   it, applying the same reconciliation rules that were applied by hand:
   locate columns by their Arabic headers rather than by position, score
   duplicate rows to find the live contract, split the two-line instalment
   cells, and fill paid instalments from the sheet's own collected total.

   No library. The zip is read directly and inflated with the browser's own
   DecompressionStream, so the file stays a single self-contained page.

   Imported data is held in this browser only. It is never uploaded, and a
   visitor to the public link sees the published figures, not yours.
   ========================================================================== */

/* ---------------------------- zip ---------------------------- */
async function zipEntries(buf){
  const dv = new DataView(buf), u8 = new Uint8Array(buf);
  let eocd = -1;
  for(let i = u8.length - 22; i >= 0 && i > u8.length - 66000; i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('not_zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(p, true) !== 0x02014b50) throw new Error('bad_central_directory');
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    out[name] = {method, csize, lho};
    p += 46 + nlen + elen + clen;
  }
  return {dv, u8, entries: out};
}

async function zipRead(zip, name){
  const e = zip.entries[name]; if(!e) return null;
  const nlen = zip.dv.getUint16(e.lho + 26, true);
  const elen = zip.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const raw = zip.u8.subarray(start, start + e.csize);
  if(e.method === 0) return new TextDecoder().decode(raw);
  if(e.method !== 8) throw new Error('unsupported_compression');
  if(typeof DecompressionStream === 'undefined') throw new Error('no_inflate');
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(stream).text();
}

/* ---------------------------- xlsx ---------------------------- */
const XML = s => new DOMParser().parseFromString(s, 'application/xml');

function colToIndex(ref){
  let n = 0;
  for(const ch of ref){
    const c = ch.charCodeAt(0);
    if(c < 65 || c > 90) break;
    n = n * 26 + (c - 64);
  }
  return n - 1;
}

/* Excel serial → ISO date. 1900 leap-year bug included, as Excel has it. */
function serialToISO(n){
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  if(isNaN(d)) return null;
  return d.toISOString().slice(0,10);
}

async function readWorkbook(file){
  const zip = await zipEntries(await file.arrayBuffer());

  /* shared strings */
  const ssXml = await zipRead(zip, 'xl/sharedStrings.xml');
  const shared = [];
  if(ssXml){
    for(const si of XML(ssXml).getElementsByTagName('si')){
      let t = '';
      for(const n of si.getElementsByTagName('t')) t += n.textContent;
      shared.push(t);
    }
  }

  /* which style indexes are dates */
  const stXml = await zipRead(zip, 'xl/styles.xml');
  const dateStyle = new Set();
  if(stXml){
    const st = XML(stXml);
    const custom = {};
    for(const f of st.getElementsByTagName('numFmt')){
      custom[f.getAttribute('numFmtId')] = f.getAttribute('formatCode') || '';
    }
    const builtinDate = new Set(['14','15','16','17','18','19','20','21','22','45','46','47']);
    const xfs = st.getElementsByTagName('cellXfs')[0];
    if(xfs){
      [...xfs.getElementsByTagName('xf')].forEach((xf, i) => {
        const id = xf.getAttribute('numFmtId') || '0';
        const code = custom[id];
        if(builtinDate.has(id) || (code && /[ymd]/i.test(code.replace(/\[[^\]]*\]/g,'').replace(/"[^"]*"/g,'')))) dateStyle.add(i);
      });
    }
  }

  /* sheet name → part name */
  const relXml = await zipRead(zip, 'xl/_rels/workbook.xml.rels');
  const rel = {};
  if(relXml) for(const r of XML(relXml).getElementsByTagName('Relationship')){
    rel[r.getAttribute('Id')] = r.getAttribute('Target').replace(/^\/?xl\//,'').replace(/^\//,'');
  }
  const wbXml = await zipRead(zip, 'xl/workbook.xml');
  if(!wbXml) throw new Error('not_xlsx');
  const sheets = {};
  for(const sh of XML(wbXml).getElementsByTagName('sheet')){
    const name = sh.getAttribute('name');
    const rid  = sh.getAttribute('r:id') || sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    const part = 'xl/' + (rel[rid] || ('worksheets/sheet' + sh.getAttribute('sheetId') + '.xml'));
    const xml = await zipRead(zip, part);
    if(!xml) continue;
    const grid = [];
    for(const row of XML(xml).getElementsByTagName('row')){
      const cells = [];
      for(const c of row.getElementsByTagName('c')){
        const ref = c.getAttribute('r') || '';
        const idx = colToIndex(ref.replace(/\d+/g,''));
        const t = c.getAttribute('t');
        let v = null;
        if(t === 'inlineStr'){
          v = ''; for(const n of c.getElementsByTagName('t')) v += n.textContent;
        } else {
          const vn = c.getElementsByTagName('v')[0];
          if(vn){
            if(t === 's') v = shared[Number(vn.textContent)];
            else if(t === 'str' || t === 'e') v = vn.textContent;
            else {
              const num = Number(vn.textContent);
              const s = Number(c.getAttribute('s') || 0);
              v = (dateStyle.has(s) && num > 20000 && num < 80000) ? serialToISO(num) : num;
            }
          }
        }
        if(idx >= 0) cells[idx] = (v === undefined ? null : v);
      }
      grid.push(cells);
    }
    sheets[name] = grid;
  }
  return sheets;
}

/* ---------------------------- Almaria rules ---------------------------- */
const IMP = {result:null, file:null};

const impText  = v => v === null || v === undefined ? '' : String(v).replace(/\s+/g,' ').trim();
/* Arabic-Indic digits are digits. impNum folded them and impDate did not, so
   the same cell could parse as a number and fail as a date: a sheet writing
   ٢٠٢٥-٠٩-١٥ imported with no date at all rather than with a wrong one.
   One fold, and everything that reads a figure or a date uses it. */
const impDigits = s => String(s)
  .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
  .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06F0));

/* Matching a column HEADER is not the same as reading a value. تاريخ نهايه and
   تاريخ نهاية are the same column to whoever typed them, as are spellings
   differing only in hamza, tatweel or diacritics. cStart carried two spellings
   by hand and cEnd carried one — so a register written the other way imported
   with no end date on any lease, silently, and the check for an instalment
   dated after the lease ends went quiet with it. Folding here gives every
   header the tolerance instead of the ones somebody remembered. Nothing folded
   is stored: this decides WHICH column, never what is in it. */
const arFold = s => impText(s)
  .replace(/[ً-ْٰـ]/g, '')          /* harakat, dagger alif, tatweel */
  .replace(/[أإآٱ]/g, 'ا')     /* hamzated alif */
  .replace(/ة/g, 'ه')                         /* ta marbuta */
  .replace(/ى/g, 'ي')                         /* alif maqsura */
  .toLowerCase();

const impUnit  = v => { const m = /BLOCK\s*([AB])\s*-?\s*(\d+)/i.exec(impDigits(impText(v)).replace(/ /g,' '));
                        return m ? m[1].toUpperCase() + '-' + String(Number(m[2])).padStart(3,'0') : null; };
/* A money cell is not always written the way Number() reads one. Accounting
   parentheses are a minus sign, the Arabic thousands and decimal separators are
   not the Latin ones, and a minus typed as an en-dash is still a minus. Each of
   those made Number() return NaN, and NaN became null — a figure silently
   absent rather than visibly wrong, which is the harder of the two to notice in
   a register of 39 flats. */
const impNum   = v => {
  if(typeof v === 'number') return v;
  let s = impDigits(impText(v));
  let neg = false;
  const par = /^\((.*)\)$/.exec(s);
  if(par){ neg = true; s = par[1]; }
  s = s.replace(/(?:SAR|SR|ر\.?س\.?|ريال|﷼)/gi, '')
       .replace(/[٬,\s']/g, '')                  /* thousands separators */
       .replace(/٫/g, '.')                       /* Arabic decimal separator */
       .replace(/[−–—]/g, '-');        /* a minus typed as a dash */
  if(/^-/.test(s)){ neg = !neg; s = s.slice(1); }
  const n = Number(s);
  if(s === '' || !isFinite(n)) return null;
  return neg ? -n : n;
};

function impDate(v){
  if(v === null || v === undefined || v === '') return null;
  if(typeof v === 'number') return serialToISO(v);
  const s = impDigits(impText(v));
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m = /^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/.exec(s);              /* 15-9-2025 */
  if(m) return `${m[3]}-${String(+m[2]).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : d.toISOString().slice(0,10);
}

/* an instalment cell is an amount over a date on two lines */
function impInstalment(v){
  if(v === null || v === undefined || v === '') return null;
  const parts = String(v).split(/[\n\r]+/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const amt = impNum(parts[0]);
  if(amt === null || amt === 0) return null;
  const due = parts.length > 1 ? impDate(parts.slice(1).join(' ')) : null;
  return {amt, due};
}

const ROOMS = s => { const t = impText(s);
  if(/3\s*غرف|ثلاث/.test(t)) return '3BR';
  if(/غرفتين|غرفتان/.test(t)) return '2BR';
  if(/غرفة/.test(t)) return '1BR';
  return null; };
const FLOOR = s => { const t = impText(s);
  if(/ارض|أرض/.test(t)) return 0;
  if(/الأول|الاول/.test(t)) return 1;
  if(/الثاني/.test(t)) return 2;
  if(/الثالث/.test(t)) return 3;
  const n = impNum(t); return n === null ? null : n; };

function findHeader(grid, needle){
  for(let i = 0; i < Math.min(grid.length, 20); i++){
    const row = grid[i] || [];
    const f = arFold(needle);
    for(let j = 0; j < row.length; j++) if(arFold(row[j]).includes(f)) return {row:i, col:j};
  }
  return null;
}
function headerMap(grid, hrow){
  const map = {}; const row = grid[hrow] || [];
  row.forEach((c, j) => { const t = impText(c); if(t) map[t] = j; });
  return map;
}
function impPick(map, ...needles){
  for(const n of needles){
    const f = arFold(n);
    for(const k in map) if(arFold(k).includes(f)) return map[k];
  }
  return null;
}

function parseRegister(sheets){
  const warn = [];
  const names = Object.keys(sheets);
  const sheetIs = needle => { const f = arFold(needle); return n => arFold(n).includes(f); };
  const main = names.find(sheetIs('المجمع')) || names.find(n => findHeader(sheets[n],'رقم الشقة') && findHeader(sheets[n],'قيمة العقد'));
  if(!main) throw new Error('no_register_sheet');
  const grid = sheets[main];
  const h = findHeader(grid, 'رقم الشقة');
  if(!h) throw new Error('no_header');
  const map = headerMap(grid, h.row);

  const cUnit  = impPick(map,'رقم الشقة');
  const cRooms = impPick(map,'الغرف');
  const cName  = impPick(map,'اسم المستأجر');
  const cStart = impPick(map,'تاريخ بداية');          /* both spellings, via arFold */
  const cValue = impPick(map,'قيمة العقد');
  const cEnd   = impPick(map,'تاريخ نهاية');          /* likewise — it used to take one only */
  const cPaid  = impPick(map,'إجمالي الدفع');
  const cRem   = impPick(map,'المتبقي');
  const instRe = new RegExp('^' + arFold('الدفعة'));
  const inst   = Object.keys(map).filter(k => instRe.test(arFold(k)))
                   .sort((a,b) => map[a] - map[b]).map(k => map[k]);
  if(cUnit === null || cValue === null) throw new Error('columns_not_found');
  if(!inst.length) warn.push({t:'No instalment columns found — payment schedules will be empty'});

  /* areas and floors */
  const areaSheet = names.find(sheetIs('المساحات'));
  const geo = {};
  if(areaSheet){
    const g = sheets[areaSheet], gh = findHeader(g,'رقم الشقة');
    if(gh){
      const gm = headerMap(g, gh.row);
      const gu = impPick(gm,'رقم الشقة'), ga = impPick(gm,'مساحة'), gf = impPick(gm,'الطابق'), gr = impPick(gm,'الغرف'), gv = impPick(gm,'قيمة العقد');
      for(let i = gh.row + 1; i < g.length; i++){
        const r = g[i] || [], u = impUnit(r[gu]); if(!u) continue;
        geo[u] = {area: ga !== null ? impNum(r[ga]) : null,
                  floor: gf !== null ? FLOOR(r[gf]) : null,
                  type: gr !== null ? ROOMS(r[gr]) : null,
                  value: gv !== null ? impNum(r[gv]) : null};
      }
    }
  } else warn.push({t:'Sheet المساحات والقيمة not found — areas and floors kept from the current register'});

  /* one row per apartment: prefer a row that is let, named and priced */
  const LET_W    = arFold('مؤجرة');
  const NOTLET_W = arFold('غير مؤجرة');
  const LET_RE   = new RegExp('(^|\\s)' + LET_W);
  const best = {};
  for(let i = h.row + 1; i < grid.length; i++){
    const r = grid[i] || [];
    const u = impUnit(r[cUnit]); if(!u) continue;
    /* Occupancy is read from the cell that states it, not from the row it sits
       in. This used to join every column and look for مؤجرة anywhere: a note in
       some other column mentioning that the flat had been غير مؤجرة last
       year decided the matter, and a flat wrongly read as vacant has its whole
       payment schedule dropped on the floor by the rule below. A cell whose
       ENTIRE content is the status is the status. Where no cell says it
       outright the old rule still applies — it is the only evidence there is —
       but the operator is told that it did, and told when the two disagree. */
    const cells   = r.map(arFold);
    const letCell = cells.some(t => t === LET_W);
    const notCell = cells.some(t => t === NOTLET_W);
    const joined  = cells.join(' ');
    const rowSays = LET_RE.test(joined) && !joined.includes(NOTLET_W);
    let isLet;
    if(letCell || notCell){
      isLet = letCell && !notCell;
      if(isLet !== rowSays)
        warn.push({u, t:`occupancy is taken from the cell that states it (${isLet ? 'let' : 'vacant'}); ` +
                        'the rest of the row reads the other way — check this apartment'});
    }else{
      isLet = rowSays;
      if(rowSays)
        warn.push({u, t:'no cell states whether this apartment is let, so occupancy was ' +
                        'inferred from the whole row — check it'});
    }
    const name   = cName !== null ? impText(r[cName]) : '';
    const value  = cValue !== null ? impNum(r[cValue]) : null;
    const score  = (isLet ? 2 : 0) + (name ? 1 : 0) + (value ? 1 : 0);
    if(!best[u] || score > best[u].score) best[u] = {r, score, isLet, name, value, row: i + 1};
  }

  const dupes = Object.values(best).filter(b => b.score < 4 && b.isLet).length;
  const rowCount = Object.keys(best).length;

  const out = [];
  Object.keys(best).sort((a,b)=>a.localeCompare(b,'en',{numeric:true})).forEach(u => {
    const b = best[u], r = b.r, g = geo[u] || {};
    const paidTotal = cPaid !== null ? impNum(r[cPaid]) : null;

    let rows = inst.map(ci => impInstalment(r[ci])).filter(Boolean)
                   .map((x, i) => ({n: i + 1, amt: x.amt, due: x.due, paid: false}));
    /* the sheet records one collected total, not a paid flag per line:
       fill from the earliest instalment until that total is used up */
    if(paidTotal){
      let left = paidTotal;
      for(const x of rows){
        const tol = Math.max(5, x.amt * 0.01);       /* under 1% short is a rounding gap */
        if(left >= x.amt - tol){
          x.paid = true;
          if(left < x.amt) warn.push({u, t:`instalment ${x.n} treated as received although the collected total is ${Math.round(x.amt-left).toLocaleString()} SAR short of it`});
          left -= x.amt;
        } else break;
      }
    }

    const lineTotal = rows.reduce((a,x)=>a+x.amt,0);
    if(b.isLet && b.value && rows.length && Math.abs(lineTotal - b.value) > 1)
      warn.push({u, t:`instalment lines total ${Math.round(lineTotal).toLocaleString()} against a contract value of ${Math.round(b.value).toLocaleString()}`});
    if(g.value && b.value && Math.round(g.value) !== Math.round(b.value))
      warn.push({u, t:`contract value differs between sheets — ${Math.round(b.value).toLocaleString()} here, ${Math.round(g.value).toLocaleString()} on المساحات والقيمة`});
    if(!b.isLet && b.value)
      warn.push({u, t:'recorded as vacant but still carries a contract value'});
    if(!b.isLet && b.name)
      warn.push({u, t:'recorded as vacant but carries a tenant name'});
    const end = cEnd !== null ? impDate(r[cEnd]) : null;
    if(b.isLet) rows.forEach(x => { if(end && x.due && x.due > end)
      warn.push({u, t:`an instalment is dated ${x.due}, after the lease ends on ${end}`}); });

    if(!b.isLet && rows.length){
      warn.push({u, t:`a payment schedule of ${rows.length} instalments is attached to an apartment recorded as vacant — not carried into the register`});
      rows = [];
    }
    out.push({
      id: u,
      type: g.type || (cRooms !== null ? ROOMS(r[cRooms]) : null) || '—',
      area: g.area || null,
      floor: g.floor === null || g.floor === undefined ? 0 : g.floor,
      let: b.isLet,
      tenant: b.isLet ? (b.name || null) : null,
      tenantAr: b.isLet ? (b.name || null) : null,
      value: b.value || null,
      start: cStart !== null ? impDate(r[cStart]) : null,
      end,
      paid: b.isLet ? paidTotal : null,
      remain: b.isLet ? (cRem !== null ? impNum(r[cRem]) : null) : null,
      inst: rows
    });
  });

  /* the collections sheet, when the workbook carries one, is authoritative
     for what is outstanding */
  const arrSheet = names.find(sheetIs('متأخرات'));
  const arrears = [];
  if(arrSheet){
    const g = sheets[arrSheet], gh = findHeader(g,'رقم الشقة');
    if(gh){
      const gm = headerMap(g, gh.row);
      const gu = impPick(gm,'رقم الشقة'), gamt = impPick(gm,'المبلغ'), gdue = impPick(gm,'تاريخ الاستحقاق');
      for(let i = gh.row + 1; i < g.length; i++){
        const r = g[i] || [];
        let u = impUnit(r[gu]);
        if(!u){                                  /* the collections sheet often uses a bare number */
          const n = impNum(r[gu]);
          if(n !== null){
            /* A bare "101" is not an apartment while both blocks have a 101.
               find() took the first match and `out` is sorted, so Block A won
               every time and an arrears line landed on a flat that may not owe
               anything. An unimported line the operator is told about beats an
               imported one attributed to the wrong tenant. */
            const hits = out.filter(x => Number(x.id.split('-')[1]) === n);
            if(hits.length === 1) u = hits[0].id;
            else if(hits.length > 1){
              warn.push({t:`the collections sheet names apartment ${n} without a block, and ` +
                            `${hits.map(x => x.id).join(' and ')} both carry that number — ` +
                            'that row was not imported'});
              continue;
            }
          }
        }
        if(!u) continue;
        const amt = gamt !== null ? impNum(r[gamt]) : null;
        if(!amt) continue;
        arrears.push({u, amt, due: gdue !== null ? impDate(r[gdue]) : null});
      }
    }
  }

  if(!arrSheet) warn.push({t:'This workbook has no متأخرات التحصيل sheet. Arrears will be derived from the payment schedule alone, so any instalment carrying a wrong year will not appear as overdue. Include the collections sheet in the file to have arrears checked against it.'});

  return {rows: out, warn, arrears, sheet: main, rowCount, dupes,
          sheetNames: names, geoSheet: areaSheet || null, arrSheet: arrSheet || null};
}

/* ---------------------------- figures ---------------------------- */
function regFigures(rows){
  const today = TODAY;
  let f = {units: rows.length, let: 0, contracted: 0, billed: 0, collected: 0, arrears: 0, arrUnits: 0};
  rows.forEach(r => {
    if(!r.let) return;                    /* vacant apartments are outside every rent figure */
    f.let++; f.contracted += r.value || 0;
    let a = 0;
    (r.inst || []).forEach(x => {
      const due = x.due ? new Date(x.due) : null;
      const billed = due ? due <= today : false;
      if(billed) f.billed += x.amt;
      if(x.paid) f.collected += x.amt;
      if(billed && !x.paid) a += x.amt;
    });
    if(a > 0){ f.arrears += a; f.arrUnits++; }
  });
  return f;
}

/* ---------------------------- UI ---------------------------- */
function importOpen(){
  const cur = regFigures(REGISTER);
  openDrawer(T('imp_title'), `
   <div class="card mb"><div class="bd">

async function importRun(input){
  const file = input.files && input.files[0];
  if(!file) return;
  $('impBusy').style.display = 'block';
  $('impOut').innerHTML = '';
  try{
    const sheets = await readWorkbook(file);
    const res = parseRegister(sheets);
    if(!res.rows.length) throw new Error('no_units');
    IMP.result = res; IMP.file = file.name;
    $('impBusy').style.display = 'none';
    $('impOut').innerHTML = importPreviewHtml(res);
  }catch(err){
    $('impBusy').style.display = 'none';
    const key = {not_zip:'imp_e_zip', not_xlsx:'imp_e_zip', no_inflate:'imp_e_browser',
                 no_register_sheet:'imp_e_sheet', no_header:'imp_e_sheet',
                 columns_not_found:'imp_e_cols', no_units:'imp_e_units'}[err.message] || 'imp_e_other';
    $('impOut').innerHTML = `<div class="sect">${T('imp_failed')}</div>
      <div class="card"><div class="bd"><div class="warnbox">${I('alert',16,2.2)}<span>${T(key)}</span></div>
      <div class="note" style="margin-top:10px">${err.message}</div></div></div>`;
  }
}
