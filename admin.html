async function importApply(){
  const res = IMP.result; if(!res) return;
  LINK.commit(s => { s.register = res.rows; s.registerFrom = IMP.file; s.registerAt = Date.now(); }, 'console');

  /* DATA-01. "Register replaced — 37 apartments loaded" used to fire here,
     unconditionally, while the write was still in flight — so the sentence
     appeared over a database that had refused it, and the screen was repainted
     with a register Postgres did not hold. Wait for the outcome first.

     LINK.settled exists only in live mode; offline there is nothing to wait for
     and nothing that can be refused, so the demo path falls straight through. */
  let out = null;
  try{ out = LINK.settled ? await LINK.settled() : null; }
  catch(e){ console.error('importApply', e); }

  if(out && (out.held || out.failed)){
    /* The reconciliation panel is open and explains itself. Two things must not
       happen here: the screen must not be repainted from a file the database
       has not taken, and the shared record must not keep claiming an import
       that did not land — the other console in the office reads that record. */
    LINK.commit(s => { delete s.register; delete s.registerFrom; delete s.registerAt; }, 'console');
    return;
  }

  applyRegister(res.rows);
  closeDrawer(); render();
  toast(T('imp_done').replace('{n}', NUM(res.rows.length)));
}

/* rebuild every unit from a register, in place, then recompute everything */
function applyRegister(rows){
  const built = rows.map(r => ({
    u:r.id, floor:r.floor, type:r.type, area:r.area,
    /* A register imported from a spreadsheet carries no lettable column, and
       every row in one is a flat somebody means to let. Absent means lettable;
       only an explicit false takes a row out of the denominator. */
    lettable: r.lettable !== false,
    lettableSource: r.lettableSource || null,
    occupied:r.let, tenant:r.tenant, tenant_ar:r.tenantAr,
    leaseId: r.leaseId || null,                       /* N-01 — see toRegister */
    /* Absent (an imported spreadsheet row) is not the same as empty: undefined
       keeps what the screen already knew until the next read says otherwise. */
    residentId: r.residentId, email: r.email, signedIn: r.signedIn,
    rent:r.value||0, leaseStart:r.start?new Date(r.start):null, leaseEnd:r.end?new Date(r.end):null,
    inst:(r.inst||[]).map(x=>({id:x.id || null, q:x.n, amt:x.amt, due:x.due?new Date(x.due):null,
          billed: x.due? new Date(x.due)<=TODAY : false, paid:x.paid,
          /* The date it was actually paid, or nothing. Never the due date:
             that is a guess wearing a record's clothes — DATA-07. */
          paidOn: x.on ? new Date(x.on) : null, ref: x.ref || null})),
    sheetPaid:r.paid, sheetRemain:r.remain
  }));
  const keep = {};
  UNITS.forEach(u => keep[u.u] = {account:u.account, lastSeen:u.lastSeen, prefers:u.prefers,
                                  residentId:u.residentId, email:u.email, signedIn:u.signedIn});
  UNITS.length = 0;
  built.forEach((u,i) => {
    const k = keep[u.u] || {};
    if(u.residentId === undefined){ u.residentId = k.residentId || null; u.email = k.email || null; u.signedIn = !!k.signedIn; }
    u.residentId = u.residentId || null; u.email = u.email || null; u.signedIn = !!u.signedIn;
    /* The app account is read, not assumed: signed in, an address on file
       waiting for its first sign-in, or nothing yet. It was 'none' for every
       flat and the page called that "Deactivated" — nobody had ever been
       activated, so nobody had been deactivated either. */
    u.account = u.signedIn ? 'verified' : u.email ? 'pending' : 'none';
    u.lastSeen = k.lastSeen ?? null;
    u.prefers = k.prefers || null;
    u.profile = 'none';
    UNITS.push(u);
  });
  recompute();
}

/* ------------------------------ helpers ------------------------------ */
const $=id=>document.getElementById(id);
/* A date that is not known is '—', the same em dash this console uses
   everywhere else for "no value recorded". It used to throw: five flats in the
   register are marked occupied with no active lease, so `leaseEnd` is null for
   them, and `.getDate()` on null took the Units and Residents pages down —
   header updated, body left showing the previous screen, language toggle dead
   until you navigated away. An unknown date is a fact about the data, not a
   fault in the page. Where it means something more than "unknown", the caller
   says so: see the Units register below. */
const fmtD=d=>{const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
 const mAr=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
 if(!(d instanceof Date) || isNaN(d)) return '—';
 return NUM(d.getDate())+' '+L(m[d.getMonth()],mAr[d.getMonth()])+' '+NUM(d.getFullYear());};
const ageH=workedH;

const floorName=f=>f===0?L('Ground','الأرضي'):NUM(f);
/* F-03. A ten-character ISO string is a calendar date and is shown as one, in
   every zone; anything longer is a moment and is shown in the reader's local
   time, as before. The shape of the string says which — nothing is guessed. */
const fmtISO=str=>(!str||str==='—')?'—':/^\d{4}-\d{2}-\d{2}$/.test(String(str))?fmtDay(new Date(str+'T00:00:00Z')):fmtD(new Date(str));
/* F-03. A calendar date, as opposed to a moment. A date-only value is held at
   UTC midnight, so its day is in the UTC fields; fmtD reads the LOCAL fields,
   which is right for a moment (TODAY, a timestamp) and a day early for a
   calendar date read west of Greenwich. The lease forms and the drawer they
   open from use this. The rest of the console still reads calendar dates
   through fmtD and fmtISO — R-06, pending. */
const fmtDay=d=>(d instanceof Date && !isNaN(d)) ? fmtD(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12)) : '—';
const STA={submitted:['p-info','clock','st_sub'],assigned:['p-info','check','st_ass'],
 progress:['p-warn','clock','st_prog'],hold:['p-ser','pause','st_hold'],
 done:['p-good','check','st_done'],cancelled:['p-neut','x','st_can']};
const stPill=s=>{const [cls,ic,k]=STA[s];return `<span class="pill ${cls}">${I(ic,13,2.1)}${T(k)}</span>`;};
/* One vocabulary for priority, and it is the database's — see the note beside
   PRI in the resident app. Anything stored under the old words is mapped on the
   way past rather than rendered as an unknown. */
const PRI       = ['emergency','urgent','routine'];
const PRI_OLD   = {high:'urgent', med:'routine', low:'routine'};
const priOK     = p => PRI.includes(p) ? p : (PRI_OLD[p] || 'routine');
const VISIT     = ['any','morning','afternoon','evening','weekend'];
const VISIT_OLD = {after:'afternoon', eve:'evening'};
const visitOK   = v => VISIT.includes(v) ? v : (VISIT_OLD[v] || 'any');
const prPill=p=>{const v=priOK(p);
  return v==='emergency' ? `<span class="pill p-crit">${I('alert',13,2.1)}${T('pr_emergency')}</span>`
       : v==='urgent'    ? `<span class="pill p-warn">${I('alert',13,2.1)}${T('pr_urgent')}</span>`
       :                   `<span class="pill p-neut">${T('pr_routine')}</span>`;};
const techName=w=>L(w.tech,w.tech_ar);

/* SEC-03. `m` went into innerHTML raw — see the same note in index.html. A
   database refusal carries the value it refused, and that value is often text
   a resident typed. */
function toast(m){const e=$('toast');e.innerHTML=I('check',17,2.2)+'<span>'+esc(m)+'</span>';e.classList.add('on');
 clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),3600);}
/* Closing the drawer also un-reveals any identity number that was showing in
   it. The reveal was documented as per-view — "nothing is remembered" — but
   ID_SHOWN outlived the drawer, so a contact revealed once came back revealed
   the next time anyone opened them, on any screen, for the rest of the session.
   go() closes the drawer on every navigation, so this is the one place needed.
   Guarded on typeof: closeDrawer is defined some 2,300 lines above ID_SHOWN and
   runs at boot, where a bare reference throws from the temporal dead zone. */
/* Every drawer opened gets a number. A slow read that finishes after the
   operator has moved on belongs to a drawer that is no longer on screen, and
   must not repaint over the one that is — or reopen one that was closed. */
let DRAWER_SEQ = 0;
function closeDrawer(){
  const d = $('drawer');
  d.classList.remove('on');$('scrim').classList.remove('on');
  /* A11Y-02. Take the closed drawer's controls out of the tab order and the
     screen-reader tree. inert is a state, not an animation, so it cannot race
     the slide-out the way a visibility transition did. */
  d.setAttribute('inert',''); d.setAttribute('aria-hidden','true');
  d.removeAttribute('aria-modal');
  DRAWER_SEQ++;
  try{ if(typeof ID_SHOWN !== 'undefined') ID_SHOWN = null; }catch(e){}
  /* CON-09. Focus goes back to where it was, if that is still on the page. */
  try{
    const back = DRAWER_RETURN_FOCUS; DRAWER_RETURN_FOCUS = null;
    if(back && back !== document.body && document.contains(back) && typeof back.focus === 'function') back.focus();
  }catch(e){}
}

/* ------------------------ schedule reconciliation ------------------------ */
/* DATA-01's other half. The database now refuses to destroy payment history,
   which turns what used to be silent data loss into a refusal — and a refusal
   nobody is shown is its own bug. Every held write lands here, named, with what
   is on file beside what was proposed, and the operator decides. */
let HELD = [];
/* A held import, kept whole. Separate from HELD because it is answered as one
   act — see saveRegister for why an import is not applied in pieces. */
let HELD_IMPORT = null;
function rcWhat(c){
  const k = {paid_row_beyond_new_schedule:'rc_k_beyond', paid_amount_differs:'rc_k_amount',
             paid_due_date_differs:'rc_k_due', paid_flag_without_receipt:'rc_k_noreceipt',
             total_differs_from_contract:'rc_k_total'}[c.kind];
  return k ? T(k) : T('rc_k_other');
}
function rcVal(v){
  if(v === null || v === undefined || v === '') return '—';
  if(typeof v === 'number') return money(v);
  /* PostgREST returns numeric as a JSON string, so an amount arrives as
     "12345.67" and must not be printed raw beside formatted ones. */
  if(typeof v === 'string' && /^-?\d+(\.\d+)?$/.test(v)) return money(Number(v));
  return esc(String(v));
}
/* One flat's held write, rendered. `buttons` is the caller's, because what may
   be done about it differs: a single lease edit can be accepted on its own, and
   a flat inside a held import cannot — the import is accepted whole or not at
   all, so its sections carry no button of their own. */
function rcSection(r, buttons){
  const rows = (r.conflicts || []).map(c => `<tr>
      <td>${c.seq === undefined ? '—' : esc(String(c.seq))}</td>
      <td>${rcWhat(c)}</td>
      <td class="num">${rcVal(c.kept !== undefined ? c.kept
                        : (c.amount !== undefined ? c.amount
                        : (c.scheduled !== undefined ? c.scheduled : c.due_on)))}</td>
      <td class="num">${rcVal(c.proposed !== undefined ? c.proposed
                        : (c.contract !== undefined ? c.contract : null))}</td>
      <td>${c.receipt_ref ? esc(String(c.receipt_ref))
                          : '<span class="muted">' + T('rc_none_ref') + '</span>'}</td>
    </tr>`).join('');
  const sum = T('rc_summary').replace('{n}', r.deleted_unpaid || 0)
                             .replace('{u}', r.updated || 0)
                             .replace('{i}', r.inserted || 0)
                             .replace('{k}', r.kept_paid || 0);
  return `<section style="margin-bottom:22px">
    <h3 style="margin:0 0 4px">${T('rc_unit')} ${esc(String(r.unit || '—'))}</h3>
    <p class="muted" style="margin:0 0 10px">${esc(sum)}</p>
    <div style="overflow-x:auto"><table class="tbl"><thead><tr>
      <th>${T('rc_seq')}</th><th>${T('rc_what')}</th>
      <th class="num">${T('rc_kept')}</th><th class="num">${T('rc_proposed')}</th>
      <th>${T('rc_receipt')}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${buttons ? `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">${buttons}</div>` : ''}
  </section>`;
}
function openReconcile(receipts, batch){
  HELD = (receipts || []).filter(Boolean);
  HELD_IMPORT = batch || null;
  if(!HELD.length && !HELD_IMPORT){ toast(T('rc_none')); return; }
  const singles = HELD.map((r, ri) => rcSection(r,
      `<button class="btn primary" onclick="rcApply(${ri})">${T('rc_apply')}</button>
       <button class="btn" onclick="closeDrawer()">${T('rc_cancel')}</button>`)).join('');
  let imported = '';
  if(HELD_IMPORT){
    const held = (HELD_IMPORT.receipts || []).filter(Boolean);
    const total = ((HELD_IMPORT.plan || {}).leases || []).length;
    imported = `<div class="warnbox" style="margin:0 0 16px">${I('alert',16,2.2)}<span>${
        esc(T('rc_import_lead').replace('{h}', NUM(held.length)).replace('{n}', NUM(total)))
      }</span></div>`
      + held.map(r => rcSection(r, '')).join('')
      + `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
           <button class="btn primary" onclick="rcApplyImport()">${T('rc_apply_import')}</button>
           <button class="btn" onclick="closeDrawer()">${T('rc_cancel_import')}</button>
         </div>`;
  }
  openDrawer(T('rc_title'),
    `<p class="muted" style="margin:0 0 16px">${T('rc_lead')}</p>${singles}${imported}`);
}
async function rcApply(i){
  const r = HELD[i];
  if(!r) return;
  try{
    await LIVE.applyHeld(r);
    HELD[i] = null;
    closeDrawer();
    toast(T('rc_applied'));
  }catch(e){
    toast(L('The database refused that change: ' + (e && e.message || ''),
            'رفضت قاعدة البيانات هذا التغيير: ' + (e && e.message || '')));
  }
}
/* The whole import, accepted. Until this runs, no part of the import exists in
   Postgres — not the schedules and not the unit rows either. */
async function rcApplyImport(){
  const b = HELD_IMPORT;
  if(!b) return;
  try{
    await LIVE.applyRegisterHeld(b);
    HELD_IMPORT = null;
    closeDrawer();
    if(typeof applyRegister === 'function' && b.plan && b.plan.rows)
      applyRegister(b.plan.rows);
    render();
    toast(T('rc_applied_import'));
  }catch(e){
    toast(L('The database refused that change: ' + (e && e.message || ''),
            'رفضت قاعدة البيانات هذا التغيير: ' + (e && e.message || '')));
  }
}
/* CON-09. The drawer is a dialog and says so: a role, a name taken from its
   own heading, focus moved in when it opens and handed back to whatever had
   it when it closes, and Escape to close it. Without the role a screen reader
   read it as more page; without the focus move a keyboard user was left on a
   control behind the scrim. */
let DRAWER_RETURN_FOCUS = null;
/* DUAL-07. A <label> that names nothing is text: CON-09 gave the twelve
   contact fields their `for`, and the completed-job form, the work-order
   drawer, the document drawer and the announcement form were left as they
   were — 24 controls a screen reader announced as "edit text". Every one of
   them is written label-then-control, so the markup now says so, and this
   pairs any label a future form forgets, then reports what it could not
   pair, so the omission is visible in the console rather than silent. */
let LABEL_SEQ = 0;
function labelControls(root){
  const missed = [];
  try{
    (root || document).querySelectorAll('label.f').forEach(lb => {
      const f = lb.getAttribute('for');
      if(f && document.getElementById(f)) return;
      if(lb.querySelector('input,select,textarea')) return;      /* wraps its control */
      let el = lb.nextElementSibling;
      while(el && !/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){
        const inner = el.querySelector ? el.querySelector('input,select,textarea') : null;
        if(inner){ el = inner; break; }
        if(el.getAttribute && el.getAttribute('role') === 'group'){
          /* a group of chips or radios: the label names the group */
          if(!lb.id) lb.id = 'lbl' + (++LABEL_SEQ);
          el.setAttribute('aria-labelledby', lb.id); return;
        }
        el = el.nextElementSibling;
      }
      if(!el){ missed.push((lb.textContent || '').trim()); return; }
      if(!el.id) el.id = 'f' + (++LABEL_SEQ);
      lb.setAttribute('for', el.id);
    });
  }catch(e){}
  if(missed.length) console.warn('labels naming no control: ' + missed.join(' | '));
  return missed;
}
/* DUAL-07. Tab and Shift+Tab stay inside the open dialog. aria-modal tells a
   screen reader the page behind is inert; it tells the keyboard nothing, and
   Shift+Tab from the first control walked out under the scrim. */
function trapTab(e, d){
  const sel = 'a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), ' +
              'select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';
  const list = [...d.querySelectorAll(sel)].filter(el => el.offsetWidth || el.offsetHeight || el.getClientRects().length);
  if(!list.length){ e.preventDefault(); return; }
  const first = list[0], last = list[list.length - 1], cur = document.activeElement;
  if(!d.contains(cur)){ e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
  if(e.shiftKey && (cur === first || cur === d.querySelector('#drawerTitle'))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && cur === last){ e.preventDefault(); first.focus(); }
}
function openDrawer(title,body){
 const d = $('drawer');
 if(!d.classList.contains('on')){
   try{ DRAWER_RETURN_FOCUS = document.activeElement; }catch(e){ DRAWER_RETURN_FOCUS = null; }
 }
 d.innerHTML=`<div class="dh"><h2 id="drawerTitle" tabindex="-1">${title}</h2><div style="flex:1"></div>
   <button class="x" type="button" onclick="closeDrawer()"
     aria-label="${esc(T('a_close'))}">${I('x',20,2)}</button></div><div class="db">${body}</div>`;
 d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
 d.setAttribute('aria-labelledby', 'drawerTitle');
 /* A11Y-02. Open: back into the tab order and the accessibility tree. */
 d.removeAttribute('inert'); d.removeAttribute('aria-hidden');
 labelControls(d);
 d.classList.add('on');$('scrim').classList.add('on');
 /* Focus goes to the first control if there is one, else to the heading —
    after the slide-in, so a screen reader announces the dialog it landed in. */
 setTimeout(() => { try{
   const first = d.querySelector('.db input:not([type=hidden]), .db select, .db textarea, .db button, .db [tabindex="0"]');
   (first || d.querySelector('#drawerTitle') || d).focus();
 }catch(e){} }, 60);
}

const SER=['var(--series-1)','var(--series-2)','var(--series-3)','var(--series-4)'];

/* grouped bars, 2 series */
function chartFlow(){
 const W=640,H=210,PL=48,PR=12,PT=14,PB=26;
 /* round up to a multiple of 8 so the four gridline labels are whole numbers */
 const max=Math.max(8, Math.ceil(Math.max(0,...byMonth.map(m=>Math.max(m.raised,m.closed)))/8)*8);
 const iw=W-PL-PR, ih=H-PT-PB, bw=iw/byMonth.length;
 const bar=(bw-10)/2-1;
 let g='';
 for(let t=0;t<=max;t+=max/4){
  const y=PT+ih-(t/max)*ih;
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${NUM(t)}</text>`;
 }
 let b='';
 byMonth.forEach((m,i)=>{
  const x0=PL+i*bw+5;
  [['raised',m.raised,0],['closed',m.closed,1]].forEach(([k,v,si])=>{
   const h=(v/max)*ih, x=x0+si*(bar+2), y=PT+ih-h;
   b+=`<rect x="${x}" y="${y}" width="${bar}" height="${h}" rx="4" fill="${SER[si]}"
        class="hb" data-i="${i}" data-k="${k}"/>`;
  });
  b+=`<text x="${x0+bar+1}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${L(m.en,m.ar)}</text>`;
 });
 /* selective direct labels: latest month only */
 const li=byMonth.length-1, lm=byMonth[li], x0=PL+li*bw+5;
 b+=`<text x="${x0+bar/2}" y="${PT+ih-(lm.raised/max)*ih-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${NUM(lm.raised)}</text>`;
 b+=`<text x="${x0+bar+2+bar/2}" y="${PT+ih-(lm.closed/max)*ih-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)">${NUM(lm.closed)}</text>`;
 return `<svg viewBox="0 0 ${W} ${H}" role="img">
   <line x1="${PL}" x2="${W-PR}" y1="${PT+ih}" y2="${PT+ih}" stroke="var(--axis)" stroke-width="1"/>${g}${b}</svg>`;
}

/* single line + target */
function chartSla(){
 const W=640,H=200,PL=48,PR=40,PT=16,PB=26;
 const iw=W-PL-PR, ih=H-PT-PB;
 const yv=v=>PT+ih-((v-60)/40)*ih;

 let g='';
 [60,70,80,90,100].forEach(t=>{
  const y=yv(t);
  g+=`<line x1="${PL}" x2="${W-PR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${PL-8}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${NUM(t)}%</text>`;
 });
 const ty=yv(90);
 g+=`<line x1="${PL}" x2="${W-PR}" y1="${ty}" y2="${ty}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 4"/>

 /* a month with nothing measurable is a gap in the line, not a zero */
 const seg=[]; let run=[];
 byMonth.forEach((m,i)=>{ if(m.sla==null){ if(run.length>1) seg.push(run); run=[]; }
                          else run.push(`${xv(i)},${yv(m.sla)}`); });
 if(run.length>1) seg.push(run);
 let d=seg.map(r=>`<polyline points="${r.join(' ')}" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`).join('');
 byMonth.forEach((m,i)=>{

  d+=`<text x="${xv(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${L(m.en,m.ar)}</text>`;
 });
 const lastMeasured=[...byMonth].reverse().find(m=>m.sla!=null);
 const li=byMonth.length-1;

   d+=`<text x="${xv(li)}" y="${yv(byMonth[li].sla)-12}" text-anchor="middle" font-size="12" font-weight="800" fill="var(--ink)">${NUM(byMonth[li].sla)}%</text>`;
 else if(!lastMeasured)
   d+=`<text x="${PL+iw/2}" y="${PT+ih/2}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">${T('nolog_sla')}</text>`;

}

/* --------------------------- who is signed in ----------------------------
   The header used to read two constants. Every operator was told they were
   the same person — a name and a job title that belong to nobody with an
   account — and the local document path stamped that same name onto records
   as their author. Neither claim had a source behind it.
   Both now come from the roster row of the account that is actually signed
   in. A staff member may read their own row and no other (policy
   staff_members_self), so a viewer sees their own name exactly as an admin
   does, and this needs no privilege the console did not already have.
   If the roster carries no name, the account is named instead. The console
   never invents a person. */
const ME = (function(){
  let row = null, loadedFor = null, loading = false;
  const email = () => (SB.email() || '');
  function name(){
    const n = row && L(row.name_en, row.name_ar);
    if(n && String(n).trim()) return String(n).trim();
    const e = email();
    return e ? e.split('@')[0] : '';
  }
  function subtitle(){
    if(row && row.job_title && String(row.job_title).trim())
      return String(row.job_title).trim();
    return row && row.role ? T('rl_' + row.role) : '';
  }
  function initials(){
    const parts = name().replace(/[._\-]+/g,' ').trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return '';
    return (parts.length === 1 ? parts[0].slice(0,2)
                               : parts[0][0] + parts[1][0]).toUpperCase();
  }
  /* Fetch once per signed-in address, then repaint. Never blocks a render.

     Ask for the row by address, and then check the row that comes back is
     that address. Both halves are load-bearing. Leaving the filter off and
     trusting the policy to narrow it is what this code did first, and it was
     wrong: staff_members carries a self policy AND an admin policy, and RLS
     ORs them — so a viewer got their own row and an administrator got the
     whole roster, of which limit=1 handed back an arbitrary colleague. The
     header then named that colleague. Never render a row whose address is
     not the one signed in; be nameless instead. */
  function ensure(after){
    const e = email().toLowerCase();
    if(!e || loading || loadedFor === e) return;
    loading = true;
    SB.sel('staff_members',
           'select=email,name_en,name_ar,job_title,role'
           + '&email=eq.' + encodeURIComponent(e) + '&limit=1')
      .then(r => {
        const got = r && r[0];
        row = (got && String(got.email || '').toLowerCase() === e) ? got : null;
      })
      .catch(() => { row = null; })
      .then(() => { loadedFor = e; loading = false; if(after) after(); });
  }
  return {ensure, name, subtitle, initials, email,
          clear(){ row = null; loadedFor = null; }};
})();

}

/* DATA-03. One place, so the dashboard and the maintenance screen cannot drift,
   and so the denominator can be MISSING rather than wrong: a register that has
   not loaded has no lettable count, and an em dash is the honest answer to
   "what is the occupancy" before anything has been read. Dividing by zero and
   printing NaN% was the alternative. */
function occPct(){ return lettable ? Math.round(occupied / lettable * 100) : null; }
function occStat(){
  const pct = occPct();
  /* The tile counts physical occupancy \u2014 the register's occupied flag \u2014 so an
     expired lease, or a flat with no lease on file, is still in the numerator.
     This line reads the true composition from the same UNITS the number is
     divided from: leased (a current lease), expired (past its end, still let),
     and no lease on file. Shown only when the split is not all-current, so a
     clean building carries no caveat. */
  const exp     = UNITS.filter(u => isExpired(u)).length;
  const noLease = UNITS.filter(u => u.occupied && !u.leaseEnd).length;
  const leased  = Math.max(0, occupied - exp - noLease);
  let split = '';
  if(occupied && (exp || noLease)){
    const parts = [NUM(leased) + ' ' + T('st_occ_leased')];
    if(exp)     parts.push(NUM(exp) + ' ' + T('st_occ_expired'));
    if(noLease) parts.push(NUM(noLease) + ' ' + T('st_occ_nolease'));
    split = `<div class="sub2" style="margin-top:6px;font-size:11px;line-height:1.5">${parts.join(' \u00b7 ')}</div>`;
  }
  return stat(T('st_occ'),
              lettable ? NUM(occupied) + '/' + NUM(lettable) : '\u2014',
              {t: pct === null ? T('st_occ_none') : NUM(pct) + '%', cls:'flat'},
              `<div class="meter"><i style="width:${pct === null ? 0 : pct}%"></i></div>${split}`);
}

/* One pill, five states, so a state added to the function cannot quietly fall
   through to "In arrears" at the render — which is what the old three-way
   ternary did with anything it did not recognise. */

  const map = { good:['p-good','check','p_good'], late:['p-warn','clock','p_late'],
                problem:['p-crit','alert','p_problem'], none:['p-neut','clock','p_none'],
                unrecorded:['p-neut','alert','p_unrecorded'] };
  const [cls, ico, key] = map[p] || map.unrecorded;
  return `<span class="pill ${cls}">${I(ico,12,2.1)}${T(key)}</span>`;
}

/* DATA-02. Rendered at the top of every screen that states a cost figure. A
   screen that cannot know what was spent must say so where the number is, not
   in a console warning nobody reads. */
function costsWarning(){
  let c; try{ c = LIVE.costsState(); }catch(e){ return ''; }
  if(!c || c.ok) return '';
  const when = c.since instanceof Date
    ? String(c.since.getHours()).padStart(2,'0') + ':' + String(c.since.getMinutes()).padStart(2,'0')
    : '';
  const msg = c.everLoaded ? T('costs_stale_t').replace('{t}', when) : T('costs_gone_t');
  return `<div class="card mb"><div class="bd">
    <div class="warnbox">${I('alert',16,2.2)}<span>${esc(msg)}</span></div></div></div>`;
}

/* CON-03. The key is minted when the FORM opens and reused for every press of
   Save on that form. Minting it on Save was the first version and it had a
   hole CON-02 made visible: the save lands, the answer is lost, the person is
   told it did not happen, presses Save again — and a fresh key files the same
   job a second time. One form, one submission, one key. */

async function logJobSave(){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const unit = $('jUnit').value, cat = $('jCat').value;
  const mat  = $('jMat').value, date = $('jDate').value;
  if(!unit || !cat || mat === '' || !date){ toast(T('log_need')); return; }
  const u = UNITS.find(x=>x.u===unit);
  const d = new Date(date + 'T12:00:00');
  const sup = ($('jSup').value || '').trim();
  const rec = {
    unit, cat, date, supplier: sup,
    desc: ($('jDesc').value || '').trim() || catName(CAT(cat)),
    mat: Number(mat) || 0, labH: Number($('jLab').value) || 0,
    inv: ($('jInv').value || '').trim(),
    /* CON-03. The key this form was opened with. See logJobOpen. */
    request_key: JOB_KEY
  };
  /* The reference is minted here, from the shared record's own counter, and
     the counter moves in the same commit that records the job. logJobAdd used
     to derive it from WOS.length + 1 — a count, not a sequence. Two consoles
     holding the same hundred jobs both proposed I101; one inserted and the
     other's insert died on the primary key, and the cost-line path has no
     retry. nextSeq exists for exactly this and was kept in step by two other
     places, and this one site did not read it. */
  const st0  = LINK.get() || {};
  const seq  = Math.max(Number(st0.nextSeq) || 0, WOS.length + 1);
  rec.id = 'MR-' + String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0')
         + '-I' + String(seq).padStart(3,'0');
  /* CON-02. The job joins the list on screen only once the database holds
     it. The form stays open, values intact, until then. */
  const key = 'job:' + rec.id; if(PENDING.has(key)) return;
  saving(key, true);
  LINK.commit(st => {
    st.jobs = st.jobs || []; st.jobs.push({...rec, id: rec.id});
    st.nextSeq = Math.max(Number(st.nextSeq) || 0, seq + 1);
  }, 'console');
  const ok = await settledOK();
  saving(key, false);
  if(!ok){ toast(notSaved('log_not_done')); return; }
  JOB_KEY = null;                              /* this submission is done with */
  /* DUAL-06. The record that joins the list is the one the database returned,
     not the one this form sent. A reference that collided was renumbered on
     the way in (REQ-01), and the list was being handed the original — a
     number the database does not hold, on the screen the office quotes from. */
  const row = LAST_SAVE && LAST_SAVE.landed && LAST_SAVE.landed['job:' + rec.id];
  if(row){
    if(row.id) rec.id = row.id;
    if(row.description != null) rec.desc = row.description;
    rec.supplier = row.technician || '';
    rec.mat  = Number(row.material)   || 0;
    rec.labH = Number(row.labour_hrs) || 0;
  }
  logJobAdd(rec, u, d);
  recompute(); closeDrawer(); render();
  toast(T('log_done'));
}

/* SCALE-02. logJobAdd is called once per line by three replay loops, and it
   sorted the ENTIRE work-order list on every one of those calls. Importing the
   cost register was therefore quadratic in the number of lines: 100 lines took
   10ms, 1,000 took 150ms, 2,000 took 495ms, 4,000 took 1,959ms and 8,000 took
   7,957ms — doubling the rows quadrupled the time. Measured at 4,000 lines,
   1,595ms of that 1,959ms was the per-row sort and 202ms the per-row duplicate
   scan; a single sort after the loop is 0.9ms.

   Nothing about the figures changes: the list ends up in the same order with
   the same rows, because the sort is the same sort and it still runs before
   anything reads WOS. What changes is that it runs once, over an appended
   list, so a replay costs one traversal plus one sort instead of one sort per
   line: 8,000 lines go from 7.7s to 27ms.

   A caller adding many rows in a row passes a `bulk` from bulkAdd() and calls
   bulkDone() when it has finished. A caller adding one row passes nothing and
   behaves exactly as before — a single add has nothing to amortise. */
/* Function declarations, not const arrows: the first caller sits some 1,700
   lines above this point, and a const would still be in its temporal dead zone
   if anything reached that caller during script evaluation. */
function bulkAdd(){ return {seen: new Set(WOS.map(w => w.id))}; }
function bulkDone(){ WOS.sort(byRaised); }

/* build the work order; shared by the form and by the shared-record replay */
function logJobAdd(rec, u, d, bulk){
  /* The caller supplies the reference; a replay of the shared record carries
     the one that was minted on the other console. The fallback is only for a
     record written before references travelled with them. */
  const id = rec.id || ('MR-' + String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0')
                        + '-I' + String(Math.max(Number((LINK.get()||{}).nextSeq) || 0,
                                                 WOS.length + 1)).padStart(3,'0'));
  /* The seen-set is seeded from WOS itself, not built up empty, so a replay
     over rows that are already loaded still refuses the duplicates. */
  if(bulk ? bulk.seen.has(id) : WOS.some(w=>w.id===id)) return id;
  if(bulk) bulk.seen.add(id);
  const row = {
    id, cat: rec.cat, unit: rec.unit,
    tenant: (u&&u.tenant)||'—', tenant_ar: (u&&u.tenant_ar)||'—',
    desc: rec.desc, pri:'routine', ch:'desk', raised: d,
    respH: 0, closeH: 0, target: 0, breached: false, noSla: true,
    status: 'done', tech: rec.supplier || '—', tech_ar: rec.supplier || '—',
    supplier: !!rec.supplier, labH: rec.labH, mat: rec.mat, rating: null,
    invoice: rec.inv || null,
    month: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
  };
  /* unshift is itself O(n) — it moves every existing element — so a replay that
     unshifted each line stayed quadratic even with the sort hoisted out, just
     with a much smaller constant. In bulk mode where the line lands does not
     matter, because bulkDone() sorts before anything reads the list, so append
     and let the one sort put it in place. Outside bulk mode the row goes to the
     front and the list is sorted immediately, exactly as it always was. */
  if(bulk){ WOS.push(row); }
  else { WOS.unshift(row); WOS.sort(byRaised); }
  /* a supplier exists once a job names it */
  if(rec.supplier && !SUPPLIERS.some(x=>x.n===rec.supplier)){
    SUPPLIERS.push({n:rec.supplier, ar:rec.supplier, tr:'—', tr_ar:'—',
                    resp:null, rew:null, rate:null, to:'—'});
  }
  return id;
}

let WF={q:'',status:'open',cat:'all',pri:'all',page:0};
/* SCALE-01. The list showed the first sixty rows of whatever the filters
   returned and said so in a note at the foot — "60 of 100 records shown" — with
   no way to reach the other forty. The records were not lost; the Everything
   report reaches all hundred. But the screen an operator actually works in
   could not, and the audit is right that this gets worse rather than better as
   the history grows.

   Sixty stays as the page size: it is what the table was built to render
   without becoming unreadable. What changes is that there is a next page. */
const WO_PAGE = 60;
function woFiltered(){
 return WOS.filter(w=>{
  if(WF.status==='open'&&!['submitted','assigned','progress','hold'].includes(w.status))return false;
  /* "Breached" in the filter is the same word the stat card and the panel use,
     so it asks the same function they ask rather than re-deriving it here. */
  if(WF.status==='breach'&&!(isOpenWO(w)&&isBreached(w)))return false;
  /* "Urgent" in the filter means anything the office must reach sooner than
     routine, which is now two words rather than one. */
  if(WF.status==='urgent'&&!(['emergency','urgent'].includes(priOK(w.pri))&&['submitted','assigned','progress','hold'].includes(w.status)))return false;
  if(WF.cat!=='all'&&w.cat!==WF.cat)return false;
  if(WF.q){const q=WF.q.toLowerCase();
   if(!(w.id.toLowerCase().includes(q)||String(w.unit).includes(q)||w.desc.toLowerCase().includes(q)))return false;}
  return true;
 });
}
/* Any change of filter returns to the first page. Staying on page two of a
   list that has just become one page long shows an empty table under a filter
   that matches things, which reads as "nothing found" and is a lie. */
function setWF(k,v){WF[k]=v;WF.page=0;render();}
function setWOPage(n){
  const rows = woFiltered();
  const last = Math.max(0, Math.ceil(rows.length / WO_PAGE) - 1);
  WF.page = Math.min(Math.max(0, n), last);
  render();
  try{ const t = document.querySelector('#page .tw'); if(t) t.scrollIntoView({block:'start'}); }catch(e){}
}

/* The foot of the list: what is on screen, out of what, and how to reach the
   rest. It used to be the first two of those three. */
function woPager(total){
  const pages = Math.max(1, Math.ceil(total / WO_PAGE));
  const from  = WF.page * WO_PAGE + 1;
  const to    = Math.min(total, (WF.page + 1) * WO_PAGE);
  const btn = (n, label, on) => on
    ? `<button class="tbtn" onclick="setWOPage(${n})">${label}</button>`
    : `<button class="tbtn" disabled aria-disabled="true">${label}</button>`;
  return `<div class="note" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <span>${T('pg_range').replace('{a}', NUM(from)).replace('{b}', NUM(to))
                         .replace('{n}', NUM(total))}</span>
    ${pages > 1 ? `<span style="flex:1"></span>
    ${btn(WF.page - 1, T('pg_prev'), WF.page > 0)}
    <span>${T('pg_of').replace('{a}', NUM(WF.page + 1)).replace('{b}', NUM(pages))}</span>
    ${btn(WF.page + 1, T('pg_next'), WF.page < pages - 1)}` : ''}
  </div>`;
}

async function closeWO(id){
  if(!writeGate()) return;
 const lab=$('cLab').value, mat=$('cMat').value;
 if(lab===''||mat===''){toast(T('t_needcost'));return;}
 const note=$('cNote')?$('cNote').value:'';
 const w=WOS.find(x=>x.id===id); if(!w) return;
 const key='wo:'+id; if(PENDING.has(key)) return;
 /* The clock stops here. Until 14 September this function set status and cost
    and nothing else: closeH stayed 0 and breached stayed false, so a job closed
    a week past target read as met, and the average close time counted it as
    instantaneous — right up until a reload from the database, which derives
    both correctly and so quietly disagreed with what the office had just been
    shown. The close time travels with the record so the other console and the
    database stamp the same moment rather than each reading its own now. */
 const at = new Date();
 const labH=parseFloat(lab)||0, matN=parseFloat(mat)||0;
 saving(key, true);
 LINK_wo(id,{status:'done', labH:labH, mat:matN, note:note,
             closedAt: at.toISOString()});
 const ok = await settledOK();
 saving(key, false);
 if(!ok){ toast(notSaved('wo_not_saved')); return; }
 markClosed(w, at);
 w.status='done'; w.labH=labH; w.mat=matN;
 w.note=note;
 recompute();
 closeDrawer(); render(); toast(T('t_closed'));
}

/* record an instalment as received; the resident's schedule flips to Paid */
async function recordPayment(unit, q){
  if(!writeGate()) return;
 const u = UNITS.find(x=>x.u===unit); if(!u) return;
 const row = (u.inst||[]).find(x=>x.q===q); if(!row || row.paid) return;
 const key = 'pay:' + unit + ':' + q; if(PENDING.has(key)) return;
 const d = new Date();
 const ref = 'RCT-'+String(d.getFullYear()).slice(2)+'-'+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
 /* CON-02. The row is NOT touched here. It flips only when the database says
    the instalment is paid; until then the drawer shows the instalment as it
    is, with its button greyed. */
 saving(key, true);
 LINK.commit(s=>{
   s.pay[unit] = s.pay[unit] || {paid:{}};
   s.pay[unit].paid[q] = {ref, on:d.toISOString()};
 }, 'console');
 const ok = await settledOK();
 saving(key, false);
 if(!ok){ render(); toast(notSaved('pay_not_recorded')); return; }
 row.paid = true; row.paidOn = d; row.ref = ref;
 recompute(); closeDrawer(); render();
 const early = row.due && row.due > TODAY;
 toast(early
  ? L('Advance payment recorded — receipt '+ref+' is now on the resident\'s schedule.',
      'تم تسجيل دفعة مقدّمة — الإيصال '+ref+' ظاهر الآن في جدول الساكن.')
  : L('Payment recorded — receipt '+ref+' is now on the resident\'s schedule.',
      'تم تسجيل الدفعة — الإيصال '+ref+' ظاهر الآن في جدول الساكن.'));
}

async function resEmailSave(unit){
  if(!writeGate()) return;
  const u = UNITS.find(x => x.u === unit); if(!u || !u.residentId) return;
  /* Stored as the app will compare it: trimmed and lower-case. The unique
     index is on lower(email) and link_resident() lowers both sides, so a
     capital letter typed here can never make an address that will not match. */
  const mail = String(($('resMail') && $('resMail').value) || '').trim().toLowerCase();
  const say = k => { const o = $('resOut'); if(o) o.innerHTML = `<div class="warnbox" style="margin-bottom:12px">${I('alert',16,2.2)}<span>${esc(T(k))}</span></div>`; };
  if(!resEmailOK(mail)){ say('res_bad'); return; }
  const key = 'resmail:' + u.residentId; if(PENDING.has(key)) return;
  saving(key, true);
  let ok = false, dup = false;
  try{
    const rows = await SB.upd('residents', 'id=eq.' + encodeURIComponent(u.residentId), {email: mail});
    ok = Array.isArray(rows) && rows.length === 1;
  }catch(e){
    dup = !!(e && (e.status === 409 || /23505|duplicate|unique/i.test(String((e.body && (e.body.code || e.body.message)) || e.message || ''))));
  }
  saving(key, false);
  if(!ok){ say(dup ? 'res_dup' : 'res_fail'); return; }
  u.email = mail; u.account = 'pending';
  recompute(); closeDrawer(); render();
  toast(T('res_ok').replace('{u}', u.u));
}

let COSTVIEW='chart';

/* ==========================================================================
   REPORT LIBRARY

   Every report is a function returning one shape — columns, rows, totals and
   a note — so the renderer, the CSV export and the print view are written
   once and each report only has to describe its own data.

   Each carries a readiness state, and it is honest rather than decorative:

     ready    the data exists today, the report produces real output
     filling  the report works, but is only as complete as the log so far
     blocked  a module that does not exist yet has to be built first

   A report that cannot be produced says what is missing instead of showing
   an empty table that looks like a system failure.
   ========================================================================== */

let RP = {id:null, period:'y12', unit:null};

const rpPeriods = () => [
  {k:'m',    en:'This month',        ar:'هذا الشهر'},
  {k:'q',    en:'Last three months', ar:'آخر ثلاثة أشهر'},
  {k:'y12',  en:'Last twelve months',ar:'آخر اثني عشر شهراً'},
  {k:'all',  en:'Everything',        ar:'الكل'}
];
function rpRange(){
  const to = new Date(TODAY);
  let from = new Date(TODAY);
  if(RP.period==='m')   from.setDate(1);
  if(RP.period==='q')   from = addMonthsClamped(from, -3);
  if(RP.period==='y12') from = addMonthsClamped(from, -12);
  if(RP.period==='all') from.setFullYear(2000);
  from.setHours(0,0,0,0);
  return {from, to};
}
const rpIn = (d, r) => d && d >= r.from && d <= r.to;
const days = (a,b) => Math.round((a-b)/864e5);
const m2 = u => (u.area && u.rent) ? u.rent/u.area : null;

/* F-02. Former tenants owing: what is still unpaid on terms that have closed.
   Collections arrears reads the active register and so, by construction, can
   never show this — a debt on a closed term is not an arrear of any current
   tenancy. It is still money. Each row is one instalment on one closed term,
   named by its own id, and the action settles THAT row: never the flat, never
   the next tenant's balance. */
function repOwing(){
  const rows = OWING.slice().sort((a,b) => (a.due && b.due ? a.due - b.due : 0) || a.id - b.id).map(x => ({
    unit:x.unit, tenant:L(x.tenant, x.tenant_ar),
    term: (x.start ? fmtDay(x.start) : '—') + ' → ' + (x.end ? fmtDay(x.end) : '—'),
    closed: x.status === 'superseded' ? T('ow_superseded') : T('ow_ended'),
    seq:x.seq, due:x.due, amount:x.amt,
    age: x.due ? Math.max(0, Math.floor((TODAY - x.due) / 864e5)) : null,
    act: x.id
  }));
  const total = rows.reduce((a,r) => a + r.amount, 0);
  const flats = new Set(rows.map(r => r.unit)).size;
  const oldest = rows.reduce((m,r) => r.age !== null && r.age > m ? r.age : m, 0);
  return {
    stats:[[T('ow_total'), money(total), NUM(rows.length)+' '+L('instalments','دفعات')+' · '+NUM(flats)+' '+L('apartments','شقق')],
           [T('ow_oldest'), rows.length ? NUM(oldest)+' '+T('days') : '—', T('ow_oldest_d')],
           [T('ow_where'), T('ow_where_v'), T('ow_where_d')]],
    cols:[{k:'unit',l:T('unit')},{k:'tenant',l:T('tenant')},{k:'term',l:T('f_term')},{k:'closed',l:T('ow_closed')},
          {k:'seq',l:T('f_instal'),num:1},{k:'due',l:T('f_arr_due'),date:1},{k:'amount',l:T('f_amount'),num:1,money:1},
          {k:'age',l:T('f_arr_age'),num:1},{k:'act',l:'',act:'owingSettle'}],
    rows,
    foot:{unit:T('rp_total'), amount:total},
    note:T('rp_owing_n')
  };
}

/* F-02. Record money received against ONE instalment of a closed term. This
   does not go through the active register's payment writer, which keys on
   unit → active lease → seq and rightly refuses a flat with no active lease;
   it names the row by its id and asks the database to settle exactly that row
   if it is still unpaid. A date and a reference are required — DATA-07: a
   paid date is a record, never a guess. */

        <dt>${T('f_term')}</dt><dd>${r.start ? fmtDay(r.start) : '—'} → ${r.end ? fmtDay(r.end) : '—'} · ${r.status === 'superseded' ? T('ow_superseded') : T('ow_ended')}</dd>
        <dt>${T('f_arr_due')}</dt><dd class="mono">${r.due ? fmtDay(r.due) : '—'}</dd>

          <input class="inp" id="owOn" type="date" value="${isoLocal(TODAY)}" max="${isoLocal(TODAY)}"></div>
        <div class="fgroup"><label class="f" for="owRef">${T('ow_ref')}</label>

    </div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" data-id="${Number(r.id)}" onclick="owingSettleConfirm(Number(this.dataset.id))">${I('check',16,2.2)} ${T('ow_record')}</button>
      <button class="btn" onclick="closeDrawer()">${T('rc_cancel')}</button>

async function owingSettleConfirm(id){
  if(!writeGate()) return;
  const r = OWING.find(x => x.id === Number(id)); if(!r){ toast(T('ow_gone')); return; }
  const on  = ($('owOn')  && $('owOn').value)  || '';
  const ref = (($('owRef') && $('owRef').value) || '').trim();
  if(!on || !ref){ toast(T('ow_need')); return; }
  const key = 'owing:' + r.id; if(PENDING.has(key)) return;
  saving(key, true);
  let ok = false;
  try{
    /* id AND still unpaid: a second press, or another screen that got there
       first, changes nothing and is told so. */
    const rows = await SB.upd('instalments', 'id=eq.' + Number(r.id) + '&paid=eq.false',
                              {paid:true, paid_on:on, receipt_ref:ref});
    ok = Array.isArray(rows) && rows.length === 1;
  }catch(e){ ok = false; }
  saving(key, false);
  if(!ok){ toast(T('ow_fail')); return; }
  const i = OWING.findIndex(x => x.id === r.id); if(i > -1) OWING.splice(i, 1);
  closeDrawer(); render();
  toast(T('ow_done').replace('{u}', r.unit).replace('{m}', money(r.amt) + ' ' + T('sar')).replace('{r}', ref));
}

/* twelve months of instalments, so the office can see what is due before it is due */
function repForecast(){
  const buckets = [];
  const start = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  for(let i=0;i<12;i++){
    const d = addMonthsClamped(start, i);
    buckets.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), d, due:0, paid:0, n:0, units:new Set()});
  }
  let overdue = 0, overdueN = 0;
  UNITS.forEach(u=>{
    if(!u.occupied) return;
    u.inst.forEach(x=>{
      if(!x.due) return;
      if(x.billed && !x.paid){ overdue += x.amt; overdueN++; return; }
      const k = x.due.getFullYear()+'-'+String(x.due.getMonth()+1).padStart(2,'0');
      const b = buckets.find(y=>y.key===k);
      if(!b) return;
      b.due += x.amt; b.n++; b.units.add(u.u);
      if(x.paid) b.paid += x.amt;
    });
  });
  const rows = buckets.map(b=>({
    month: b.d, n:b.n, units:b.units.size, due:b.due, paid:b.paid, expect:b.due-b.paid
  }));
  return {
    stats:[[T('rp_overdue_now'), money(overdue), NUM(overdueN)+' '+L('instalments','دفعات')],
           [T('rp_next90'), money(rows.slice(0,3).reduce((a,r)=>a+r.expect,0)), T('rp_next90_d')],
           [T('rp_next12'), money(rows.reduce((a,r)=>a+r.expect,0)), T('rp_next12_d')]],
    cols:[{k:'month',l:T('rp_month'),month:1},{k:'units',l:T('rp_units'),num:1},
          {k:'n',l:T('rp_instal'),num:1},{k:'due',l:T('rp_falls'),num:1,money:1},
          {k:'paid',l:T('rp_already'),num:1,money:1},{k:'expect',l:T('rp_expected'),num:1,money:1}],
    rows,
    foot:{month:T('rp_total'), n:rows.reduce((a,r)=>a+r.n,0),
          due:rows.reduce((a,r)=>a+r.due,0), paid:rows.reduce((a,r)=>a+r.paid,0),
          expect:rows.reduce((a,r)=>a+r.expect,0)},
    note:T('rp_forecast_n')
  };
}

function repOccupancy(){
  /* DATA-03. This report counted every row in the register — 39 — while the
     dashboard counted against a hardcoded 37 and the note under this very table
     said "measured against all 37 apartments". Three numbers, two screens, one
     register. A flat that cannot be let is not vacant; it is not on the market
     at all, and counting it as vacant understates occupancy for ever. Both
     screens now count the same lettable rows, and the flats left out are named
     underneath rather than quietly dropped. */
  const LET = UNITS.filter(u=>u.lettable);
  const OUT = UNITS.filter(u=>!u.lettable);
  const byType = {};
  LET.forEach(u=>{
    const k = u.type||'—';
    byType[k] = byType[k] || {k, total:0, let:0, area:0, rent:0, vacantValue:0};
    const b = byType[k];
    b.total++; b.area += u.area||0;
    if(u.occupied){ b.let++; b.rent += u.rent||0; } else { b.vacantValue += u.rent||0; }
  });
  const rows = Object.values(byType).sort((a,b)=>a.k.localeCompare(b.k)).map(b=>({
    type:b.k, total:b.total, let:b.let, vacant:b.total-b.let,
    pct: Math.round(b.let/b.total*100), area:Math.round(b.area/b.total),
    rent:b.rent, avg: b.let? Math.round(b.rent/b.let) : null
  }));
  const letAll = LET.filter(u=>u.occupied).length;
  const vacant = LET.filter(u=>!u.occupied);
  return {
    stats:[[T('st_occ'), LET.length ? NUM(letAll)+'/'+NUM(LET.length) : '\u2014',
            LET.length ? NUM(Math.round(letAll/LET.length*100))+'%' : T('st_occ_none')],
           [T('rp_vacant_n'), NUM(vacant.length), T('rp_vacant_d')],
           [T('f_contracted'), money(FIN.contracted), T('rp_letonly')]],
    cols:[{k:'type',l:T('type')},{k:'total',l:T('rp_apartments'),num:1},{k:'let',l:L('Let','مؤجرة'),num:1},
          {k:'vacant',l:T('vacant'),num:1},{k:'pct',l:T('st_occ'),num:1,pct:1},
          {k:'area',l:T('rp_avgarea'),num:1},{k:'rent',l:T('f_contracted'),num:1,money:1},
          {k:'avg',l:T('rp_avgrent'),num:1,money:1}],
    rows,
    foot:{type:T('rp_total'), total:LET.length, let:letAll, vacant:vacant.length,
          pct:LET.length ? Math.round(letAll/LET.length*100) : 0, rent:FIN.contracted},
    extra:{title:T('rp_vacantlist'), cols:[{k:'unit',l:T('unit')},{k:'type',l:T('type')},
      {k:'area',l:T('area'),num:1},{k:'floor',l:T('floor')},{k:'value',l:T('rp_lastvalue'),num:1,money:1}],
      rows: vacant.sort((a,b)=>a.u.localeCompare(b.u,'en',{numeric:true})).map(u=>({
        unit:u.u, type:u.type, area:u.area, floor:floorName(u.floor), value:u.rent||null}))},
    /* The note states the basis and, where the register holds rows that are not
       lettable, names them and says where that classification came from. The
       source column on those rows currently reads that it is a deduction from
       the head lease and asks for confirmation from the office — which is a
       fact about the data and belongs on the page, not in a column nobody
       sees. */
    note: T('rp_occ_n').replace('{n}', NUM(LET.length)) + (OUT.length ? ' ' +
      T('rp_occ_out').replace('{n}', NUM(OUT.length))
                     .replace('{ids}', OUT.map(u=>u.u).join('، ').replace(/، /g, LANG==='ar'?'، ':', '))
      + (OUT[0] && OUT[0].lettableSource ? ' ' + OUT[0].lettableSource : '') : '')
  };
}

      avg: rates.reduce((a,x)=>a+x,0)/rates.length,
      min: rates[0], minU: lo.u.u, max: rates[rates.length-1], maxU: hi.u.u,
      spread: rates[rates.length-1]-rates[0]};
  });
  return {
    cols:[{k:'type',l:T('type')},{k:'n',l:T('rp_apartments'),num:1},{k:'avgArea',l:T('rp_avgarea'),num:1},
          {k:'avg',l:T('rp_avgm2'),num:1,dec:1},{k:'min',l:T('rp_lowest'),num:1,dec:1},

  };
}

/* the data-quality note, run live against whatever register is loaded */
function repQuality(){
  const rows=[];
  const add=(u,sev,t)=>rows.push({unit:u||'—', severity:sev, finding:t});
  UNITS.forEach(u=>{
    const lines=(u.inst||[]).reduce((a,x)=>a+x.amt,0);
    if(u.occupied && u.inst.length && u.rent && Math.abs(lines-u.rent)>1)
      add(u.u, T('rp_sev_med'), T('rp_q_lines').replace('{a}',money(lines)).replace('{b}',money(u.rent)));
    if(!u.occupied && u.rent) add(u.u, T('rp_sev_med'), T('rp_q_vacantvalue'));
    if(u.occupied && !u.inst.length) add(u.u, T('rp_sev_high'), T('rp_q_nosched'));
    if(u.occupied && u.leaseEnd) (u.inst||[]).forEach(x=>{
      if(x.due && x.due > u.leaseEnd)
        add(u.u, T('rp_sev_high'), T('rp_q_pastend').replace('{d}',fmtD(x.due)).replace('{e}',fmtD(u.leaseEnd)));
    });
    if(u.occupied && u.leaseEnd && u.leaseEnd < TODAY)
      add(u.u, T('rp_sev_high'), T('rp_q_expired').replace('{d}',fmtD(u.leaseEnd)));
    if(u.area && u.type==='2BR' && u.area<60) add(u.u, T('rp_sev_low'), T('rp_q_area').replace('{a}',NUM(u.area)).replace('{t}',u.type));
    if(u.area && u.type==='3BR' && u.area<90) add(u.u, T('rp_sev_low'), T('rp_q_area').replace('{a}',NUM(u.area)).replace('{t}',u.type));
    if(u.occupied && !u.rent) add(u.u, T('rp_sev_high'), T('rp_q_novalue'));
  });
  rows.sort((a,b)=>a.unit.localeCompare(b.unit,'en',{numeric:true}));
  const sev = s => rows.filter(r=>r.severity===s).length;
  return {
    stats:[[T('rp_findings'), NUM(rows.length), T('rp_q_d')],
           [T('rp_sev_high'), NUM(sev(T('rp_sev_high'))), T('rp_q_high_d')],
           [T('rp_apartments'), NUM(new Set(rows.map(r=>r.unit)).size), T('rp_q_units_d')]],
    cols:[{k:'unit',l:T('unit')},{k:'severity',l:T('rp_severity')},{k:'finding',l:T('rp_finding')}],
    rows,
    note:T('rp_q_n')
  };
}

function repSla(){
  const jobs = rpJobsIn().filter(w=>!w.noSla && w.status!=='cancelled');
  const rows = CATS.map(c=>{
    const mine = jobs.filter(w=>w.cat===c.id);
    if(!mine.length) return null;
    const met = mine.filter(w=>!isBreached(w)).length;
    return {service:catName(c), target:c.sla, jobs:mine.length, met,
            missed:mine.length-met, pct:Math.round(met/mine.length*100)};
  }).filter(Boolean).sort((a,b)=>a.pct-b.pct);
  const all = jobs.length, met = jobs.filter(w=>!isBreached(w)).length;
  const excluded = rpJobsIn().filter(w=>w.noSla).length;
  /* APP-12. When there is nothing to show, WHY there is nothing matters. The
     generic "no maintenance has been recorded yet" is false when maintenance
     HAS been recorded and simply carries no report time — every job so far
     entered from an invoice. Saying "recorded nothing" under a stat panel that
     reads "Not measurable: 100" is a contradiction the operator has to resolve
     for themselves. So the report states its own empty case. */
  const emptyT = (all===0 && excluded>0) ? T('rp_sla_none_t') : T('nolog_t');
  const emptyD = (all===0 && excluded>0)
    ? T('rp_sla_none_d').replace('{n}', NUM(excluded)) : T('rp_fills');
  return {
    period:true, filling:true, emptyT, emptyD,
    stats:[[T('st_sla'), all?NUM(Math.round(met/all*100))+'%':'—', NUM(all)+' '+T('rp_measurable')],
           [T('rp_missed'), NUM(all-met), T('rp_missed_d')],

    foot:{service:T('rp_total'), jobs:all, met, missed:all-met, pct:all?Math.round(met/all*100):null},
    note:T('rp_sla_n')
  };
}

function repRecurring(){
  /* DATA-06. A repeat fault is a fact about an APARTMENT: the same trade called
     back to the same flat. Work with no flat against it is not that — it is
     communal, or it is unallocated, and the two are different things from each
     other as well. Grouping it by the placeholder that stood in for "no flat"
     manufactured nine repeating faults in an apartment that does not exist.

     So the metric is computed over allocated work only, and the work left out
     is stated rather than hidden: how many jobs, how much money, and what share
     of the total that is. A report that quietly excludes three quarters of the
     spend is worse than one that includes it wrongly. */
  const all  = WOS.filter(w=>w.status!=='cancelled');
  const done = all.filter(w=>w.unit);
  const loose = all.filter(w=>!w.unit);
  const looseCost = loose.reduce((a,w)=>a+(w.status==='done'?woCost(w):0),0);
  const allCost   = all.reduce((a,w)=>a+(w.status==='done'?woCost(w):0),0);
  const by = {};
  done.forEach(w=>{ const k=w.unit+'|'+w.cat; by[k]=by[k]||{unit:w.unit,cat:w.cat,n:0,c:0,last:null};
    by[k].n++; by[k].c+=w.status==='done'?woCost(w):0;
    if(!by[k].last || w.raised>by[k].last) by[k].last=w.raised; });
  const rows = Object.values(by).filter(x=>x.n>1).sort((a,b)=>b.n-a.n||b.c-a.c).map(x=>({
    unit:x.unit, service:catName(CAT(x.cat)), times:x.n, cost:x.c, last:x.last
  }));
  return {
    filling:true,
    stats:[[T('rp_repeat'), NUM(rows.length), T('rp_repeat_d')],
           [T('h_maint'), money(rows.reduce((a,r)=>a+r.cost,0)), T('rp_onrepeat')],
           [T('rp_apartments'), NUM(new Set(rows.map(r=>r.unit)).size), T('rp_affected')],
           [T('rp_unalloc'), NUM(loose.length),
            T('rp_unalloc_d').replace('{m}', money(looseCost))
              .replace('{p}', allCost ? NUM(Math.round(looseCost/allCost*100)) + '%' : T('f_none'))]],
    cols:[{k:'unit',l:T('unit')},{k:'service',l:T('log_cat')},{k:'times',l:T('rp_times'),num:1},
          {k:'cost',l:T('cost'),num:1,money:1},{k:'last',l:T('rp_lastseen'),date:1}],
    rows,
    foot:{unit:T('rp_total'), cost:rows.reduce((a,r)=>a+r.cost,0)},
    note:T('rp_recur_n') + ' ' + T('rp_recur_scope')
           .replace('{n}', NUM(loose.length)).replace('{m}', money(looseCost))
  };
}

/* ==========================================================================
   EVIDENCE

   Every figure in this console should be traceable to the document it came
   from. This module attaches documents to leases, instalments and jobs,
   fingerprints each one so a later edit or swap is detectable, reads what it
   can out of digital PDFs, and reports on what is still unevidenced.

   Storage is deliberately separated from evidence. Today only the evidence
   record is kept — name, type, size, SHA-256, when and by whom. The file
   itself is not stored, because a browser cannot hold 37 contracts. When the
   Supabase bucket exists, DOCSTORE.put() uploads and returns a path, and
   nothing else in this file changes.
   ========================================================================== */

const DOCKINDS = ['contract','receipt','invoice','other'];

const DOCSTORE = {
  mode: 'fingerprint',                 /* becomes 'supabase' once a bucket exists */
  async put(file){ return {mode:'fingerprint', path:null}; }
};

/* SHA-256 where the browser allows it; a weaker rolling fingerprint where it
   does not, labelled as such rather than passed off as the same thing. */
async function docFingerprint(buf){
  try{
    if(crypto && crypto.subtle && crypto.subtle.digest){
      const h = await crypto.subtle.digest('SHA-256', buf);
      return {algo:'SHA-256', hex:[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')};
    }
  }catch(e){}
  const u = new Uint8Array(buf);
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for(let i=0;i<u.length;i++){
    h1 = ((h1 ^ u[i]) * 16777619) >>> 0;
    h2 = ((h2 + u[i]) * 31 + i) >>> 0;
  }
  return {algo:'weak', hex:(h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0'))};
}

/* ------------------------------ PDF text ------------------------------ */
/* Digital PDFs carry a text layer. Scans do not — they carry an image, and
   nothing in a browser can read those, so we say so rather than guess. */
async function pdfText(buf){
  const u = new Uint8Array(buf);
  const head = new TextDecoder('latin1').decode(u.subarray(0, 8));
  if(!head.startsWith('%PDF')) return {ok:false, why:'not_pdf', text:''};
  const raw = new TextDecoder('latin1').decode(u);
  let text = '';
  const re = /stream\r?\n?/g;
  let m;
  while((m = re.exec(raw))){
    if(raw.substr(m.index-3,3) === 'end') continue;      /* this is an endstream */
    const dictStart = raw.lastIndexOf('<<', m.index);
    const dict = dictStart >= 0 ? raw.slice(dictStart, m.index) : '';
    const end = raw.indexOf('endstream', m.index);
    if(end < 0) continue;
    const start = m.index + m[0].length;
    /* the dictionary states the exact length; without it, trim the newline the
       writer puts before endstream. A single trailing byte makes the inflater
       reject the whole stream. */
    const lenM = /\/Length\s+(\d+)/.exec(dict);
    let stop = lenM ? Math.min(start + Number(lenM[1]), end) : end;
    while(!lenM && stop > start && (u[stop-1]===10 || u[stop-1]===13)) stop--;
    let bytes = u.subarray(start, stop);
    if(/FlateDecode/.test(dict)){
      try{
        const s = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));
        bytes = new Uint8Array(await new Response(s).arrayBuffer());
      }catch(e){ continue; }
    } else if(/DCTDecode|JPXDecode|CCITTFaxDecode|JBIG2Decode/.test(dict)){
      continue;                                  /* an image — a scanned page */
    }
    const page = new TextDecoder('latin1').decode(bytes);
    /* text-showing operators */
    page.replace(/\((?:\\.|[^\\()])*\)\s*Tj/g, s => { text += pdfLit(s) + ' '; return s; });
    page.replace(/\[((?:[^\[\]]|\\.)*)\]\s*TJ/g, (s,inner) => {
      inner.replace(/\((?:\\.|[^\\()])*\)/g, t => { text += pdfLit(t); return t; });
      text += ' '; return s;
    });
    page.replace(/<([0-9A-Fa-f\s]+)>\s*Tj/g, (s,hex) => { text += pdfHex(hex) + ' '; return s; });
    if(text.length > 400000) break;
  }
  text = text.replace(/\s+/g,' ').trim();
  return {ok: text.length > 20, why: text.length > 20 ? null : 'no_text_layer', text};
}
const pdfLit = s => s.replace(/^\(|\)\s*Tj$|\)$/g,'')
  .replace(/\\([nrtbf()\\])/g, (m,c)=>({n:'\n',r:'',t:' ',b:'',f:''}[c] ?? c))
  .replace(/\\([0-7]{1,3})/g, (m,o)=>String.fromCharCode(parseInt(o,8)));
const pdfHex = h => {
  const s = h.replace(/\s/g,'');
  let out = '';
  for(let i=0;i+3<s.length;i+=4){
    const c = parseInt(s.substr(i,4),16);
    if(c >= 32) out += String.fromCharCode(c);
  }
  if(!out) for(let i=0;i+1<s.length;i+=2){
    const c = parseInt(s.substr(i,2),16);
    if(c >= 32) out += String.fromCharCode(c);
  }
  return out;
};

/* ------------------------- candidates from text ------------------------- */
/* Proposals only. Nothing reaches the register until a person confirms it. */
function docCandidates(text){
  const out = {dates:[], amounts:[], contractNo:null};
  const seen = new Set();

  const push = (y,mo,d) => {
    if(y<2000||y>2100||mo<1||mo>12||d<1||d>31) return;
    const iso = `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    if(!seen.has(iso)){ seen.add(iso); out.dates.push(iso); }
  };
  (text.match(/\b(\d{4})[-/](\d{1,2})[-/](\d{1,2})\b/g)||[]).forEach(s=>{
    const p=s.split(/[-/]/); push(+p[0],+p[1],+p[2]);
  });
  (text.match(/\b(\d{1,2})[-/](\d{1,2})[-/](\d{4})\b/g)||[]).forEach(s=>{
    const p=s.split(/[-/]/); push(+p[2],+p[1],+p[0]);
  });
  out.dates.sort();

  /* amounts: keep anything that reads like money and is plausible as rent */
  const amt = new Set();
  (text.match(/\b\d{1,3}(?:,\d{3})+(?:\.\d{1,2})?\b/g)||[]).forEach(s=>amt.add(Number(s.replace(/,/g,''))));
  (text.match(/\b\d{4,7}(?:\.\d{1,2})?\b/g)||[]).forEach(s=>{
    const n=Number(s);
    /* a bare 10-digit run is an identity number, not money — never captured.
       A bare four digits in the 1900–2100 range is a year, not a rent. */
    if(s.replace('.','').length<=7 && n>=1000 && n<=5000000 && !(n>=1900 && n<=2100)) amt.add(n);
  });
  out.amounts = [...amt].filter(n=>n>=1000).sort((a,b)=>b-a).slice(0,12);

  const cn = text.match(/\b\d{10,14}\b/);
  out.contractNo = cn ? cn[0] : null;
  /* a national ID is a 10-digit number starting 1 or 2 — deliberately dropped */
  if(out.contractNo && /^[12]\d{9}$/.test(out.contractNo)) out.contractNo = null;
  return out;
}

/* ------------------------------ the store ------------------------------ */
/* F-01. A contract is keyed by its LEASE and a receipt by its INSTALMENT —
   the same keys the database now writes into ref_key from the row's binding.
   These were 'u:<flat>' and 'i:<flat>:<seq>': a renewal restarts the numbering
   and keeps the flat, so the old term's receipt was evidence for the new one,
   and a document followed the flat to its next tenant. A ref with no lease or
   no instalment id has no key: nothing matches it and nothing attaches to it. */
const docKey = r => r.type==='unit' ? (r.lease ? 'lease:'+r.lease : null)
                  : r.type==='inst' ? (r.id ? 'inst:'+r.id : null)
                  : 'w:'+r.wo;
const docsFor = r => { const k = docKey(r); return k ? (LINK.get().docs||[]).filter(d=>d.key===k) : []; };
const docCount = r => docsFor(r).length;

/* DOC-01. One builder, used by every upload, so the two paths cannot drift.
   `crypto.randomUUID` is present in every browser this console supports; the
   fallback is there because a page that cannot name a file is a page that
   cannot accept one, and failing to attach a lease is worse than a key that is
   merely very unlikely to repeat. */
function objectKey(file, prefix){
  const stamp = new Date().toISOString().replace(/[-:T.]/g,'').slice(0,14);
  const safe  = String(file.name || 'file').replace(/[^\w.\-]+/g,'_').slice(-60);
  let rnd;
  try{ rnd = crypto.randomUUID().replace(/-/g,'').slice(0,12); }
  catch(e){ rnd = Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
  return (prefix || '') + stamp + '-' + rnd + '-' + safe;
}

/* What a document may be. An upload that the office cannot open later is not
   evidence of anything, and an unbounded one is a way to fill a bucket. */
const DOC_MAX_BYTES = 15 * 1024 * 1024;
const DOC_TYPES = /^(application\/pdf|image\/(png|jpe?g|webp|heic|heif)|application\/msword|application\/vnd\.openxmlformats-officedocument\.)/i;

async function docAttach(file, ref, kind){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. It returned undefined, and
     the caller destructures — so what the viewer actually saw was the toast
     followed by "Cannot destructure property 'rec' of undefined" in a warning
     box. null is a refusal the caller can read. */
  if(!writeGate()) return null;
  /* DOC-01. Bounded before anything leaves the machine. */
  if(!file || !file.size) return {error:'empty'};
  if(file.size > DOC_MAX_BYTES) return {error:'too_big', max:DOC_MAX_BYTES, size:file.size};
  if(file.type && !DOC_TYPES.test(file.type)) return {error:'wrong_type', mime:file.type};
  const buf = await file.arrayBuffer();
  const fp  = await docFingerprint(buf);
  const put = await DOCSTORE.put(file);
  let read = {ok:false, why:'not_pdf', text:''};
  if(/pdf/i.test(file.type) || /\.pdf$/i.test(file.name)){
    try{ read = await pdfText(buf); }catch(e){ read = {ok:false, why:'unreadable', text:''}; }
  }
  const key = docKey(ref);
  if(!key) return {error:'unbound'};
  const rec = {
    id: 'D-' + fp.hex.slice(0,12),
    key, ref, kind,
    /* F-01. What the document is evidence OF, as the database will record it. */
    lease_id: ref.type==='unit' ? ref.lease : ref.type==='inst' ? (ref.lease || null) : null,
    instalment_id: ref.type==='inst' ? ref.id : null,
    name: file.name, mime: file.type||'', size: file.size,
    algo: fp.algo, hash: fp.hex,
    /* The account that is signed in, not a label from the interface. */
    at: new Date().toISOString(), by: (SB.email() || ''),
    readable: read.ok, why: read.why,
    storage: put.mode, path: put.path
  };
  const dup = (LINK.get().docs||[]).find(d=>d.hash===rec.hash);
  LINK.commit(s=>{
    s.docs = s.docs || [];
    if(!s.docs.some(d=>d.id===rec.id && d.key===rec.key)) s.docs.push(rec);
  }, 'console');

  /* DOC-01. An attachment is two stages — the file, then the record of it —
     and this used to report success after the first. A metadata write the
     database refused left the object in the bucket with nothing pointing at it
     and the operator told the document was attached. They would find out when
     somebody went looking for a lease that was not there.

     So the second stage is waited for, and a failure says which object is now
     orphaned rather than swallowing it. Nothing here deletes it: this console
     does not delete, and a path written into the warning is a path somebody can
     reconcile. */
  let landed = null;
  try{ landed = await LINK.settled(); }catch(e){ landed = {failed:1}; }
  if(landed && (landed.failed || landed.held)){
    LINK.commit(s=>{ s.docs = (s.docs||[]).filter(d=>!(d.id===rec.id && d.key===rec.key)); },
                'console');
    return {error:'metadata', path: put.path, name: file.name};
  }
  return {rec, read, dup: dup && dup.key!==rec.key ? dup : null};
}

function docRemove(id, key){
  if(!writeGate()) return;
  LINK.commit(s=>{ s.docs = (s.docs||[]).filter(d=>!(d.id===id && d.key===key)); }, 'console');
  recompute(); render();
}

   on a lease reference was how a document could be attached with nothing to
   bind it to — and now the database refuses the row, so the form does first. */
const DOC_KINDS_FOR = r => r.type==='unit' ? ['contract','other'] : r.type==='inst' ? ['receipt','other'] : ['invoice','other'];
async function docOpen(ref, kind){
  if(ref.type==='unit' && !ref.lease){ toast(T('doc_no_lease')); return; }

     back. Ask the database for it now rather than key the receipt to a guess. */
  if(ref.type==='inst' && !ref.id){
    let rows = null;
    try{ rows = ref.lease ? await SB.sel('instalments', 'select=id&lease_id=eq.' + encodeURIComponent(ref.lease) + '&seq=eq.' + Number(ref.inst) + '&limit=1') : null; }catch(e){ rows = null; }

      </select>
      <label class="f" for="dFile">${T('doc_file')}</label>

        accept=".pdf,.jpg,.jpeg,.png,.heic,.webp">

    </div></div>
    <div id="dOut"></div>
    ${list.length?`<div class="sect">${T('doc_onfile')} (${NUM(list.length)})</div>
     <div class="card"><div class="tw"><table>
      <thead><tr><th>${T('doc_kind')}</th><th>${T('doc_file')}</th><th class="num">${T('doc_size')}</th><th>${T('doc_added')}</th><th>${T('doc_fp')}</th><th></th></tr></thead>
      <tbody>${list.map(d=>`<tr>
        <td>${T('doc_k_'+d.kind)}</td>
        <td><div class="strong" style="word-break:break-all">${esc(d.name)}</div>
            <div class="sub2">${d.readable?T('doc_readable'):T('doc_'+(d.why||'scan'))}</div></td>
        <td class="num mono">${NUM(Math.round(d.size/1024))} KB</td>
        <td class="mono">${fmtISO(d.at.slice(0,10))}</td>
        <td class="mono sub2" title="${d.algo}">${d.hash.slice(0,10)}…</td>
        <td class="num"><button class="tbtn" data-id="${esc(d.id)}" data-key="${esc(d.key)}" onclick="docRemove(this.dataset.id,this.dataset.key)">${T('doc_remove')}</button></td>
      </tr>`).join('')}</tbody>
     </table></div></div>`:''}`);
}

async function docRun(input){
  const file = input.files && input.files[0]; if(!file || !DOCCTX) return;
  $('dBusy').style.display='block'; $('dOut').innerHTML='';
  try{
    const kind = $('dKind').value;
    const out = await docAttach(file, DOCCTX.ref, kind);
    if(!out){ $('dBusy').style.display='none'; return; }   /* refused; writeGate spoke */
    /* DOC-01. A refusal is a sentence, and an attachment that only half
       happened is not reported as an attachment. */
    if(out.error){
      $('dBusy').style.display='none';
      const msg = out.error === 'too_big'
            ? T('doc_e_big').replace('{n}', NUM(Math.round(DOC_MAX_BYTES / 1048576)))
        : out.error === 'wrong_type' ? T('doc_e_type')
        : out.error === 'empty'      ? T('doc_e_empty')
        : out.error === 'unbound'    ? T('doc_no_lease')
        : T('doc_e_meta').replace('{p}', out.path || '');
      $('dOut').innerHTML = `<div class="card"><div class="bd"><div class="warnbox">${I('alert',16,2.2)}<span>${esc(msg)}</span></div></div></div>`;
      return;
    }
    const {rec, read, dup} = out;
    $('dBusy').style.display='none';
    $('dOut').innerHTML = docResultHtml(rec, read, dup);
    labelControls($('dOut'));
    recompute();
  }catch(e){
    $('dBusy').style.display='none';
    $('dOut').innerHTML = `<div class="card"><div class="bd"><div class="warnbox">${I('alert',16,2.2)}<span>${e.message}</span></div></div></div>`;
  }
}
