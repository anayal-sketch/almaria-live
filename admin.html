      send({topic:TOPIC, event:'access_token', ref:String(++ref), payload:{access_token: tok}});
      lastSentToken = tok;
    }
  }

  function connect(){
    if(ws || !watchers.length) return;
    rt = 'joining';
    try{
      ws = new WebSocket(BASE.replace(/^http/,'ws') + '/realtime/v1/websocket?apikey=' +
                         encodeURIComponent(KEY) + '&vsn=1.0.0');
    }catch(e){ ws = null; rt = 'error'; return; }

    ws.onopen = () => {
      joinRef = String(++ref);
      send({topic:TOPIC, event:'phx_join', ref:joinRef, payload:{config:{
        broadcast:{self:false}, presence:{key:''}, private:false,
        postgres_changes: tables.map(t=>({event:'*', schema:'public', table:t}))}}});
      if(sess){ send({topic:TOPIC, event:'access_token', ref:String(++ref),
                      payload:{access_token: sess.access_token}});
                lastSentToken = sess.access_token; }
      hb = setInterval(()=>send({topic:'phoenix', event:'heartbeat', ref:String(++ref), payload:{}}), 25000);
    };
    ws.onmessage = ev => {
      let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      /* SYNC-02. This used to read: any phx_reply with status ok means the link
         is live. A heartbeat reply is a phx_reply with status ok — on topic
         'phoenix', every 25 seconds, for as long as the SOCKET is open. So a
         channel join that was refused set rt='error' and then the next
         heartbeat, a few seconds later, set it straight back to 'live'. The
         badge read live, the socket was open, and no change was ever going to
         arrive because nothing was subscribed to anything.

         Only the reply to THIS join, on THIS topic, says the channel is
         joined. A heartbeat says the socket is up, which is a different fact
         and not the one the badge is reporting. */
      if(m.event === 'phx_reply' && m.ref === joinRef && m.topic === TOPIC &&
         m.payload && m.payload.status === 'ok'){
        rt = 'live'; back = 0;
        /* SYNC-01, the half that is not about overlapping reads. Reconnecting
           the socket did not itself fetch anything, so every change made while
           the connection was down was simply never delivered — the badge went
           back to live over a screen that had stopped listening minutes ago and
           had no idea what it had missed.

           Only on a RE-join. The first join follows the read that start() has
           just done, and catching up on that would read the same rows twice
           every time the page opens. */
        /* CON-06, the other half. "Only on a re-join" left a gap: the read that
           start() did and the join that followed it are two moments, and a
           change that landed between them was delivered to nobody. One extra
           read on first join is cheap; a change nobody saw is not. */
        watchers.forEach(fn => { try{ fn({catchup: joined ? 'rejoin' : 'first'}); }
                                 catch(e){ console.error('SB.watch', e); } });
        joined = true;
      }
      if(m.event === 'phx_reply' && m.ref === joinRef && m.topic === TOPIC &&
         m.payload && m.payload.status !== 'ok') rt = 'error';
      /* CON-06. A channel the server has closed or errored is not going to
         deliver anything. Closing the socket here hands it to onclose, which
         already knows how to back off and reconnect. */
      if((m.event === 'phx_error' || m.event === 'phx_close') && m.topic === TOPIC){
        rt = 'error';
        try{ ws && ws.close(); }catch(e){}
      }
      if(m.event === 'system' && m.payload && m.payload.status === 'error') rt = 'error';
      if(m.event === 'postgres_changes'){
        const d = (m.payload && m.payload.data) || {};
        watchers.forEach(fn=>{ try{ fn(d); }catch(e){ console.error('SB.watch', e); } });
      }
    };
    ws.onerror = () => { rt = 'error'; };
    ws.onclose = () => {
      clearInterval(hb); ws = null; joinRef = null;
      if(rt !== 'off') rt = 'error';
      if(watchers.length){
        back = Math.min(back + 1, 6);
        setTimeout(connect, 1000 * Math.pow(2, back));
      }
    };
  }

  function watch(tbl, fn){
    tables = [...new Set(tables.concat(tbl))];
    watchers.push(fn);
    connect();
  }
  function stopWatching(){ watchers = []; rt = 'off'; joined = false; try{ if(ws) ws.close(); }catch(e){} }

  const API = {
    base: BASE, configured: () => !!(BASE && KEY),
    signIn, signOut, refresh, ready, signedIn, isStaff, email, claims,
    setPassword, adoptRecovery,
    sel, ins, ups, upd, del, rpc, rpcAppend, upload, signedUrl,
    watch, stopWatching, rtState: () => rt
  };
  /* SCALE-01. PostgREST answers with at most `db-max-rows` — 1,000 by default —
     and says nothing about it: a list longer than that comes back truncated and
     looks exactly like a complete one. Every total computed from it is then
     quietly wrong, which is the failure mode this project keeps meeting in
     different clothes.

     A read meant to be COMPLETE therefore asks for pages until a short one
     arrives. An order is required rather than assumed: paging by offset over an
     unordered query returns some rows twice and misses others, and the result
     still looks like a list.

     Defined in terms of the PUBLIC `sel`, deliberately. selAll is sel repeated
     and nothing else, so anything that wraps or replaces the read — a harness,
     a future cache, a retry policy — is inherited rather than bypassed. A
     layer that reaches past its own public surface is how two code paths come
     to disagree, which is most of what this week has been about. */
  /* CON-08. Two things this loop got wrong before 16 September:

       - it stepped by the page size it ASKED for. A server whose max-rows is
         below that answers with fewer rows than requested, and "fewer than
         requested" was read as "that was the last page". With a cap of 100
         and 250 rows present it returned 100 and called it complete.
       - it had no idea how many rows existed, so it could not tell a short
         final page from a capped one.

     It asks for the count now, steps by the rows that actually arrived, and
     stops when the server's own total is reached. A server that will not
     count (Content-Range ends in "*") is not PostgREST, and a short page is
     taken as the end there — see the note in the loop.

     The order must end in a unique key. With equal timestamps at a page
     boundary and no tie-breaker, offset paging is allowed to return a row
     twice and another never; every caller here orders by a timestamp AND by
     id, and this refuses an order that does not name id, seq or a key. */
  API.selAll = async (t, q, pageSize) => {
    const m = /(^|&)order=([^&]*)/.exec(q || '');
    if(!m) throw new Error('selAll(' + t + ') needs an order, or the pages overlap');
    if(!/(^|,)(id|seq|lease_id|contact_id|key)(\.(asc|desc))?(\.nulls(first|last))?$/.test(m[2]))
      throw new Error('selAll(' + t + ') order "' + m[2] + '" does not end in a unique key, so a page boundary can drop or repeat a row');
    const size = pageSize || 1000;
    const out = [];
    for(;;){
      const rows = await API.sel(t, q + '&limit=' + size + '&offset=' + out.length, {count:true});
      if(!Array.isArray(rows)) return rows;
      const total = (rows.total === undefined) ? null : rows.total;
      out.push(...rows);
      if(!rows.length) return out;                          /* nothing more, whatever the count said */
      if(total !== null && out.length >= total) return out; /* the server's own total */
      /* No total offered. PostgREST always offers one when asked, so this is
         a server that is not PostgREST — a test double, most likely — and a
         short page is taken as the end. Under a cap that would truncate; the
         cap case is what the total is for, and the total is always there. */
      if(total === null && rows.length < size) return out;
      if(out.length >= 100000)
        throw new Error('refusing to read more than 100000 rows from ' + t);
    }
  };
  return API;
})();


/* ==========================================================================
   LIVE — the console against the real database

   Until someone signs in, nothing below runs and the console behaves exactly
   as it did: seeded register, shared record in this browser, no network.
   Once a member of staff signs in, LIVE takes over the two seams LINK was
   built around — where state is read, and where it is written — and every
   screen above carries on unchanged.

   Reads go through applyRegister(), the same path the workbook importer uses,
   so a register loaded from Postgres and a register loaded from a spreadsheet
   arrive at the identical shape. Writes are translated from the shared-record
   shape into table writes, one case per flow, and a failure is shown rather
   than swallowed.
   ========================================================================== */

/* Postgres stores each cost line under the register's own vocabulary; this
   console has had its own category list since long before those registers were
   found. This maps one to the other, and nothing else — it is a presentation
   mapping between two existing labels, not a new deduction about the work. It
   was checked rather than assumed: every one of the 100 imported lines was
   matched against the seeded copy of the same line on 29 Aug 2026, and each
   Postgres category resolved to exactly one console category with no line left
   over and no category splitting two ways.

   An unrecognised category falls to 'gen' — visibly general works — because
   inventing a trade from a word this table has never used is the mistake this
   project keeps having to undo. */
const COST_CAT = {
  plumbing:'plumb', hvac:'ac',      electrical:'elec',  security_sys:'elec',
  cleaning:'clean', carpentry:'carp', finishes:'paint', appliance:'appl',
  lift:'lift',      waste:'waste',  security:'sec',     labour:'gen',
  grounds:'gen'
};

const LIVE = (function(){
  /* SYNC-03. Three tables the console DISPLAYS were missing from the list it
     listens to: `building_costs`, whose rows are the whole maintenance cost
     side of the dashboard; `residents`, whose names are joined into every lease
     on screen; and `suppliers`, joined into every cost line. A name corrected
     at one desk did not reach another until something unrelated happened to
     fire a read.

     The rule this leaves: what a screen reads, the page listens to. Anything
     read in `pull()` belongs here, including through a join. */
  const WATCH = ['work_orders','announcements','instalments','leases','documents','units',
                 'building_costs','residents','suppliers'];
  let state = null, subs = [], lastErr = null, pulling = false, again = false, timer = null;
  /* N-01. There used to be a `leaseOf` map here: a unit-to-lease cache with four
     writers inside this module and one reader in the payment writer — and no way
     for applyRenewal, which lives outside it, to correct it. A renewal therefore
     moved the instalments on screen while the map still pointed at the closed
     term, and the next payment went to the wrong lease.
     The lease id now lives on the unit, beside the instalments it belongs to.
     One value, one owner, set by whichever response last established it. */
  const setLeaseId = (unit, id) => { const u = UNITS.find(x => x.u === unit); if(u) u.leaseId = id || null; };
  /* DATA-02. The last cost register that actually arrived, and whether the most
     recent attempt to re-read it failed. A failed read keeps the last good
     figures on screen and says they are stale; it never silently substitutes
     zero. */
  let lastCosts = null, costsErr = null;

  const N = v => (v === null || v === undefined) ? null : Number(v);
  const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  const BLANK = () => ({v:1, rev:0, at:0, by:'', wo:{}, newWO:[], anns:[], pay:{},
                        docs:[], leases:{}, jobs:[], nextSeq:0});

  /* --------------------------------- read -------------------------------- */
  async function pull(){
    const [units, leases, inst, wos, anns, docs, costs, owing] = await Promise.all([
      SB.selAll('units', 'select=*&order=id.asc'),
      /* CON-08. Every collection the console needs whole goes through selAll,
         and every order ends in a unique key. */
      /* Pilot onboarding. The resident's own id and email come with the lease,
         so the office can record the address a tenant signs in with, and
         auth_uid comes only so the console can say whether they have — it is
         reduced to a yes/no in toRegister and not kept. */
      SB.selAll('leases', 'select=id,unit_id,resident_id,starts_on,ends_on,contract_value,status,' +
                          'residents(id,name_en,name_ar,email,auth_uid)&status=eq.active&order=unit_id.asc,id.asc'),
      /* SCALE-03. This read the whole instalments table and then threw most of
         it away: toRegister() keeps only the rows belonging to the flat's ACTIVE
         lease, and that is the only place this payload is read. Every superseded
         term's instalments were fetched and discarded — 21 of 83 rows today, and
         one more closed term's worth on every renewal, for ever.

         Bounded at the database instead, with an inner join onto the lease so a
         row only arrives if its lease is active. The discarded rows are exactly
         the rows no longer fetched, so nothing on any screen changes. Paid rows
         of a closed term are NOT deleted by this — they stay in Postgres, which
         is where the evidence of a past payment belongs; they are simply not
         read into a register that has no place to show them.

         (lease_id, seq) is UNIQUE, so the order is total and selAll's paging
         cannot drop or repeat a row. */
      SB.selAll('instalments', 'select=*,leases!inner(status)' +
                               '&leases.status=eq.active&order=lease_id.asc,seq.asc'),
      SB.selAll('work_orders', 'select=*&order=raised_at.desc,id.desc'),
      SB.selAll('announcements', 'select=*&order=published_at.desc,id.desc'),
      SB.selAll('documents', 'select=*&order=uploaded_at.desc,id.desc'),
      /* The office's own registers. This layer was written a week before
         building_costs existed, so signing in used to EMPTY the maintenance
         page: work_orders has no rows, and nothing here had been told about
         the hundred imported invoice lines. Connecting made the console less
         truthful than not connecting, which is the wrong way round.

         Caught rather than allowed to propagate: if this one table is missing
         or refused, the rent register must still load. A console that shows
         nothing because of the cost table is worse than one that shows the
         register and no costs. */
      /* DATA-02. This used to catch every error and return [], so a refused or
         failed read arrived as a legitimately empty table: the maintenance
         total fell to zero, net income improved, and nothing on the screen
         looked unusual. A failed read and an empty register are different
         facts and must stay distinguishable. The catch stays — the rent
         register must still load — but it now says what happened. */
      SB.selAll('building_costs',
             'select=id,occurred_on,description,amount,unit_id,category,invoice_no,' +
             'suppliers(name_en)&order=occurred_on.asc,id.asc')
        .then(rows => ({ok:true, rows}))
        .catch(e => { console.warn('building_costs unavailable', e);
                      return {ok:false, why:(e && e.message) || String(e)}; }),
      /* F-02. What is still unpaid on terms that have CLOSED — ended, or
         superseded by a renewal. SCALE-03 bounded the register to active
         leases, correctly, and in doing so left this money with no screen at
         all: SAR 127,258 across four flats on the day it was found. Only the
         unpaid rows of closed terms, joined to their lease, ordered to the
         unique key. Nobody but staff writes instalments, so this is bounded by
         the office's own history and not by anything a resident can do. */
      SB.selAll('instalments', 'select=id,lease_id,seq,amount,due_on,paid,' +
                               'leases!inner(id,unit_id,status,starts_on,ends_on,contract_value,residents(name_en,name_ar))' +
                               '&leases.status=in.(ended,superseded)&paid=eq.false&order=lease_id.asc,seq.asc')
    ]);
    return {units, leases, inst, wos, anns, docs, costs, owing};
  }

  const toRegister = d => d.units.map(u => {
    const l = d.leases.find(x => x.unit_id === u.id);
    const rows = l ? d.inst.filter(i => i.lease_id === l.id) : [];
    const r = l && l.residents;
    return {
      id:u.id, type:u.type, area:N(u.area), floor:u.floor, let:!!u.occupied,
      /* DATA-03. `units.lettable` and `units.lettable_source` exist in the
         database and were dropped here, while the console counted occupancy
         against a hardcoded 37. The register holds 39 rows; 37 are marked
         lettable, and the source column records HOW that was decided — which
         for those two is a deduction from the head lease, not a record from
         the office. A figure that rests on a deduction has to be able to say
         so, and it cannot if the column never leaves the database. */
      lettable: u.lettable !== false,
      lettableSource: u.lettable_source || null,
      /* N-01. The id of the lease these instalments belong to travels WITH
         them. A payment is written against this id, so the row on screen and
         the row in Postgres cannot be two different leases. */
      leaseId: l ? l.id : null,
      /* Onboarding: who the tenant is on record, the address they sign in
         with, and whether they have. auth_uid itself goes no further. */
      residentId: r ? (r.id || null) : (l ? (l.resident_id || null) : null),
      email:      r ? (r.email || null) : null,
      signedIn:   !!(r && r.auth_uid),
      tenant:   r ? r.name_en : null,
      tenantAr: r ? (r.name_ar || r.name_en) : null,
      value: l ? N(l.contract_value) : null,
      start: l ? l.starts_on : null,
      end:   l ? l.ends_on   : null,
      paid:   rows.filter(x =>  x.paid).reduce((a,x)=>a + N(x.amount), 0),
      remain: rows.filter(x => !x.paid).reduce((a,x)=>a + N(x.amount), 0),
      /* DATA-07. This kept amount, due date and the paid flag and dropped
         paid_on and receipt_ref on the floor. Downstream then rebuilt "Paid on"
         from the DUE date, so the console displayed a payment date that was not
         the payment date, and no receipt at all. A fabricated date is worse
         than a blank one: nobody ever queries it. */
      /* F-01. The row's own id travels with it, so a receipt can name the
         instalment it settles rather than the flat and a number a renewal
         will reuse. */
      inst: rows.map(x => ({id:x.id, n:x.seq, amt:N(x.amount), due:x.due_on, paid:!!x.paid,
                            on:x.paid_on || null, ref:x.receipt_ref || null}))
    };
  });

  function paint(d){
    applyRegister(toRegister(d));                    /* the importer's own path */

    WOS.length = 0;
    d.wos.forEach(w => {
      const u = UNITS.find(x => x.u === w.unit_id);
      const c = CAT(w.category) || {sla:8};
      const target = w.target_hrs != null ? Number(w.target_hrs) : c.sla;
      const raised = new Date(w.raised_at);
      const closed = w.closed_at ? new Date(w.closed_at) : null;
      const row = {
        id:w.id, cat:w.category, unit:w.unit_id,
        tenant:(u && u.tenant) || '—', tenant_ar:(u && u.tenant_ar) || '—',
        desc:w.description || '', pri:priOK(w.priority), ch:w.channel || 'app',
        /* APP-02, the reading half. The columns have existed since 8 September
           and the console has been writing them since; nothing ever read them
           back, so a title the resident typed and an hour they said they would
           be home were stored and then invisible to the office. Null and ''
           both become '' here, and the panel shows the row only when there is
           something in it — an absent answer states nothing rather than
           printing an empty line. */
        title:w.title || '', visit:w.visit_window || '',
        raised, respH:0, closeH:0, target, breached:false,
        status:w.status,
        tech:w.technician || '—', tech_ar:w.technician || '—', supplier:false,
        labH:Number(w.labour_hrs) || 0, mat:Number(w.material) || 0,
        note:w.note || '', rating: w.rating == null ? null : Number(w.rating),
        noSla: w.measurable === false,
        month: raised.getFullYear() + '-' + String(raised.getMonth()+1).padStart(2,'0'),
        fromApp: w.channel === 'app'
      };
      /* closeH and breached are not stored — they are derived, and derived in
         one place so the read-back cannot disagree with the console that did
         the closing. */
      if(closed) markClosed(row, closed);
      WOS.push(row);
    });
    WOS.sort(byRaised);

    ANNS.length = 0;
    d.anns.forEach(a => ANNS.push({
      id:a.id, en:a.title_en, ar:a.title_ar, body_en:a.body_en, body_ar:a.body_ar,
      aud:a.audience || 'all', st:a.status, date:(a.published_at || '').slice(0,10), ok:true
    }));

    OWING.length = 0;
    (d.owing || []).forEach(x => {
      const l = x.leases || {};
      OWING.push({ id:Number(x.id), lease:Number(x.lease_id), seq:Number(x.seq), amt:N(x.amount),
                   due: x.due_on ? new Date(x.due_on) : null,
                   unit:l.unit_id, status:l.status,
                   start: l.starts_on ? new Date(l.starts_on) : null, end: l.ends_on ? new Date(l.ends_on) : null,
                   value:N(l.contract_value),
                   tenant:(l.residents && l.residents.name_en) || '', tenant_ar:(l.residents && l.residents.name_ar) || '' });
    });

    state = BLANK();
    state.docs = d.docs.map(x => ({
      id:x.id, row:x.id, key:x.ref_key || '', kind:x.kind, name:x.filename,
      lease_id:x.lease_id || null, instalment_id:x.instalment_id || null,
      mime:x.mime, size:Number(x.bytes) || 0, hash:x.sha256, algo:'SHA-256',
      at:x.uploaded_at, by:'', readable:x.readable, storage:'supabase', path:x.storage_path
    }));
    /* Deliberately computed from the work orders ALONE, before the cost lines
       are replayed below. The next resident request must not have its number
       pushed along by an invoice from last year. */
    state.nextSeq = WOS.reduce((m,w) => {
      const n = parseInt(String(w.id).replace(/\D+/g,'').slice(-3), 10);
      return isNaN(n) ? m : Math.max(m, n + 1);
    }, 501);

    /* The imported registers, replayed through the console's own entry path —
       the same call the office makes when it types up a completed job, and the
       same one the seeded copy uses. That is what makes them arrive as invoice
       lines: done, no response time, no target, noSla true. They are NOT a
       second parallel shape, and a resident-raised request under spec 004 is
       still measured on its own timestamps and never unioned with these.

       The id is built from the Postgres row, not from the position in this
       list, so a line keeps its reference when a work order is logged. */
    if(d.costs && d.costs.ok){ lastCosts = d.costs.rows; costsErr = null; }
    else if(d.costs){
      costsErr = {since: (costsErr && costsErr.since) || new Date(),
                  why: d.costs.why, everLoaded: !!lastCosts};
    }
    /* SCALE-02. One sort for the whole register, not one per invoice line. */
    const cbulk = bulkAdd();
    (lastCosts || []).forEach(c => {
      const when = new Date(c.occurred_on + 'T12:00:00');
      const u = UNITS.find(x => x.u === c.unit_id);
      logJobAdd({
        id: 'MR-' + String(when.getFullYear()).slice(2) +
            String(when.getMonth() + 1).padStart(2,'0') +
            '-I' + String(c.id).padStart(3,'0'),
        /* DATA-06. This was `c.unit_id || '—'`, so every invoice with no flat
           against it — 94 of the 100 lines, SAR 275,919 — became a job in an
           apartment literally called "—". The work-order path leaves the field
           null for the same situation, so the two halves of the same list spoke
           two different languages, and the repeat-fault report grouped on the
           dash and reported communal work as a flat with a recurring problem.

           Null, like the other path. What a screen shows for null is a
           rendering question and is answered in one place. */
        unit: c.unit_id || null,
        cat: COST_CAT[c.category] || 'gen',
        date: c.occurred_on,
        supplier: (c.suppliers && c.suppliers.name_en) || '',
        desc: c.description || '',
        mat: Number(c.amount) || 0,
        labH: 0,
        inv: c.invoice_no || ''
      }, u, when, cbulk);
    });
    bulkDone();

    recompute();
  }

  /* SYNC-01. This used to be `if(pulling) return;` — a change that arrived
     while a read was in flight was dropped on the floor. The read already
     running had asked the database before that change existed, so its answer
     cannot contain it, and nothing was left to ask again. The screen then held
     stale data until some unrelated event happened to trigger another read.
     Nobody saw an error; they saw a number that was simply out of date, which
     is the worst kind of wrong for a rent register.

     Returning early is still right — two concurrent reads would race to paint
     and the loser would win. What was missing is the note to go round again.

     The loop is bounded. A busy minute should not turn one event into an
     unbroken chain of reads, so after five passes the remainder is handed to
     `nudge()`, which debounces. */
  /* SYNC-03. "Add a visible last-successful-refresh time and a stale-data
     state." Nothing recorded when a read last worked, so a screen that had
     stopped refreshing looked exactly like one that had just refreshed — which
     is the same shape of defect as a heartbeat standing in for a join, one
     layer up. A read that FAILS does not move this; that is the point of it. */
  let lastRead = 0;
  const STALE_AFTER = 2 * 60 * 1000;
  const freshness = () => ({
    at: lastRead || null,
    stale: !lastRead || (Date.now() - lastRead) > STALE_AFTER,
    secs: lastRead ? Math.round((Date.now() - lastRead) / 1000) : null
  });

  const MAX_PASSES = 5;
  async function reload(){
    if(pulling){ again = true; return; }
    pulling = true;
    try{
      let n = 0;
      do {
        again = false;
        try{ paint(await pull()); lastErr = null; lastRead = Date.now(); }
        catch(e){ lastErr = e; console.error('LIVE.reload', e); }
      } while(again && ++n < MAX_PASSES);
    } finally { pulling = false; }
    if(again) nudge();
    /* N-02. `stale` says this notification follows a read that did NOT succeed.
       Subscribers still run — the screen has to show that the connection is in
       trouble — but the shared-record replay must not, because replaying
       approximate terms over the register is how a failed refresh silently
       rewrote a schedule. A failure is a reason to say so, not to recompute. */
    subs.forEach(fn => { try{ fn(state, {by:'live', stale: !!lastErr}); }catch(e){} });
  }
  /* A debounce with a ceiling. This was a pure trailing debounce, and the audit
     named what that costs: "prevent continuous events from postponing updates
     indefinitely through the trailing debounce". A change every 300ms — one
     busy import, one operator working through a list — reset the timer for ever
     and the screen never read anything at all.

     So the quiet 400ms still wins when things are quiet, and after two seconds
     of being pushed back the read happens anyway. */
  let firstNudge = 0;
  const MAX_WAIT = 2000;
  const nudge = () => {
    const now = Date.now();
    if(!firstNudge) firstNudge = now;
    clearTimeout(timer);
    if(now - firstNudge >= MAX_WAIT){ firstNudge = 0; reload(); return; }
    timer = setTimeout(() => { firstNudge = 0; reload(); }, 400);
  };
  /* Coming back to a tab that has been in the background, or to a device that
     has just found a network again, is the same situation as a reconnection:
     whatever happened in between was not delivered here. Both are read as a
     reason to catch up rather than as a reason to trust the screen. */
  function watchForeground(){
    try{
      document.addEventListener('visibilitychange', () => {
        if(document.visibilityState === 'visible') nudge();
      });
      window.addEventListener('online', nudge);
      window.addEventListener('pageshow', e => { if(e && e.persisted) nudge(); });
    }catch(e){}
  }

  /* -------------------------------- write -------------------------------- */
  /* DATA-01. What this code used to do, in both saveLease and saveRegister:
     DELETE every instalment on the lease, then insert a fresh unpaid schedule.
     Correcting a typo in an end date erased every paid flag, paid_on and
     receipt_ref on that lease — silently, with no error and nothing to restore
     from. Twenty leases here carry 56 settled instalments.

     Both paths now go through one Postgres function, save_lease_schedule, which
     is a single transaction, reconciles by instalment number instead of
     replacing, and cannot delete or rewrite a paid row — the instalments table
     itself refuses that now, so a hand-typed statement in the SQL editor is
     refused too. It runs as a dry run first and returns exactly the receipt the
     real run would produce; anything it cannot do quietly is reported as a
     conflict and the operator decides. DATA-02 rides along: the schedule dates
     come from add_months_clamped, so 31 January plus one month is 28 February
     rather than 3 March. */

  function ScheduleConflict(receipt, unit){
    const e = new Error('schedule conflicts with payment history');
    e.name = 'ScheduleConflict'; e.receipt = receipt; e.unit = unit;
    return e;
  }

  /* The arguments for one schedule, built in exactly one place. The import and
     the single-lease editor both go through here, so a change to the shape
     cannot reach one path and miss the other — which is how the import came to
     carry a different notion of a write from the editor beside it. */
  function scheduleArgs(unit, a){
    return {
      p_unit_id:        unit,
      p_starts_on:      a.start || null,
      p_ends_on:        a.end   || null,
      p_contract_value: (a.value === 0 || a.value) ? a.value : null,
      p_count:          a.n     || null,
      p_frequency:      a.freq  || null,
      p_rows:           a.rows  || null,
      p_dry_run:        true
    };
  }

  /* One call, both phases. Returns the receipt of whatever actually ran. */
  async function writeSchedule(unit, a, opts){
    opts = opts || {};
    const args = scheduleArgs(unit, a);
    const dry = await SB.rpc('save_lease_schedule', args);
    const conflicts = (dry && dry.conflicts) || [];
    if(conflicts.length && !opts.force){
      /* The exact arguments are carried with the held receipt, so that saying
         "apply" later applies THIS change and not a re-derived guess at it. */
      try{ Object.defineProperty(dry, '_args', {value:args, enumerable:false}); }
      catch(e){ dry._args = args; }
      throw ScheduleConflict(dry, unit);
    }
    args.p_dry_run = false;
    return await SB.rpc('save_lease_schedule', args);
  }

  /* Apply a receipt the operator has read and accepted. Paid rows are still
     untouchable — the function and the table both refuse — so this confirms the
     unpaid side of the change, never an overwrite of a payment. */
  async function applyHeld(receipt){
    if(!receipt || !receipt._args) throw new Error('nothing to apply');
    const args = Object.assign({}, receipt._args, {p_dry_run:false});
    const r = await SB.rpc('save_lease_schedule', args);
    if(r && r.lease_id && r.unit) setLeaseId(r.unit, r.lease_id);
    nudge();
    return r;
  }

  async function saveLease(unit, a, opts){
    const r = await writeSchedule(unit, a, opts);
    if(r && r.lease_id) setLeaseId(unit, r.lease_id);
    return r;
  }

  /* A register imported from the workbook becomes the register in Postgres.
     The import supplies its own instalments, including which of them are
     settled — but a paid flag only settles a row when it names the receipt it
     was paid against, and when it does not, the receipt says so per instalment
     instead of the flag disappearing without a word.

     DATA-01, the half that survived 8 September. This function used to upsert
     every unit FIRST — unconditionally, before a single conflict had been
     looked for — and then apply each lease as it went, keeping the ones that
     were clean. A disagreement on the thirtieth flat therefore left the first
     twenty-nine written, while the reconciliation panel told the operator, in
     both languages, that nothing had been written. It had.

     Applying part of an import is wrong on its own terms, not just to describe.
     The preview the operator approves is about the WHOLE file: occupancy,
     contracted, billed, collected, outstanding. An arbitrary prefix of it
     leaves a register matching neither the workbook nor what was there before,
     and makes that preview false as well as the panel.

     So the import is all or nothing. Every schedule is dry-run first and
     nothing at all is written until every one of them comes back clean, or
     until the operator has read the conflicts and accepted them. A dry run
     returns exactly the receipt the real run would produce, which is what makes
     a decision taken on it a decision about the real thing. */
  function registerUnitRows(rows){
    return rows.map(r => ({
      id:r.id, floor:r.floor, type:r.type, area:r.area, occupied:!!r.let }));
  }
  function registerLeaseArgs(rows){
    const out = [];
    for(const r of rows){
      if(!r.value && !r.start && !(r.inst || []).length) continue;
      out.push(scheduleArgs(r.id, {
        start: r.start || null, end: r.end || null,
        value: r.value || null, n: (r.inst || []).length || null,
        rows: (r.inst || []).length ? r.inst.map(x => ({
          seq:x.n, amount:x.amt, due_on:x.due,
          paid:!!x.paid, paid_on:x.on || null, receipt_ref:x.ref || null })) : null
      }));
    }
    return out;
  }

  /* Phase two, and the only place in the import that writes anything. Reached
     because the dry run was clean, or because the operator read what it found
     and accepted it. Paid rows are still untouchable throughout: the function
     and the table both refuse.

     It is now one call, which is the last half of DATA-01.
     Until this morning it was a units upsert followed by a browser `for` loop
     of one RPC per lease. Each of those is its own transaction. A dropped
     connection, a closed laptop, or a row that had moved since the dry run left
     the 37 units written and an arbitrary prefix of the leases written — a
     register matching neither the workbook nor what was there before, while the
     panel reported that nothing had been written. save_register does the whole
     plan inside one Postgres transaction: an exception on the twentieth flat
     takes the first nineteen and the units down with it. All of the file, or
     none of it. */
  async function commitRegister(plan){
    const got = await SB.rpc('save_register',
                             {p_units: plan.units, p_leases: plan.leases, p_dry_run: false});
    const receipts = (got && got.receipts) || [];
    receipts.forEach(r => {
      if(r && r.lease_id && r.unit) setLeaseId(r.unit, r.lease_id);
    });
    nudge();
    return receipts;
  }

  async function saveRegister(rows, opts){
    opts = opts || {};
    /* `rows` rides along so that accepting a held import can repaint the screen
       from the same file the database just took, rather than from whatever the
       shared record happens to hold by then. */
    const plan = {units: registerUnitRows(rows), leases: registerLeaseArgs(rows), rows: rows};
    if(!opts.force){
      /* One dry run for the whole file, for the same reason: the preview the
         operator approves is about the file, so the preview has to be taken of
         the file. It writes nothing, units included. */
      const dry = await SB.rpc('save_register',
                               {p_units: plan.units, p_leases: plan.leases, p_dry_run: true});
      const held = ((dry && dry.receipts) || [])
                     .filter(r => r && (r.conflicts || []).length);
      if(held.length){
        const e = new Error('register held for review');
        e.name = 'ScheduleConflictBatch';
        e.receipts = held;
        /* Empty, and now true. This used to carry the flats already written. */
        e.applied = [];
        /* Carried so that accepting applies THIS import rather than a
           re-derived guess at it — the same reason a single held lease carries
           its own arguments. */
        e.plan = plan;
        throw e;
      }
    }
    return await commitRegister(plan);
  }

  /* The whole import, accepted. One button, because the import was one act. */
  async function applyRegisterHeld(batch){
    if(!batch || !batch.plan) throw new Error('nothing to apply');
    return await commitRegister(batch.plan);
  }

  /* REQ-01. The reference a resident is given must be the reference the office
     has. It was not.

     `work_orders.id` is minted on the device, from a counter the shared record
     publishes, so two phones that pulled the same state propose the same
     number. The loser's insert came back 409 and there WAS a retry: it took the
     next number and inserted successfully. What it did not do was tell anybody.
     `body.id` moved; the record on the resident's screen and in their list did
     not. They kept a receipt reading MR-2609-501 for a job the office holds as
     MR-2609-502. Nobody involved could tell, because both records exist and
     both look right, and the one number they would quote to each other is the
     wrong one.

     Three changes. The reference that counts is the one the INSERT returned,
     not the one that was sent — the row comes back already, because every write
     asks for the representation, and the database is the boundary. A collision
     is retried up to eight times rather than once, because one retry only
     survives one competitor. And a reference that moved is reported back, which
     is what lets the screen agree with the office. */
  const bumpRef = id => {
    const parts = String(id).split('-');
    const m = /^([A-Za-z]*)(\d+)$/.exec(parts.pop() || '');
    if(!m) return String(id) + '-2';
    return parts.concat(m[1] + String(Number(m[2]) + 1).padStart(m[2].length, '0')).join('-');
  };
  const refSeq = id => {
    const n = parseInt(String(String(id).split('-').pop()).replace(/^[A-Za-z]+/, ''), 10);
    return Number.isFinite(n) ? n : 0;
  };
  /* Is the reference already taken BY THIS SUBMISSION? The distinction decides
     whether to renumber or to stop.

     REQ-01 again, from its other end. The audit put it exactly: there is no
     durable idempotency key for an accepted request whose response is lost. If
     an insert lands and the answer never comes back — a tunnel, a timeout, a
     killed tab — the next attempt gets 409, and the retry that was written to
     survive a collision would take the next reference and file the request a
     SECOND time. The fix for one defect is the cause of the other, which is
     why they are handled in one place.

     Nothing in `work_orders` is a key for an intended submission, so the row is
     recognised by what only this submission could have produced: the reference,
     the flat, the moment it was raised, and the text. Two attempts matching all
     four are the same attempt by any test anybody could apply.

     This is a recognition rule, not an idempotency key. The durable fix is a
     column — sql/2026-09-15_request_key.sql, written and not applied. */
  /* CON-03 / REQ-01, the durable half.

     Until 16 September the collision handler decided whether a 409 meant "my
     own submission already landed" by matching reference, raised time, flat
     and description. Desk jobs logged for the same day all carry 09:00:00Z
     and a description that defaults to the service name — so a SAR 200 job
     and a different SAR 300 job on the same flat looked identical, and the
     second one was adopted as the first. Two jobs became one.

     Every intended submission now mints a uuid ONCE, before its first attempt,
     and carries it on every retry: work_orders.request_key, unique where not
     null (sql/2026-09-15_request_key.sql). The question "did mine land?" is
     answered by that key and nothing else. A 409 on the primary key with no
     row under my key is a competitor for the reference — renumber and try
     again with the SAME key. A 409 on the key is my own row, whether or not
     the read of it succeeds. */
  const mintKey = () => { try{ return crypto.randomUUID(); }catch(e){ return null; } };
  const keyCollision = e => /request_key/.test(
    String((e && e.message) || '') + ' ' + String((e && e.body && e.body.message) || ''));

  async function alreadyMine(body){
    try{
      if(body.request_key){
        const rows = await SB.sel('work_orders',
          'select=*&request_key=eq.' + encodeURIComponent(body.request_key));
        return (rows && rows[0]) || null;
      }
      /* A row written before the column existed carries no key. The old
         four-field recognition stays for those, and only those. */
      const rows = await SB.sel('work_orders',
        'select=*&id=eq.' + encodeURIComponent(body.id) +
        '&raised_at=eq.' + encodeURIComponent(body.raised_at));
      const r = rows && rows[0];
      if(!r) return null;
      const same = String(r.unit_id) === String(body.unit_id)
                && String(r.description == null ? '' : r.description)
                   === String(body.description == null ? '' : body.description);
      return same ? r : null;
    }catch(e){ return null; }
  }

  async function insertWO(body, renamed){
    const from = body.id;
    for(let tries = 0; ; tries++){
      try{
        const rows = await SB.ins('work_orders', body);
        const landed = (rows && rows[0] && rows[0].id) || body.id;
        if(landed !== from) renamed[from] = landed;
        return rows;
      }catch(e){
        if(e.status !== 409 || tries >= 8) throw e;
        const mine = await alreadyMine(body);
        if(mine){
          /* It landed. Adopt the row rather than filing it again. */
          if(mine.id !== from) renamed[from] = mine.id;
          return [mine];
        }
        /* The key says the submission is already there and the read of it did
           not come back. Renumbering now would file it a second time — the
           exact thing the key exists to prevent. Fail, and let the next sync
           adopt it. */
        if(body.request_key && keyCollision(e)) throw e;
        body = Object.assign({}, body, {id: bumpRef(body.id)});
      }
    }
  }

  /* CON-02. An UPDATE that matched no row comes back 200 with an empty array,
     and RLS filters rather than raises — so a write a viewer is not allowed to
     make, or one aimed at a row that is not there, used to look identical to a
     success. SB.upd asks for the rows back; no rows means nothing changed, and
     nothing changed is a failure with a name. */
  const touched = (p, what) => p.then(rows => {
    if(!Array.isArray(rows) || !rows.length)
      throw new Error('nothing was changed for ' + what + ' — the row is missing or the write was not permitted');
    return rows;
  });

  /* DUAL-01. The shared record is a list of intents laid over what the
     database last said. Until 16 September a refused intent STAYED in it: the
     write failed, the operator was told, and the record went on holding the
     change as if it had landed. The next press of the same button then found
     nothing to send — the record already matched — and settled() reported a
     clean pass with zero writes, which every caller read as success. One
     refusal, one retry, one green toast, no write. LINK_apply made it worse:
     a reload that could not reach the database re-applied the record over
     the screen, refused change and all.

     Every write now carries its own undo. A write that is rejected — or
     held for a decision — is taken back out of the record before push()
     resolves, so the record holds confirmed changes and in-flight ones and
     nothing else, and the retry has something to send. What the database
     returned is kept beside each key for callers that must show the row the
     database holds rather than the one they asked for. */
  async function push(before, after){
    const jobs = [], undos = [];
    const renamed = {};                 /* reference sent -> reference that landed */
    const landed  = {};                 /* what the database returned, by the key it was sent under */
    const snap = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
    /* The calendar day of a timestamp where the operator sat, not the UTC
       day: a payment recorded at one in the morning in Riyadh is that day's
       payment, and slicing the ISO string made it yesterday's. */
    const localDay = v => {
      const dt = new Date(v);
      if(isNaN(dt)) return String(v).slice(0,10);
      return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
    };
    const attempt = (key, p, undo) => {
      jobs.push(Promise.resolve(p).then(r => {
        landed[key] = Array.isArray(r) ? (r[0] === undefined ? null : r[0]) : (r === undefined ? null : r);
        return r;
      }));
      undos.push(undo || null);
    };

    Object.keys(after.wo || {}).forEach(id => {
      const a = after.wo[id];
      const was = (before.wo || {})[id];
      if(eq(a, was)) return;
      const sent = snap(a);
      const p = {};
      if(a.status !== undefined){
        p.status = a.status;
        /* The moment the office pressed the button, carried through the shared
           record — not the moment this flush happens to run. Everything the
           console reports about lateness is derived from this column, so it has
           to be the close time and not the sync time. */
        p.closed_at = (a.status === 'done') ? (a.closedAt || new Date().toISOString()) : null;
      }
      if(a.tech   !== undefined) p.technician  = (a.tech === '—' || !a.tech) ? null : a.tech;
      if(a.labH   !== undefined) p.labour_hrs  = a.labH;
      if(a.mat    !== undefined) p.material    = a.mat;
      if(a.note   !== undefined) p.note        = a.note;
      if(a.rating !== undefined) p.rating      = a.rating;
      attempt('wo:' + id, touched(SB.upd('work_orders', 'id=eq.' + encodeURIComponent(id), p), 'job ' + id),
              () => { if(after.wo && eq(after.wo[id], sent)){ if(was === undefined) delete after.wo[id]; else after.wo[id] = was; } });
    });

    (after.newWO || []).forEach(w => {
      if((before.newWO || []).some(x => x.id === w.id)) return;
      attempt('wo:' + w.id, insertWO({
        id:w.id, unit_id:w.unit, category:w.cat, description:w.desc,
        request_key: w.request_key || null,
        /* APP-02. The resident app collects a title and a preferred visit
           window as well as the description; both were being dropped on the
           floor here. Sent as null rather than '' when absent, so "not stated"
           and "stated as empty" stay different things. */
        title: w.title || null,
        visit_window: w.visit ? visitOK(w.visit) : null,
        priority:priOK(w.pri), channel:'app', status:'submitted', raised_at:w.raised},
        renamed),
        () => { const i = (after.newWO || []).indexOf(w); if(i > -1) after.newWO.splice(i, 1); });
    });

    (after.jobs || []).forEach(j => {
      if((before.jobs || []).some(x => x.id === j.id)) return;
      const day = j.date + 'T09:00:00Z';
      /* REQ-01. This path had no retry at all — the comment where the
         reference is minted says so in as many words. Two consoles holding the
         same hundred jobs both propose I101, one inserts, and the other's row
         dies on the primary key while the job sits on screen looking logged. */
      attempt('job:' + j.id, insertWO({
        id:j.id, unit_id:j.unit, category:j.cat, description:j.desc,
        request_key: j.request_key || null,
        priority:'routine', channel:'desk', status:'done', technician:j.supplier || null,
        raised_at:day, closed_at:j.date + 'T12:00:00Z',
        labour_hrs:j.labH || 0, material:j.mat || 0,
        measurable:false, note:j.inv ? ('Invoice ' + j.inv) : null},
        renamed),
        () => {
          const i = (after.jobs || []).indexOf(j); if(i > -1) after.jobs.splice(i, 1);
          /* The reference this job took is released with it, if nothing else
             has moved the counter since: a refused insert left no row, so the
             retry may carry the same number — and the same key. */
          if(Number(after.nextSeq) === refSeq(j.id) + 1 && before.nextSeq !== undefined) after.nextSeq = before.nextSeq;
        });
    });

    (after.anns || []).forEach(a => {
      if((before.anns || []).some(x => x.id === a.id)) return;
      attempt('ann:' + a.id, SB.ins('announcements', {
        title_en:a.en, title_ar:a.ar, body_en:a.body_en, body_ar:a.body_ar,
        audience:a.aud || 'all', status:'published', published_at:new Date().toISOString()}),
        () => { const i = (after.anns || []).indexOf(a); if(i > -1) after.anns.splice(i, 1); });
    });

    Object.keys(after.pay || {}).forEach(unit => {
      const A = (after.pay[unit] || {}).paid || {};
      const B = ((before.pay || {})[unit] || {}).paid || {};
      Object.keys(A).forEach(q => {
        if(eq(A[q], B[q])) return;
        const sent = snap(A[q]), was = B[q];
        const undo = () => {
          const cur = after.pay && after.pay[unit] && after.pay[unit].paid;
          if(cur && eq(cur[q], sent)){ if(was === undefined) delete cur[q]; else cur[q] = was; }
        };
        /* N-01. Resolved from the unit — the same object whose instalments the
           operator is looking at — not from a separate cache that a renewal can
           leave behind. */
        const pu = UNITS.find(x => x.u === unit);
        const lid = pu && pu.leaseId;
        /* CON-02. This used to `return` — and a payment recorded against a
           flat with no active lease was dropped on the floor with nothing
           pushed, nothing failed, and settled() reporting a clean success. It
           is a failure, and it is one the operator has to hear about. */
        if(!lid){
          attempt('pay:' + unit + ':' + q,
                  Promise.reject(new Error('no active lease on ' + unit + ' to record a payment against')), undo);
          return;
        }
        attempt('pay:' + unit + ':' + q, touched(SB.upd('instalments', 'lease_id=eq.' + lid + '&seq=eq.' + q, {
          paid:true,
          /* DUAL-02. A receipt whose date could not be read is recorded with
             no date, not with today's. This used to substitute the moment of
             the sync for a date nobody knew. */
          paid_on: A[q].on ? localDay(A[q].on) : null,
          receipt_ref:A[q].ref || null}), 'instalment ' + q + ' on ' + unit), undo);
      });
    });

    Object.keys(after.leases || {}).forEach(unit => {
      const was = (before.leases || {})[unit];
      if(eq(after.leases[unit], was)) return;
      const sent = snap(after.leases[unit]);
      attempt('lease:' + unit, saveLease(unit, after.leases[unit]),
              () => { if(after.leases && eq(after.leases[unit], sent)){ if(was === undefined) delete after.leases[unit]; else after.leases[unit] = was; } });
    });

    (after.docs || []).forEach(d => {
      if((before.docs || []).some(x => x.id === d.id && x.key === d.key)) return;
      attempt('doc:' + d.id, SB.ins('documents', {
        kind:d.kind, storage_path:d.path || ('unstored/' + d.id), filename:d.name,
        mime:d.mime, bytes:d.size, sha256:d.hash, readable:!!d.readable, ref_key:d.key,
        lease_id: d.lease_id || null, instalment_id: d.instalment_id || null
      }).then(r => { if(r && r[0]) d.row = r[0].id; return r; }),
        () => { const i = (after.docs || []).indexOf(d); if(i > -1) after.docs.splice(i, 1); });
    });
    (before.docs || []).forEach(d => {
      if((after.docs || []).some(x => x.id === d.id && x.key === d.key)) return;
      if(d.row) attempt('undoc:' + d.id, SB.del('documents', 'id=eq.' + d.row),
        () => { if(after.docs && !after.docs.some(x => x.id === d.id && x.key === d.key)) after.docs.push(d); });
    });

    if(after.register && !eq(after.register, before.register)){
      const sent = snap(after.register), was = before.register;
      attempt('register', saveRegister(after.register),
              () => { if(eq(after.register, sent)){ if(was === undefined) delete after.register; else after.register = was; } });
    }

    const out = await Promise.allSettled(jobs);
    const bad = out.filter(r => r.status === 'rejected');
    /* DUAL-01. Every write that did not land is taken back out of the shared
       record, so the record holds what the database has confirmed or is still
       being asked, and nothing else. Held counts as not landed: the change is
       sitting in the reconciliation panel, and the panel carries its own copy. */
    out.forEach((r, i) => {
      if(r.status === 'rejected' && undos[i]){ try{ undos[i](); }catch(e){ console.error('LIVE.undo', e); } }
    });

    /* REQ-01. A reference that moved is corrected everywhere this console
       remembers it. `logJobAdd` puts the job on screen before the write leaves,
       so without this the job list keeps a number the database does not have —
       the same defect as the resident's receipt, at the other end of it. */
    Object.keys(renamed).forEach(from => {
      const to = renamed[from];
      (after.newWO || []).forEach(w => { if(w.id === from) w.id = to; });
      (after.jobs  || []).forEach(j => { if(j.id === from) j.id = to; });
      try{ WOS.forEach(w => { if(w.id === from) w.id = to; }); }catch(e){}
      after.nextSeq = Math.max(Number(after.nextSeq) || 0, refSeq(to) + 1);
    });

    /* A schedule that disagrees with money already received is not a failure —
       it is a question, and it is the operator's to answer. It gets the
       reconciliation panel, not a toast that scrolls away in three seconds. */
    const conflicted = bad.map(r => r.reason).filter(e =>
      e && (e.name === 'ScheduleConflict' || e.name === 'ScheduleConflictBatch'));
    const failed = bad.map(r => r.reason).filter(e =>
      !e || (e.name !== 'ScheduleConflict' && e.name !== 'ScheduleConflictBatch'));

    /* A held import is kept whole rather than flattened into the single-lease
       list. The two are answered differently — one flat can be accepted on its
       own; an import is accepted entire or not at all — and a panel that offered
       "apply" per flat on an import would reintroduce the partial write this
       release removed, one press at a time. */
    let batch = null;
    if(conflicted.length && typeof openReconcile === 'function'){
      const receipts = [];
      conflicted.forEach(e => {
        if(e.name === 'ScheduleConflictBatch') batch = e;
        else receipts.push(e.receipt);
      });
      openReconcile(receipts, batch);
    }

    if(failed.length){
      lastErr = failed[0];
      const m = (failed[0] && failed[0].message) || 'write failed';
      if(typeof toast === 'function')
        toast(L('The database refused that change: ' + m,
                'رفضت قاعدة البيانات هذا التغيير: ' + m));
    }else if(!conflicted.length){
      lastErr = null;
    }
    nudge();
    /* What actually happened, for a caller that needs to know before it speaks.
       importApply used to announce "Register replaced" while this was still in
       flight, so the sentence appeared over a database that had refused it.

       DUAL-01: `wrote` is how many writes were attempted. Zero means the
       record already matched and nothing was sent — which acknowledges
       nothing, and no caller may read it as if it did. `landed` carries the
       rows the database returned, by the key each was sent under, for a
       caller that must show what the database holds rather than what it
       asked for. */
    return {held: conflicted.length, failed: failed.length, batch: !!batch,
            wrote: jobs.length, landed, renamed};
  }

  /* The most recent push, so a caller can wait for its outcome. Writes stay
     fire-and-forget for every screen that does not need to say what happened. */
  let settled = Promise.resolve(null);

  function commit(mutate, who){
    const before = JSON.parse(JSON.stringify(state || BLANK()));
    try{ mutate(state); }catch(e){ console.error('LIVE.commit', e); return state; }
    state.rev = (state.rev || 0) + 1;
    state.at  = Date.now();
    state.by  = who || '';
    settled = push(before, state);
    return state;
  }

  /* -------------------------------- attach ------------------------------- */
  async function start(){
    await reload();
    if(lastErr) return false;
    LINK.get      = () => state;
    LINK.commit   = commit;
    LINK.onChange = fn => subs.push(fn);
    LINK.reset    = () => state;
    LINK.healthy  = () => !lastErr;
    LINK.live     = () => true;
    LINK.settled  = () => settled;
    DOCSTORE.mode = 'supabase';
    DOCSTORE.put  = async file => {
      /* DOC-01. The key was a timestamp to the SECOND plus the filename, so two
         uploads of `invoice.pdf` in the same second produced the same key —
         and the bucket is written with x-upsert:false, so the second one
         failed. A person attaching a pair of scans does that routinely. The
         random half makes the key unique whatever the clock says; the
         timestamp stays because a bucket somebody has to read by hand is worth
         keeping in order. */
      return {mode:'supabase', path: await SB.upload(objectKey(file), file)};
    };
    SB.watch(WATCH, nudge);
    watchForeground();
    return true;
  }

  return {start, reload, on: () => !!state && LINK.live(), err: () => lastErr,
          costsState: () => costsErr ? {ok:false, ...costsErr} : {ok:true},
          freshness,
          rt: () => SB.rtState(), signedInAs: () => SB.email(),
          applyHeld, applyRegisterHeld};
})();


/* ------------------------------ connection ------------------------------ */
/* The console runs on seeded data until a member of staff signs in. Signing
   in is what turns it into the real register: every read comes from Postgres
   and every change is written back, so a second person on a second machine
   sees it. Passwords are typed here and exchanged with Supabase directly —
   nothing about them is stored in this file. */

function sbStatusLine(){
  if(!SB.signedIn())
    /* This used to say the console was "showing the seeded register held in
       this browser". There is no seeded register any more — signed out, the
       console shows the sign-in gate and nothing else. Nothing is held here to
       misdescribe; the honest line is that there is no data until a session
       loads it from the office system. */
    return `<div class="warnbox">${I('alert',16,2.2)}<span>${L(
      'Not connected. Sign in with your work email to load the register from the office system — nothing is held on this machine.',
      'غير متصل. سجّل الدخول ببريدك المهني لتحميل السجل من نظام المكتب — لا يُحفظ شيء على هذا الجهاز.')}</span></div>`;
  const rt = SB.rtState();
  const live = rt === 'live';
  /* SYNC-03. A live channel says messages can arrive. It does not say anything
     arrived, and the two were being reported as one thing. The time of the last
     read that actually SUCCEEDED is a different fact and it is the one that
     answers "am I looking at the current state", so it is stated beside the
     channel rather than folded into it. */
  let f = {stale:true, at:null};
  try{ f = LIVE.freshness(); }catch(e){}
  const ok = live && !f.stale;
  const when = f.at ? new Date(f.at) : null;
  const hhmm = when ? String(when.getHours()).padStart(2,'0') + ':' +
                      String(when.getMinutes()).padStart(2,'0') : null;
  const read = hhmm
    ? L(' Last read at ' + hhmm + (f.stale ? ' — nothing has arrived since.' : '.'),
        ' آخر قراءة ' + NUM(hhmm) + (f.stale ? ' — ولم يصل شيء بعدها.' : '.'))
    : L(' Nothing has been read yet.', ' لم تتم أي قراءة بعد.');
  return `<div class="${ok?'okbox':'warnbox'}">${I(ok?'check':'clock',16,2.2)}<span>${L(
    'Connected as ' + esc(SB.email()) + (live ? ' — live, changes appear on other machines as they happen.'
                                         : ' — connected, but the live channel is ' + rt + '.'),
    'متصل باسم ' + esc(SB.email()) + (live ? ' — التحديث فوري على الأجهزة الأخرى.'
                                      : ' — متصل، لكن قناة التحديث الفوري: ' + rt))}${esc(read)}</span></div>`;
}

/* ---------------------------- change password ----------------------------
   Reached two ways: from the connection drawer while signed in, and from a
   recovery link, where the session came out of the URL fragment and the
   person may not be staff at all — recovering a password is not a staff
   action, so nothing here is gated on that.

   The new value is typed twice. A single field plus a typo locks somebody out
   of an account that only the dashboard can rescue, and the dashboard is the
   thing they were trying not to need. */
function pwOpen(recovery){
  openDrawer(recovery ? T('pw_set_title') : T('pw_title'), `
    ${recovery ? `<div class="note" style="margin:0 0 12px">${T('pw_recovery')}</div>` : ''}
    <div class="note" style="margin:0 0 12px">${T('pw_who')} <b>${esc(SB.email() || '—')}</b></div>
    <div style="margin:14px 0"><label class="f">${T('pw_new')}</label>
      <input class="inp" id="pwA" type="password" autocomplete="new-password"></div>
    <div style="margin-bottom:4px"><label class="f">${T('pw_again')}</label>
      <input class="inp" id="pwB" type="password" autocomplete="new-password"
             onkeydown="if(event.key==='Enter')pwDo()"></div>
    <button class="btn pri" id="pwGo" style="margin-top:12px" onclick="pwDo()">${T('pw_save')}</button>
    <div class="note" style="margin-top:14px">${T('pw_note')}</div>`);
}

async function pwDo(){
  const a = ($('pwA') && $('pwA').value) || '';
  const b = ($('pwB') && $('pwB').value) || '';
  if(a.length < 8)  return toast(T('pw_short'));
  if(a !== b)       return toast(T('pw_mismatch'));
  const btn = $('pwGo');
  if(btn){ btn.disabled = true; btn.textContent = T('pw_saving'); }
  try{
    await SB.setPassword(a);
    if($('pwA')) $('pwA').value = '';
    if($('pwB')) $('pwB').value = '';
    closeDrawer();
    toast(T('pw_done'));
  }catch(e){
    toast(T('pw_err') + ' ' + (e.message || e));
    if(btn){ btn.disabled = false; btn.textContent = T('pw_save'); }
  }
}

function sbOpen(){
  const inn = SB.signedIn();
  openDrawer(L('Backend connection','الاتصال بقاعدة البيانات'), `
    <div style="padding:2px 0 4px">${sbStatusLine()}</div>
    ${inn ? `
      <div class="note" style="margin:12px 0">${L(
        'Signed in as a member of staff. The register, the jobs, the documents and the announcements on every screen are coming from the database.',
        'تم تسجيل الدخول كموظف. السجل والأعمال والمستندات والإعلانات في كل الشاشات تأتي من قاعدة البيانات.')}</div>
      <button class="btn" onclick="pwOpen(false)" style="margin-bottom:8px">${T('pw_title')}</button>
      <button class="btn" onclick="sbDoSignOut()">${L('Sign out','تسجيل الخروج')}</button>
    ` : `
      <div style="margin:14px 0"><label class="f">${L('Work email','البريد الإلكتروني')}</label>
        <input class="inp" id="sbMail" type="email" autocomplete="username" placeholder="you@almaria.sa"></div>
      <div style="margin-bottom:4px"><label class="f">${L('Password','كلمة المرور')}</label>
        <input class="inp" id="sbPass" type="password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')sbDoSignIn()"></div>
      <button class="btn pri" id="sbGo" style="margin-top:12px" onclick="sbDoSignIn()">
        ${L('Connect','اتصال')}</button>
      <div class="note" style="margin-top:14px">${L(
        'The account must be marked as staff in the database. A resident account signing in here would see nothing, because the access rules only ever return their own apartment.',
        'يجب أن يكون الحساب مُعلّماً كموظف في قاعدة البيانات. حساب ساكن لن يرى شيئاً هنا، لأن قواعد الوصول لا تُرجع سوى شقته.')}</div>
    `}`);
}

async function sbDoSignIn(){
  const mail = ($('sbMail') && $('sbMail').value || '').trim();
  const pass = ($('sbPass') && $('sbPass').value) || '';
  if(!mail || !pass) return toast(L('Both the email and the password are needed.',
                                    'البريد الإلكتروني وكلمة المرور مطلوبان.'));
  const btn = $('sbGo');
  if(btn){ btn.disabled = true; btn.textContent = L('Connecting…','جارٍ الاتصال…'); }
  try{
    await SB.signIn(mail, pass);
    if($('sbPass')) $('sbPass').value = '';
    if(!SB.isStaff()){
      SB.signOut();
      throw new Error(L('That account is not marked as staff, so it cannot open the console.',
                        'هذا الحساب غير مُعلّم كموظف، ولا يمكنه فتح لوحة الإدارة.'));
    }
    if(!await LIVE.start()) throw (LIVE.err() || new Error('could not read the register'));
    CRM.load().then(() => render());
    ROLES.load().then(() => render());
    LINK.onChange(() => { render(); linkFlash(); });
    closeDrawer(); render();
    toast(L('Connected. This console is now the register.',
            'تم الاتصال. هذه الشاشة تعرض السجل الفعلي الآن.'));
  }catch(e){
    toast(L('Could not connect: ' + (e.message || e), 'تعذّر الاتصال: ' + (e.message || e)));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = L('Connect','اتصال'); }
  }
}

/* SEC-03. Signing out cleared THIS tab and left every other open console tab
   showing Connected, the roster, and live request and cost data — reproduced by
   the 9 September audit with a real admin session. A second tab left open on a
   shared desk is the ordinary case in an office, not an edge one.

   The sign-out is announced through storage, which every tab on this origin
   sees, and each one reloads to the signed-out state. The key is namespaced by
   environment, so signing out of staging does not disturb production and vice
   versa. */
const AUTH_EVENT = ENV.prefix + '.auth.event';

function sbDoSignOut(){
  try{ SB.signOut(); }catch(e){}
  try{ localStorage.setItem(AUTH_EVENT, 'out:' + Date.now()); }catch(e){}
  closeDrawer();
  location.replace(location.pathname + location.search);
}

window.addEventListener('storage', function(e){
  if(e.key === AUTH_EVENT){
    location.replace(location.pathname + location.search);
    return;
  }
  /* The session disappearing is the same event by another route — a sign-out in
     a tab that predates this build, or a token cleared by the browser. */
  if(e.key === ENV.prefix + '.sb.session.v1' && !e.newValue)
    location.replace(location.pathname + location.search);
});

/* Replay the imported registers through the console's own invoice path, so
   each record is exactly what the 'Enter a completed job' form produces —
   noSla included — rather than a second, parallel shape. */
/* The cost tile reads 'this month'. The imported registers end in June 2026,
   so in August it correctly shows zero — and reads like a failed import. Say
   when spend was last booked instead of showing a 0% delta against nothing. */
function lastCostMonth(){
  var ms = WOS.filter(function(w){ return (w.mat||0) > 0 && w.month; })
              .map(function(w){ return w.month; }).sort();
  return ms.length ? ms[ms.length-1] : null;
}

(function seedCostLog(){
  if(typeof COST_LOG === 'undefined' || !COST_LOG.length) return;
  /* SCALE-02. One sort for the whole seeded register. */
  var sbulk = bulkAdd();
  COST_LOG.forEach(function(x){
    var d = new Date(x.d + 'T12:00:00');
    var u = UNITS.find(function(y){ return y.u === x.u; });
    logJobAdd({ unit:x.u, cat:x.c, date:x.d, supplier:x.s, desc:x.t,
                mat:x.m, labH:0, inv:x.i }, u, d, sbulk);
  });
  bulkDone();
  recompute();
  /* The first render has already run by the time this executes, so it painted
     the empty state. Repaint, or the log only appears on the next click. */
  if(typeof render === 'function') render();
})();

/* ---------------------------- backend at boot ---------------------------- */
(async function(){
  const btn = document.getElementById('sbBtn');
  const label = () => {
    if(!btn) return;
    const on = SB.signedIn();
    btn.innerHTML = I(on ? 'check' : 'alert', 15) +
      '<span>' + (on ? L('Connected','متصل') : L('Connect','اتصال')) + '</span>';
    btn.classList.toggle('pri', !on);
  };
  label();
  sbLabelTick = label;
  if(!SB.configured()) return;

  /* A recovery link, if that is how we got here. Read before anything else,
     because it carries the session the rest of this function depends on. */
  let arrived = null;
  try{ arrived = SB.adoptRecovery(); }catch(e){ arrived = null; }
  if(arrived && arrived.type === 'error'){
    render();
    toast(T('pw_link_dead') + ' ' + arrived.message);
  }

  try{
    if(await SB.ready() && SB.isStaff()){
      if(await LIVE.start()){
        LINK.onChange(() => { render(); linkFlash(); });
        render();
        /* The CRM is its own read: it is staff-only and has no seeded copy, so
           it must not be able to hold up the register loading. */
        CRM.load().then(() => render());
        /* Separate read, and deliberately not awaited with the register: it
           decides what the screen offers, not what the screen shows. */
        ROLES.load().then(() => render());
      }
    }
  }catch(e){ console.error('backend boot', e); }
  label();
  /* Last, so it sits on top of whatever the register painted. A recovery link
     has one job and the person followed it deliberately. */
  if(arrived && arrived.type === 'recovery') pwOpen(true);
  setInterval(label, 5000);
})();

</script>
