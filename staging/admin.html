/* ==========================================================================
   CRM — who the office deals with, and what was said

   Added 6 Sep 2026, against almaria_patch_crm.sql.

   LIVE ONLY, and that is the design rather than an unfinished corner. Every
   other screen in this console has a seeded copy so the page is useful before
   anyone signs in. These three must not: the tables behind them hold a record
   of real conversations, and a demonstration copy would be a fabricated
   contact history sitting one screenshot away from being believed. The
   database ships zero rows for the same reason.

   So unconnected, these pages say what they are and why they are empty. There
   is nothing to look at, which is the honest answer.
   ========================================================================== */
const CRM = (function(){
  let contacts = [], deals = [], tasks = [], renewals = [], agreements = [], timeline = {};
  let tenancy = {}, idDocs = {};
  let loaded = false, loading = false, err = null;

  const uid = () => { const c = SB.claims(); return (c && c.sub) || null; };

  async function load(){
    if(loading) return loaded;
    loading = true; err = null;
    try{
      const [c, d, t, r, a, ten, ids] = await Promise.all([
        SB.sel('contacts',   'select=*&order=name_en.asc'),
        SB.sel('deals',      'select=*,contacts(name_en,name_ar)&order=stage_since.desc'),
        SB.sel('tasks_open', 'select=*&order=due_on.asc.nullslast'),
        SB.sel('renewals_due','select=*&order=ends_on.asc'),
        SB.sel('supplier_agreements_due','select=*&order=ends_on.asc.nullslast'),
        SB.sel('contact_tenancy','select=*&order=contact_id.asc,ends_on.desc'),
        SB.sel('identity_documents','select=*&order=uploaded_at.desc')
      ]);
      contacts = c; deals = d; tasks = t; renewals = r; agreements = a;
      /* Grouped by person, current lease first. A resident with a renewal
         history has several rows and none of them is dropped. */
      idDocs = {};
      ids.forEach(x => { (idDocs[x.contact_id] = idDocs[x.contact_id] || []).push(x); });
      tenancy = {};
      ten.forEach(x => { (tenancy[x.contact_id] = tenancy[x.contact_id] || []).push(x); });
      Object.values(tenancy).forEach(list => list.sort(
        (x,y) => (y.is_current - x.is_current) || String(y.ends_on).localeCompare(String(x.ends_on))));
      loaded = true;
    }catch(e){ err = e; loaded = false; console.error('CRM.load', e); }
    finally{ loading = false; }
    return loaded;
  }

  async function timelineFor(id){
    /* Ordered by when things HAPPENED, not when they were typed. */
    timeline[id] = await SB.sel('contact_timeline',
      'select=*&contact_id=eq.' + id + '&order=at.desc');
    return timeline[id];
  }

  const on   = () => loaded;
  const busy = () => loading;

  return {
    load, timelineFor, on, busy, uid,
    err:        () => err,
    contacts:   () => contacts,
    deals:      () => deals,
    tasks:      () => tasks,
    renewals:   () => renewals,
    agreements: () => agreements,
    tenancy:    id => tenancy[id] || [],
    idDocs:     id => idDocs[id] || [],
    cached:     id => timeline[id] || null,
    reload:     async () => { loaded = false; return load(); }
  };
})();

/* ==========================================================================
   ROLES — who works here, and what each of them may do

   The console does NOT decide any of this. Postgres does: is_staff() lets a
   person read, can_write() lets them change something, is_admin() lets them
   change who else may do what. This module asks the database which of those
   the signed-in person is, and then arranges the screen to match.

   Two things follow from that division, and both matter.

   First, hiding a button is a courtesy, not a control. A viewer with the
   browser console open can call SB.ins() directly; the database refuses it,
   and check_roles.sh proves the database refuses it. What this module does is
   stop somebody being invited to try.

   Second, this module cannot create a sign-in account and does not pretend to.
   Creating a Supabase user, and marking it staff, needs the service key. This
   console has never held that key. So adding a colleague is two steps and the
   screen says which step you are on, rather than offering a button that fails.
   ========================================================================== */
const ROLES = (function(){
  let roster = [], history = [], mine = null;
  let loaded = false, loading = false, err = null;

  async function load(){
    if(loading) return loaded;
    loading = true; err = null;
    try{
      /* link_staff_member() is idempotent and is the only write this module
         makes by itself: it fills in the account id on a roster row that was
         created before the account existed, and returns the caller's role. It
         refuses to link anything unless the token already carries the staff
         claim, so it cannot be used to claim a colleague's waiting row. */
      try{ mine = await SB.rpc('link_staff_member'); }
      catch(e){ mine = null; }
      if(!mine){ try{ mine = await SB.rpc('staff_role'); }catch(e){ mine = null; } }

      if(mine === 'admin'){
        const [r,h] = await Promise.all([
          SB.sel('staff_roster',
                 'select=*&order=active.desc,role.asc,email.asc'),
          SB.sel('staff_role_history', 'select=*&limit=200')
        ]);
        roster = r; history = h;
      }else{
        /* Not a mistake and not an empty state: a manager and a viewer are
           refused these two by policy, and the screen they would go to is not
           shown to them at all. */
        roster = []; history = [];
      }
      loaded = true;
    }catch(e){ err = e; loaded = false; console.error('ROLES.load', e); }
    finally{ loading = false; }
    return loaded;
  }

  return {
    load, on: () => loaded, err: () => err,
    mine:     () => mine,
    isAdmin:  () => mine === 'admin',
    canWrite: () => mine === 'admin' || mine === 'manager',
    readOnly: () => mine === 'viewer',
    roster:   () => roster,
    history:  () => history,
    reload:   async () => { loaded = false; return load(); }
  };
})();

/* Same temporal-dead-zone hazard as crmReady(): the navigation is built at
   boot, long before SB and ROLES are initialised, and a bare reference throws
   rather than returning undefined. */
const rolesAdmin = () => {
  try { return SB.signedIn() && SB.isStaff() && ROLES.isAdmin(); }
  catch (e) { return false; }
};
const rolesViewer = () => {
  try { return SB.signedIn() && SB.isStaff() && ROLES.readOnly(); }
  catch (e) { return false; }
};

   viewer's write anyway — this exists so the refusal arrives as a sentence
   rather than as a 42501 from PostgREST. */

}

/* An identity number is never printed in a list and never printed by default.
   Masked to its last four here, revealed only when somebody deliberately asks —
   because the alternative is an ID sitting on screen through every screen-share
   and every walk past the desk. Revealing is per-view and per-click; nothing is
   remembered and nothing is written down about who looked. */
let ID_SHOWN = null;
function maskId(v){
  const s = String(v || '');
  return s.length <= 4 ? s : '•'.repeat(Math.max(4, s.length - 4)) + s.slice(-4);

   The file itself is never linked directly: the bucket is private and there is

function idDocBlock(c){
  const docs = CRM.idDocs(c.id);
  return `<div class="card" style="margin:0 0 14px"><div class="bd">
    <div class="f" style="margin-bottom:8px">${T('idoc_t')}</div>

      : `<div class="note">${T('idoc_none')}</div>`}

    <input type="file" id="idDocFile" accept="image/*,application/pdf" style="margin-top:12px">

      ${I('plus',15)} ${T('idoc_add')}</button>`}

  </div></div>`;
}

async function idDocOpen(path){
  try{
    /* Sixty seconds. Long enough to open, short enough that a copied link in a
       chat message is dead before anyone else clicks it. */
    const url = await SB.signedUrl(path, 60);
    window.open(url, '_blank', 'noopener');
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

async function idDocUpload(contactId){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const el = $('idDocFile');
  const file = el && el.files && el.files[0];
  if(!file) return toast(T('idoc_pick'));
  if(file.size > 15 * 1024 * 1024) return toast(T('idoc_big'));
  try{
    toast(T('idoc_working'));
    const buf  = await file.arrayBuffer();
    const fp   = await docFingerprint(buf);
    const stamp= new Date().toISOString().replace(/[-:T.]/g,'').slice(0,14);
    const safe = String(file.name || 'id').replace(/[^\w.\-]+/g,'_').slice(-60);
    const path = await SB.upload('identity/' + contactId + '/' + stamp + '-' + safe, file);
    await SB.ins('documents', [{
      kind:'identity', storage_path:path, filename:file.name,
      mime:file.type || 'application/octet-stream', bytes:file.size,
      sha256: fp.hex, readable:false,
      /* Keyed on the CONTACT, never on the flat — see the patch comment. A
         unit-keyed ref_key would be readable by the resident of that unit. */
      ref_key:'identity:' + contactId
    }]);
    await CRM.reload(); await contactDrawer(contactId); toast(T('idoc_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

function identityBlock(c){
  const bits = [];

  if(c.employer)    bits.push(esc(c.employer));

  const hasId = !!c.id_number;
  if(!hasId && !bits.length) return '';

        ? `<span class="pill p-crit">${I('alert',12,2.1)}${T('crm_id_expired')} ${fmtISO(c.id_expires_on)}</span>`

/* A contact's flat and lease term, from contact_tenancy. Both facts were
   already in `leases`; nothing here is deduced.

   A lease that has ENDED is shown as ended rather than left blank. Three of the
   twenty residents are in that state, and a blank cell would read as "we do not
   know" — which is a different thing and this project keeps them apart. */
function unitCell(c){
  const t = CRM.tenancy(c.id);
  if(!t.length) return '<span class="sub2">—</span>';
  const cur = t[0];
  return esc(cur.unit_id) + (cur.is_current ? ''
    : ` <span class="pill p-neut">${T('crm_ended')}</span>`);
}
function leaseCell(c){
  const t = CRM.tenancy(c.id);
  if(!t.length) return '<span class="sub2">—</span>';
  const cur = t[0];
  const term = (cur.starts_on ? fmtISO(cur.starts_on) : '—') + ' → ' +
               (cur.ends_on   ? fmtISO(cur.ends_on)   : '—');
  /* Never show one of several without saying there are others. */
  const more = t.length > 1
    ? ` <span class="sub2" title="${T('crm_earlier_t')}">+${NUM(t.length-1)} ${T('crm_earlier')}</span>`
    : '';
  return term + more;
}

async function contactSave(id){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const v = k => ($(k) && $(k).value || '').trim();
  if(!v('cNameEn')) return toast(T('crm_need_name'));
  try{
    /* Stored canonically — the database requires digits only, so the same
       person cannot arrive twice as one string with spaces and one without.
       No worked example is given here on purpose: an ID-shaped literal in a
       comment stops every scanner looking for a leaked identity number, and a
       check that cries wolf gets switched off. Upper-
       cased for passports, which are alphanumeric. */
    const idNo = v('cIdNo').replace(/[\s-]/g,'').toUpperCase() || null;
    const idType = $('cIdType').value;
    if(idNo && idType === 'unknown') return toast(T('crm_id_need_type'));
    const row = {
      name_en: v('cNameEn'), name_ar: v('cNameAr') || null,
      kind: $('cKind').value,
      phone: v('cPhone') || null, email: v('cEmail') || null,
      id_type: idType,
      id_expires_on: v('cIdExp') || null,
      nationality: v('cNat') || null,
      job_title:   v('cJob') || null,
      employer:    v('cEmp') || null,
      note: v('cNote') || null
    };
    /* An empty number box on an EDIT means "leave it as it is", not "delete
       it". Only send the field when something was actually typed. On a new
       contact an empty box does mean none, so it is sent as null. */
    if(idNo || !id) row.id_number = idNo;
    if(id) await SB.upd('contacts', 'id=eq.' + id, row);
    else   await SB.ins('contacts', [row]);
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

async function logContactSave(contactId){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const when = $('iWhen') && $('iWhen').value;
  if(!when) return toast(T('crm_need_when'));
  const at = new Date(when);
  if(at.getTime() > Date.now() + 60000) return toast(T('crm_future'));
  try{
    /* recorded_by is NOT sent: the database defaults it to the signed-in user,
       and its policy refuses any other value. A call logged under a colleague's
       name would make the whole log stop being evidence of anything. */
    await SB.ins('interactions', [{
      contact_id: contactId,
      channel: $('iCh').value, direction: $('iDir').value,
      occurred_at: at.toISOString(),
      subject: (($('iSub') && $('iSub').value) || '').trim() || null,
      body:    (($('iBody') && $('iBody').value) || '').trim() || null
    }]);
    closeDrawer(); await contactDrawer(contactId); toast(T('crm_logged'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

const STAGES = [['enquiry','sg_enq'],['viewing','sg_view'],['offer','sg_offer'],['contract','sg_con']];

/* The database stores a source as an enum — walk_in, agent, renewal. Those are
   column values, not words for a person to read, and in Arabic they are not
   words at all. Anything shown on screen goes through here. */
const SOURCES = {unknown:'src_unknown', walk_in:'src_walk', phone:'src_phone',
                 whatsapp:'src_wa', email:'src_email', agent:'src_agent',
                 referral:'src_ref', portal:'src_portal', renewal:'src_renewal',
                 other:'src_other'};
const srcName = v => SOURCES[v] ? T(SOURCES[v]) : T('src_other');

/* contact_timeline.what is assembled in SQL, so it arrives as column values:
   'whatsapp (in)', 'enquiry', 'open'. Those are fine as data and wrong on a
   screen — in Arabic they are not words at all. The view stays as it is; the
   translation belongs here, where the language is known. */
const CHANNELS = {call:'ch_call', whatsapp:'ch_wa', sms:'ch_sms', email:'ch_email',
                  visit:'ch_visit', letter:'ch_letter', other:'ch_other'};
const STAGEKEY = {enquiry:'sg_enq', viewing:'sg_view', offer:'sg_offer',
                  contract:'sg_con', won:'sg_won', lost:'sg_lost'};
const TASKKEY  = {open:'todo_open', done:'todo_done', cancelled:'todo_cancelled'};

function tlWhat(r){
  const w = String(r.what || '');
  if(r.entry === 'interaction'){
    const m = w.match(/^(\w+)\s*\((in|out)\)$/);
    if(!m) return esc(w);
    return T(CHANNELS[m[1]] || 'ch_other') + ' · ' + T(m[2] === 'in' ? 'dir_in_s' : 'dir_out_s');
  }
  if(r.entry === 'deal') return T(STAGEKEY[w] || 'sg_enq');
  if(r.entry === 'task') return T(TASKKEY[w]  || 'todo_open');
  return esc(w);
}

function dealAdvance(id){

  const next = i >= 0 && i < order.length - 1 ? order[i+1] : 'won';

async function dealMove(id){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const stage = $('mStage').value;
  const lost  = ($('mLost') && $('mLost').value || '').trim();
  if(stage === 'lost' && !lost) return toast(T('pipe_need_why'));
  const patch = {stage};
  if(stage === 'won' || stage === 'lost'){ patch.closed_on = new Date().toISOString().slice(0,10); }
  if(stage === 'lost') patch.lost_reason = lost;
  try{
    await SB.upd('deals', 'id=eq.' + id, patch);
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

async function taskSave(){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  const title = ($('tTitle').value||'').trim();
  if(!title) return toast(T('todo_need_title'));
  try{
    await SB.ins('tasks', [{
      title,
      contact_id: $('tContact').value ? Number($('tContact').value) : null,
      unit_id: ($('tUnit').value||'').trim() || null,
      due_on: $('tDue').value || null,
      detail: ($('tDetail').value||'').trim() || null
    }]);
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

/* Cancelling asks why, because the database refuses without a reason — and it
   refuses on purpose: a dropped commitment with no note becomes no record that
   anything was ever promised. */
function taskClose(id, how){
  if(how === 'done'){ return taskCloseSave(id, 'done', null); }
  openDrawer(T('todo_cancel'), `
    <div class="note" style="margin-bottom:14px">${T('todo_cancel_note')}</div>
    <div style="margin:10px 0"><label class="f">${T('todo_why')}</label>
      <input class="inp" id="tWhy"></div>
    <button class="btn pri" style="margin-top:12px"
      onclick="taskCloseSave(${id},'cancelled',($('tWhy').value||'').trim())">${T('save')}</button>`);
}

async function taskCloseSave(id, status, outcome){
  /* The database refuses a viewer's write; this is so the refusal arrives as a
     sentence rather than as a 42501 from PostgREST. */
  if(!writeGate()) return;
  if(status === 'cancelled' && !outcome) return toast(T('todo_need_why'));
  try{
    await SB.upd('tasks', 'id=eq.' + id, {
      status, outcome: outcome || null,
      closed_at: new Date().toISOString(), closed_by: CRM.uid()
    });
    await CRM.reload(); closeDrawer(); render(); toast(T('crm_saved'));
  }catch(e){ toast(T('crm_err') + ' ' + (e.message || e)); }
}

/* ==========================================================================
   SB — Supabase, without a library

   Both prototypes are single files with nothing loaded from anywhere else,
   and that is worth keeping: a file that works from a memory stick works in
   a site office. So the backend is spoken to directly — PostgREST over
   fetch, storage over fetch, Realtime over a WebSocket. No CDN, no bundle.

   The key below is the PUBLISHABLE key. It is meant to sit in a public page:
   it identifies the project, it does not grant anything. Every row this
   application can see or change is decided by the access rules in the
   database, against the signed-in user. Without a session it reads nothing —
   which is checked, not assumed.
   ========================================================================== */
/* ==========================================================================
   Users and roles — the administrator's screen
   ========================================================================== */

/* The three different things that can be wrong with somebody's sign-in, kept

function acctCell(m){
  if(!m.has_account) return `<span class="pill p-warn">${T('rl_acc_none')}</span>`;
  if(!m.claim_ok)    return `<span class="pill p-warn">${T('rl_acc_noclaim')}</span>`;

const ACTIONS = {added:'ac_added', role_changed:'ac_role_changed',
                 deactivated:'ac_deactivated', reactivated:'ac_reactivated',
                 details_changed:'ac_details_changed', linked:'ac_linked',
                 removed:'ac_removed'};
/* The trail is written in the database's own vocabulary; nothing raw reaches
   the screen. An unrecognised action is shown as itself rather than as a
   guess — this console has had three separate leaks of raw enum values and
   every one of them was a translation table missing a row. */
function acName(a){ return ACTIONS[a] ? T(ACTIONS[a]) : String(a || ''); }
function trailWhat(h){
  if(h.action === 'role_changed' && h.old_role && h.new_role)
    return acName(h.action) + ': ' + rlName(h.old_role) + ' → ' + rlName(h.new_role);
  if(h.action === 'added' && h.new_role)
    return acName(h.action) + ': ' + rlName(h.new_role);
  return acName(h.action);
}

     request that is certain to be refused should not be made at all — the
     refusal would arrive as an error where the honest answer is that the box

  const mine = !!m && m.email === (SB.email() || '').toLowerCase();

const SB = (function(){
  const BASE = ENV.base;
  const KEY  = ENV.key;
  const SKEY = ENV.prefix + '.sb.session.v1';
  const TOPIC = 'realtime:' + ENV.prefix;

  let sess = null;
  try{ sess = JSON.parse(localStorage.getItem(SKEY) || 'null'); }catch(e){ sess = null; }

  function save(s){
    sess = s || null;
    try{ sess ? localStorage.setItem(SKEY, JSON.stringify(sess)) : localStorage.removeItem(SKEY); }
    catch(e){}
  }

  const token = () => (sess && sess.access_token) || KEY;
  const hdr = extra => Object.assign({apikey:KEY, Authorization:'Bearer '+token()}, extra||{});

  async function call(path, opt){
    const r = await fetch(BASE + path, opt || {});
    const txt = await r.text();
    let body = null;
    try{ body = txt ? JSON.parse(txt) : null; }catch(e){ body = txt; }
    if(!r.ok){
      const msg = (body && (body.message || body.error_description || body.msg ||
                            body.error || body.hint)) || ('HTTP ' + r.status);
      throw Object.assign(new Error(msg), {status:r.status, body:body});
    }
    return body;
  }

  /* ------------------------------- session ------------------------------- */
  function claims(){
    if(!sess || !sess.access_token) return null;
    try{
      let p = sess.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
      while(p.length % 4) p += '=';
      const bin = atob(p);
      const u8 = Uint8Array.from(bin, c=>c.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(u8));
    }catch(e){ return null; }
  }
  const stale   = () => { const c = claims(); return !c || (c.exp*1000) < Date.now() + 60000; };
  const isStaff = () => { const c = claims(); const m = c && (c.app_metadata || c.user_metadata) || {};
                          return m.role === 'staff'; };
  const email   = () => { const c = claims(); return (c && c.email) || ''; };
  const signedIn= () => !!(sess && sess.access_token);

  async function signIn(mail, pass){
    const s = await call('/auth/v1/token?grant_type=password', {
      method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email:mail, password:pass})});
    save(s);
    return s;
  }
  async function refresh(){
    if(!sess || !sess.refresh_token) return null;
    try{
      const s = await call('/auth/v1/token?grant_type=refresh_token', {
        method:'POST', headers:{apikey:KEY, 'Content-Type':'application/json'},
        body: JSON.stringify({refresh_token: sess.refresh_token})});
      save(s); return s;
    }catch(e){ save(null); return null; }
  }
  function signOut(){
    try{ fetch(BASE+'/auth/v1/logout', {method:'POST', headers:hdr()}); }catch(e){}
    save(null);
    try{ if(ws) ws.close(); }catch(e){}
  }
  /* A stored session that has expired is refreshed before anything is read,
     so a console left open overnight does not come back to empty screens. */
  async function ready(){
    if(!signedIn()) return false;
    if(stale()) return !!(await refresh());
    return true;
  }

  /* --------------------------------- rest -------------------------------- */
  const sel = (t,q)      => call('/rest/v1/'+t+(q?'?'+q:''), {headers:hdr()});
  const ins = (t,rows)   => call('/rest/v1/'+t, {method:'POST',
                              headers:hdr({'Content-Type':'application/json', Prefer:'return=representation'}),
                              body:JSON.stringify(rows)});
  const ups = (t,rows,c) => call('/rest/v1/'+t+(c?'?on_conflict='+c:''), {method:'POST',
                              headers:hdr({'Content-Type':'application/json',
                                Prefer:'resolution=merge-duplicates,return=representation'}),
                              body:JSON.stringify(rows)});
  const upd = (t,q,patch)=> call('/rest/v1/'+t+'?'+q, {method:'PATCH',
                              headers:hdr({'Content-Type':'application/json', Prefer:'return=representation'}),
                              body:JSON.stringify(patch)});
  const del = (t,q)      => call('/rest/v1/'+t+'?'+q, {method:'DELETE', headers:hdr()});
  /* The three Postgres functions a signed-in user is allowed to call. All
     three answer about the CALLER and nobody else: what role they hold, and —
     once, on first sign-in — linking their roster row to their account. */
  const rpc = (fn,args)  => call('/rest/v1/rpc/'+fn, {method:'POST',
                              headers:hdr({'Content-Type':'application/json'}),
                              body:JSON.stringify(args || {})});

  /* ------------------------------- storage ------------------------------- */
  /* The bucket is private. Nothing is ever fetched by a plain URL; a link is
     signed on demand and stops working shortly afterwards. */
  async function upload(path, file){
    const r = await fetch(BASE + '/storage/v1/object/documents/' + encodeURI(path), {
      method:'POST',
      headers: hdr({'x-upsert':'false', 'Content-Type': file.type || 'application/octet-stream'}),
      body: file});
    if(!r.ok){
      const t = await r.text();
      throw Object.assign(new Error('upload failed'), {status:r.status, body:t});
    }
    return 'documents/' + path;
  }
  async function signedUrl(path, secs){
    const p = String(path).replace(/^documents\//, '');
    const b = await call('/storage/v1/object/sign/documents/' + encodeURI(p), {
      method:'POST', headers:hdr({'Content-Type':'application/json'}),
      body: JSON.stringify({expiresIn: secs || 60})});
    return BASE + '/storage/v1' + b.signedURL;
  }

  /* ------------------------------- realtime ------------------------------ */
  let ws = null, ref = 0, hb = null, watchers = [], tables = [], back = 0;
  let rt = 'off';                                  /* off | joining | live | error */

  const send = o => { try{ if(ws && ws.readyState === 1) ws.send(JSON.stringify(o)); }catch(e){} };

  function connect(){
    if(ws || !watchers.length) return;
    rt = 'joining';
    try{
      ws = new WebSocket(BASE.replace(/^http/,'ws') + '/realtime/v1/websocket?apikey=' +
                         encodeURIComponent(KEY) + '&vsn=1.0.0');
    }catch(e){ ws = null; rt = 'error'; return; }

    ws.onopen = () => {
      send({topic:TOPIC, event:'phx_join', ref:String(++ref), payload:{config:{
        broadcast:{self:false}, presence:{key:''}, private:false,
        postgres_changes: tables.map(t=>({event:'*', schema:'public', table:t}))}}});
      if(sess) send({topic:TOPIC, event:'access_token', ref:String(++ref),
                     payload:{access_token: sess.access_token}});
      hb = setInterval(()=>send({topic:'phoenix', event:'heartbeat', ref:String(++ref), payload:{}}), 25000);
    };
    ws.onmessage = ev => {
      let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
      if(m.event === 'phx_reply' && m.payload && m.payload.status === 'ok'){ rt = 'live'; back = 0; }
      if(m.event === 'system' && m.payload && m.payload.status === 'error') rt = 'error';
      if(m.event === 'postgres_changes'){
        const d = (m.payload && m.payload.data) || {};
        watchers.forEach(fn=>{ try{ fn(d); }catch(e){ console.error('SB.watch', e); } });
      }
    };
    ws.onerror = () => { rt = 'error'; };
    ws.onclose = () => {
      clearInterval(hb); ws = null;
      if(rt !== 'off') rt = 'error';
      if(watchers.length){
        back = Math.min(back + 1, 6);
        setTimeout(connect, 1000 * Math.pow(2, back));
      }
    };
  }

  function watch(tbl, fn){
    tables = [...new Set(tables.concat(tbl))];
    watchers.push(fn);
    connect();
  }
  function stopWatching(){ watchers = []; rt = 'off'; try{ if(ws) ws.close(); }catch(e){} }

  return {
    base: BASE, configured: () => !!(BASE && KEY),
    signIn, signOut, refresh, ready, signedIn, isStaff, email, claims,
    sel, ins, ups, upd, del, rpc, upload, signedUrl,
    watch, stopWatching, rtState: () => rt
  };
})();


/* ==========================================================================
   LIVE — the console against the real database

   Until someone signs in, nothing below runs and the console behaves exactly
   as it did: seeded register, shared record in this browser, no network.
   Once a member of staff signs in, LIVE takes over the two seams LINK was
   built around — where state is read, and where it is written — and every
   screen above carries on unchanged.

   Reads go through applyRegister(), the same path the workbook importer uses,
   so a register loaded from Postgres and a register loaded from a spreadsheet
   arrive at the identical shape. Writes are translated from the shared-record
   shape into table writes, one case per flow, and a failure is shown rather
   than swallowed.
   ========================================================================== */

/* Postgres stores each cost line under the register's own vocabulary; this
   console has had its own category list since long before those registers were
   found. This maps one to the other, and nothing else — it is a presentation
   mapping between two existing labels, not a new deduction about the work. It
   was checked rather than assumed: every one of the 100 imported lines was
   matched against the seeded copy of the same line on 29 Aug 2026, and each
   Postgres category resolved to exactly one console category with no line left
   over and no category splitting two ways.

   An unrecognised category falls to 'gen' — visibly general works — because
   inventing a trade from a word this table has never used is the mistake this
   project keeps having to undo. */
const COST_CAT = {
  plumbing:'plumb', hvac:'ac',      electrical:'elec',  security_sys:'elec',
  cleaning:'clean', carpentry:'carp', finishes:'paint', appliance:'appl',
  lift:'lift',      waste:'waste',  security:'sec',     labour:'gen',
  grounds:'gen'
};

const LIVE = (function(){
  const WATCH = ['work_orders','announcements','instalments','leases','documents','units'];
  let state = null, subs = [], leaseOf = {}, lastErr = null, pulling = false, timer = null;

  const N = v => (v === null || v === undefined) ? null : Number(v);
  const eq = (a,b) => JSON.stringify(a) === JSON.stringify(b);
  const BLANK = () => ({v:1, rev:0, at:0, by:'', wo:{}, newWO:[], anns:[], pay:{},
                        docs:[], leases:{}, jobs:[], nextSeq:0});

  /* --------------------------------- read -------------------------------- */
  async function pull(){
    const [units, leases, inst, wos, anns, docs, costs] = await Promise.all([
      SB.sel('units', 'select=*&order=id.asc'),
      SB.sel('leases', 'select=id,unit_id,starts_on,ends_on,contract_value,status,' +
                       'residents(name_en,name_ar)&status=eq.active&order=unit_id.asc'),
      SB.sel('instalments', 'select=*&order=lease_id.asc,seq.asc'),
      SB.sel('work_orders', 'select=*&order=raised_at.desc'),
      SB.sel('announcements', 'select=*&order=published_at.desc'),
      SB.sel('documents', 'select=*&order=uploaded_at.desc'),
      /* The office's own registers. This layer was written a week before
         building_costs existed, so signing in used to EMPTY the maintenance
         page: work_orders has no rows, and nothing here had been told about
         the hundred imported invoice lines. Connecting made the console less
         truthful than not connecting, which is the wrong way round.

         Caught rather than allowed to propagate: if this one table is missing
         or refused, the rent register must still load. A console that shows
         nothing because of the cost table is worse than one that shows the
         register and no costs. */
      SB.sel('building_costs',
             'select=id,occurred_on,description,amount,unit_id,category,invoice_no,' +
             'suppliers(name_en)&order=occurred_on.asc,id.asc')
        .catch(e => { console.warn('building_costs unavailable', e); return []; })
    ]);
    leaseOf = {};
    leases.forEach(l => { leaseOf[l.unit_id] = l.id; });
    return {units, leases, inst, wos, anns, docs, costs};
  }

  const toRegister = d => d.units.map(u => {
    const l = d.leases.find(x => x.unit_id === u.id);
    const rows = l ? d.inst.filter(i => i.lease_id === l.id) : [];
    const r = l && l.residents;
    return {
      id:u.id, type:u.type, area:N(u.area), floor:u.floor, let:!!u.occupied,
      tenant:   r ? r.name_en : null,
      tenantAr: r ? (r.name_ar || r.name_en) : null,
      value: l ? N(l.contract_value) : null,
      start: l ? l.starts_on : null,
      end:   l ? l.ends_on   : null,
      paid:   rows.filter(x =>  x.paid).reduce((a,x)=>a + N(x.amount), 0),
      remain: rows.filter(x => !x.paid).reduce((a,x)=>a + N(x.amount), 0),
      inst: rows.map(x => ({n:x.seq, amt:N(x.amount), due:x.due_on, paid:!!x.paid}))
    };
  });

  function paint(d){
    applyRegister(toRegister(d));                    /* the importer's own path */

    WOS.length = 0;
    d.wos.forEach(w => {
      const u = UNITS.find(x => x.u === w.unit_id);
      const c = CAT(w.category) || {sla:8};
      const target = w.target_hrs != null ? Number(w.target_hrs) : c.sla;
      const raised = new Date(w.raised_at);
      const closed = w.closed_at ? new Date(w.closed_at) : null;
      const closeH = closed ? Math.max(0, (closed - raised) / 36e5) : 0;
      WOS.push({
        id:w.id, cat:w.category, unit:w.unit_id,
        tenant:(u && u.tenant) || '—', tenant_ar:(u && u.tenant_ar) || '—',
        desc:w.description || '', pri:w.priority || 'med', ch:w.channel || 'app',
        raised, respH:0, closeH, target,
        breached: !!(closed && closeH > target),
        status:w.status,
        tech:w.technician || '—', tech_ar:w.technician || '—', supplier:false,
        labH:Number(w.labour_hrs) || 0, mat:Number(w.material) || 0,
        note:w.note || '', rating: w.rating == null ? null : Number(w.rating),
        noSla: w.measurable === false,
        month: raised.getFullYear() + '-' + String(raised.getMonth()+1).padStart(2,'0'),
        fromApp: w.channel === 'app'
      });
    });
    WOS.sort((a,b) => b.raised - a.raised);

    ANNS.length = 0;
    d.anns.forEach(a => ANNS.push({
      id:a.id, en:a.title_en, ar:a.title_ar, body_en:a.body_en, body_ar:a.body_ar,
      aud:a.audience || 'all', st:a.status, date:(a.published_at || '').slice(0,10), ok:true
    }));

    state = BLANK();
    state.docs = d.docs.map(x => ({
      id:x.id, row:x.id, key:x.ref_key || '', kind:x.kind, name:x.filename,
      mime:x.mime, size:Number(x.bytes) || 0, hash:x.sha256, algo:'SHA-256',
      at:x.uploaded_at, by:'', readable:x.readable, storage:'supabase', path:x.storage_path
    }));
    /* Deliberately computed from the work orders ALONE, before the cost lines
       are replayed below. The next resident request must not have its number
       pushed along by an invoice from last year. */
    state.nextSeq = WOS.reduce((m,w) => {
      const n = parseInt(String(w.id).replace(/\D+/g,'').slice(-3), 10);
      return isNaN(n) ? m : Math.max(m, n + 1);
    }, 501);

    /* The imported registers, replayed through the console's own entry path —
       the same call the office makes when it types up a completed job, and the
       same one the seeded copy uses. That is what makes them arrive as invoice
       lines: done, no response time, no target, noSla true. They are NOT a
       second parallel shape, and a resident-raised request under spec 004 is
       still measured on its own timestamps and never unioned with these.

       The id is built from the Postgres row, not from the position in this
       list, so a line keeps its reference when a work order is logged. */
    d.costs.forEach(c => {
      const when = new Date(c.occurred_on + 'T12:00:00');
      const u = UNITS.find(x => x.u === c.unit_id);
      logJobAdd({
        id: 'MR-' + String(when.getFullYear()).slice(2) +
            String(when.getMonth() + 1).padStart(2,'0') +
            '-I' + String(c.id).padStart(3,'0'),
        unit: c.unit_id || '—',
        cat: COST_CAT[c.category] || 'gen',
        date: c.occurred_on,
        supplier: (c.suppliers && c.suppliers.name_en) || '',
        desc: c.description || '',
        mat: Number(c.amount) || 0,
        labH: 0,
        inv: c.invoice_no || ''
      }, u, when);
    });

    recompute();
  }

  async function reload(){
    if(pulling) return;
    pulling = true;
    try{ paint(await pull()); lastErr = null; }
    catch(e){ lastErr = e; console.error('LIVE.reload', e); }
    finally{ pulling = false; }
    subs.forEach(fn => { try{ fn(state, {by:'live'}); }catch(e){} });
  }
  const nudge = () => { clearTimeout(timer); timer = setTimeout(reload, 400); };

  /* -------------------------------- write -------------------------------- */
  /* DATA-01. What this code used to do, in both saveLease and saveRegister:
     DELETE every instalment on the lease, then insert a fresh unpaid schedule.
     Correcting a typo in an end date erased every paid flag, paid_on and
     receipt_ref on that lease — silently, with no error and nothing to restore
     from. Twenty leases here carry 56 settled instalments.

     Both paths now go through one Postgres function, save_lease_schedule, which
     is a single transaction, reconciles by instalment number instead of
     replacing, and cannot delete or rewrite a paid row — the instalments table
     itself refuses that now, so a hand-typed statement in the SQL editor is
     refused too. It runs as a dry run first and returns exactly the receipt the
     real run would produce; anything it cannot do quietly is reported as a
     conflict and the operator decides. DATA-02 rides along: the schedule dates
     come from add_months_clamped, so 31 January plus one month is 28 February
     rather than 3 March. */

  function ScheduleConflict(receipt, unit){
    const e = new Error('schedule conflicts with payment history');
    e.name = 'ScheduleConflict'; e.receipt = receipt; e.unit = unit;
    return e;
  }

  /* One call, both phases. Returns the receipt of whatever actually ran. */
  async function writeSchedule(unit, a, opts){
    opts = opts || {};
    const args = {
      p_unit_id:        unit,
      p_starts_on:      a.start || null,
      p_ends_on:        a.end   || null,
      p_contract_value: (a.value === 0 || a.value) ? a.value : null,
      p_count:          a.n     || null,
      p_frequency:      a.freq  || null,
      p_rows:           a.rows  || null,
      p_dry_run:        true
    };
    const dry = await SB.rpc('save_lease_schedule', args);
    const conflicts = (dry && dry.conflicts) || [];
    if(conflicts.length && !opts.force){
      /* The exact arguments are carried with the held receipt, so that saying
         "apply" later applies THIS change and not a re-derived guess at it. */
      try{ Object.defineProperty(dry, '_args', {value:args, enumerable:false}); }
      catch(e){ dry._args = args; }
      throw ScheduleConflict(dry, unit);
    }
    args.p_dry_run = false;
    return await SB.rpc('save_lease_schedule', args);
  }

  /* Apply a receipt the operator has read and accepted. Paid rows are still
     untouchable — the function and the table both refuse — so this confirms the
     unpaid side of the change, never an overwrite of a payment. */
  async function applyHeld(receipt){
    if(!receipt || !receipt._args) throw new Error('nothing to apply');
    const args = Object.assign({}, receipt._args, {p_dry_run:false});
    const r = await SB.rpc('save_lease_schedule', args);
    if(r && r.lease_id && r.unit) leaseOf[r.unit] = r.lease_id;
    nudge();
    return r;
  }

  async function saveLease(unit, a, opts){
    const r = await writeSchedule(unit, a, opts);
    if(r && r.lease_id) leaseOf[unit] = r.lease_id;
    return r;
  }

  /* A register imported from the workbook becomes the register in Postgres.
     Units are upserted; each unit's schedule is then reconciled row by row.
     The import supplies its own instalments, including which of them are
     settled — but a paid flag only settles a row when it names the receipt it
     was paid against, and when it does not, the receipt says so per instalment
     instead of the flag disappearing without a word. */
  async function saveRegister(rows, opts){
    await SB.ups('units', rows.map(r => ({
      id:r.id, floor:r.floor, type:r.type, area:r.area, occupied:!!r.let })), 'id');
    const receipts = [], held = [];
    for(const r of rows){
      if(!r.value && !r.start && !(r.inst || []).length) continue;
      const a = {
        start: r.start || null, end: r.end || null,
        value: r.value || null, n: (r.inst || []).length || null,
        rows: (r.inst || []).length ? r.inst.map(x => ({
          seq:x.n, amount:x.amt, due_on:x.due,
          paid:!!x.paid, paid_on:x.on || null, receipt_ref:x.ref || null })) : null
      };
      try{
        const got = await saveLease(r.id, a, opts);
        receipts.push(got);
      }catch(e){
        /* One unit's disagreement must not abandon the other thirty-six. Each
           is its own transaction; the ones that are clean are applied and the
           ones that are not are collected and shown together. */
        if(e && e.name === 'ScheduleConflict') held.push(e.receipt);
        else throw e;
      }
    }
    if(held.length){
      const e = new Error('register held for review');
      e.name = 'ScheduleConflictBatch'; e.receipts = held; e.applied = receipts;
      throw e;
    }
    return receipts;
  }

  async function push(before, after){
    const jobs = [];

    Object.keys(after.wo || {}).forEach(id => {
      const a = after.wo[id];
      if(eq(a, (before.wo || {})[id])) return;
      const p = {};
      if(a.status !== undefined){
        p.status = a.status;
        p.closed_at = (a.status === 'done') ? new Date().toISOString() : null;
      }
      if(a.tech   !== undefined) p.technician  = (a.tech === '—' || !a.tech) ? null : a.tech;
      if(a.labH   !== undefined) p.labour_hrs  = a.labH;
      if(a.mat    !== undefined) p.material    = a.mat;
      if(a.note   !== undefined) p.note        = a.note;
      if(a.rating !== undefined) p.rating      = a.rating;
      jobs.push(SB.upd('work_orders', 'id=eq.' + encodeURIComponent(id), p));
    });

    (after.newWO || []).forEach(w => {
      if((before.newWO || []).some(x => x.id === w.id)) return;
      jobs.push(SB.ins('work_orders', {
        id:w.id, unit_id:w.unit, category:w.cat, description:w.desc,
        /* APP-02. The resident app collects a title and a preferred visit
           window as well as the description; both were being dropped on the
           floor here. Sent as null rather than '' when absent, so "not stated"
           and "stated as empty" stay different things. */
        title: w.title || null, visit_window: w.visit || null,
        priority:w.pri || 'med', channel:'app', status:'submitted', raised_at:w.raised}));
    });

    (after.jobs || []).forEach(j => {
      if((before.jobs || []).some(x => x.id === j.id)) return;
      const day = j.date + 'T09:00:00Z';
      jobs.push(SB.ins('work_orders', {
        id:j.id, unit_id:j.unit, category:j.cat, description:j.desc,
        priority:'med', channel:'desk', status:'done', technician:j.supplier || null,
        raised_at:day, closed_at:j.date + 'T12:00:00Z',
        labour_hrs:j.labH || 0, material:j.mat || 0,
        measurable:false, note:j.inv ? ('Invoice ' + j.inv) : null}));
    });

    (after.anns || []).forEach(a => {
      if((before.anns || []).some(x => x.id === a.id)) return;
      jobs.push(SB.ins('announcements', {
        title_en:a.en, title_ar:a.ar, body_en:a.body_en, body_ar:a.body_ar,
        audience:a.aud || 'all', status:'published', published_at:new Date().toISOString()}));
    });

    Object.keys(after.pay || {}).forEach(unit => {
      const A = (after.pay[unit] || {}).paid || {};
      const B = ((before.pay || {})[unit] || {}).paid || {};
      Object.keys(A).forEach(q => {
        if(eq(A[q], B[q])) return;
        const lid = leaseOf[unit];
        if(!lid) return;
        jobs.push(SB.upd('instalments', 'lease_id=eq.' + lid + '&seq=eq.' + q, {
          paid:true,
          paid_on:(A[q].on || new Date().toISOString()).slice(0,10),
          receipt_ref:A[q].ref || null}));
      });
    });

    Object.keys(after.leases || {}).forEach(unit => {
      if(eq(after.leases[unit], (before.leases || {})[unit])) return;
      jobs.push(saveLease(unit, after.leases[unit]));
    });

    (after.docs || []).forEach(d => {
      if((before.docs || []).some(x => x.id === d.id && x.key === d.key)) return;
      jobs.push(SB.ins('documents', {
        kind:d.kind, storage_path:d.path || ('unstored/' + d.id), filename:d.name,
        mime:d.mime, bytes:d.size, sha256:d.hash, readable:!!d.readable, ref_key:d.key
      }).then(r => { if(r && r[0]) d.row = r[0].id; }));
    });
    (before.docs || []).forEach(d => {
      if((after.docs || []).some(x => x.id === d.id && x.key === d.key)) return;
      if(d.row) jobs.push(SB.del('documents', 'id=eq.' + d.row));
    });

    if(after.register && !eq(after.register, before.register))
      jobs.push(saveRegister(after.register));

    const out = await Promise.allSettled(jobs);
    const bad = out.filter(r => r.status === 'rejected');

    /* A schedule that disagrees with money already received is not a failure —
       it is a question, and it is the operator's to answer. It gets the
       reconciliation panel, not a toast that scrolls away in three seconds. */
    const conflicted = bad.map(r => r.reason).filter(e =>
      e && (e.name === 'ScheduleConflict' || e.name === 'ScheduleConflictBatch'));
    const failed = bad.map(r => r.reason).filter(e =>
      !e || (e.name !== 'ScheduleConflict' && e.name !== 'ScheduleConflictBatch'));

    if(conflicted.length && typeof openReconcile === 'function'){
      const receipts = [];
      conflicted.forEach(e => {
        if(e.name === 'ScheduleConflictBatch') receipts.push.apply(receipts, e.receipts);
        else receipts.push(e.receipt);
      });
      openReconcile(receipts);
    }

    if(failed.length){
      lastErr = failed[0];
      const m = (failed[0] && failed[0].message) || 'write failed';
      if(typeof toast === 'function')
        toast(L('The database refused that change: ' + m,
                'رفضت قاعدة البيانات هذا التغيير: ' + m));
    }else if(!conflicted.length){
      lastErr = null;
    }
    nudge();
  }

  function commit(mutate, who){
    const before = JSON.parse(JSON.stringify(state || BLANK()));
    try{ mutate(state); }catch(e){ console.error('LIVE.commit', e); return state; }
    state.rev = (state.rev || 0) + 1;
    state.at  = Date.now();
    state.by  = who || '';
    push(before, state);
    return state;
  }

  /* -------------------------------- attach ------------------------------- */
  async function start(){
    await reload();
    if(lastErr) return false;
    LINK.get      = () => state;
    LINK.commit   = commit;
    LINK.onChange = fn => subs.push(fn);
    LINK.reset    = () => state;
    LINK.healthy  = () => !lastErr;
    LINK.live     = () => true;
    DOCSTORE.mode = 'supabase';
    DOCSTORE.put  = async file => {
      const stamp = new Date().toISOString().replace(/[-:T.]/g,'').slice(0,14);
      const safe  = String(file.name || 'file').replace(/[^\w.\-]+/g,'_').slice(-60);
      return {mode:'supabase', path: await SB.upload(stamp + '-' + safe, file)};
    };
    SB.watch(WATCH, nudge);
    return true;
  }

  return {start, reload, on: () => !!state && LINK.live(), err: () => lastErr,
          rt: () => SB.rtState(), signedInAs: () => SB.email(),
          applyHeld};
})();


/* ------------------------------ connection ------------------------------ */
/* The console runs on seeded data until a member of staff signs in. Signing
   in is what turns it into the real register: every read comes from Postgres
   and every change is written back, so a second person on a second machine
   sees it. Passwords are typed here and exchanged with Supabase directly —
   nothing about them is stored in this file. */

function sbStatusLine(){
  if(!SB.signedIn())
    return `<div class="warnbox">${I('alert',16,2.2)}<span>${L(
      'Not connected. This console is showing the seeded register held in this browser, and changes stay on this machine.',
      'غير متصل. تعرض هذه الشاشة السجل المخزّن في هذا المتصفح فقط، والتغييرات لا تغادر هذا الجهاز.')}</span></div>`;
  const rt = SB.rtState();
  const live = rt === 'live';
  return `<div class="${live?'okbox':'warnbox'}">${I(live?'check':'clock',16,2.2)}<span>${L(
    'Connected as ' + SB.email() + (live ? ' — live, changes appear on other machines as they happen.'
                                         : ' — connected, but the live channel is ' + rt + '.'),
    'متصل باسم ' + SB.email() + (live ? ' — التحديث فوري على الأجهزة الأخرى.'
                                      : ' — متصل، لكن قناة التحديث الفوري: ' + rt))}</span></div>`;
}

function sbOpen(){
  const inn = SB.signedIn();
  openDrawer(L('Backend connection','الاتصال بقاعدة البيانات'), `
    <div style="padding:2px 0 4px">${sbStatusLine()}</div>
    ${inn ? `
      <div class="note" style="margin:12px 0">${L(
        'Signed in as a member of staff. The register, the jobs, the documents and the announcements on every screen are coming from the database.',
        'تم تسجيل الدخول كموظف. السجل والأعمال والمستندات والإعلانات في كل الشاشات تأتي من قاعدة البيانات.')}</div>
      <button class="btn" onclick="sbDoSignOut()">${L('Sign out','تسجيل الخروج')}</button>
    ` : `
      <div style="margin:14px 0"><label class="f">${L('Work email','البريد الإلكتروني')}</label>
        <input class="inp" id="sbMail" type="email" autocomplete="username" placeholder="you@almaria.sa"></div>
      <div style="margin-bottom:4px"><label class="f">${L('Password','كلمة المرور')}</label>
        <input class="inp" id="sbPass" type="password" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')sbDoSignIn()"></div>
      <button class="btn pri" id="sbGo" style="margin-top:12px" onclick="sbDoSignIn()">
        ${L('Connect','اتصال')}</button>
      <div class="note" style="margin-top:14px">${L(
        'The account must be marked as staff in the database. A resident account signing in here would see nothing, because the access rules only ever return their own apartment.',
        'يجب أن يكون الحساب مُعلّماً كموظف في قاعدة البيانات. حساب ساكن لن يرى شيئاً هنا، لأن قواعد الوصول لا تُرجع سوى شقته.')}</div>
    `}`);
}

async function sbDoSignIn(){
  const mail = ($('sbMail') && $('sbMail').value || '').trim();
  const pass = ($('sbPass') && $('sbPass').value) || '';
  if(!mail || !pass) return toast(L('Both the email and the password are needed.',
                                    'البريد الإلكتروني وكلمة المرور مطلوبان.'));
  const btn = $('sbGo');
  if(btn){ btn.disabled = true; btn.textContent = L('Connecting…','جارٍ الاتصال…'); }
  try{
    await SB.signIn(mail, pass);
    if($('sbPass')) $('sbPass').value = '';
    if(!SB.isStaff()){
      SB.signOut();
      throw new Error(L('That account is not marked as staff, so it cannot open the console.',
                        'هذا الحساب غير مُعلّم كموظف، ولا يمكنه فتح لوحة الإدارة.'));
    }
    if(!await LIVE.start()) throw (LIVE.err() || new Error('could not read the register'));
    CRM.load().then(() => render());
    ROLES.load().then(() => render());
    LINK.onChange(() => { render(); linkFlash(); });
    closeDrawer(); render();
    toast(L('Connected. This console is now the register.',
            'تم الاتصال. هذه الشاشة تعرض السجل الفعلي الآن.'));
  }catch(e){
    toast(L('Could not connect: ' + (e.message || e), 'تعذّر الاتصال: ' + (e.message || e)));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = L('Connect','اتصال'); }
  }
}

function sbDoSignOut(){
  SB.signOut();
  closeDrawer();
  location.reload();
}

/* Replay the imported registers through the console's own invoice path, so
   each record is exactly what the 'Enter a completed job' form produces —
   noSla included — rather than a second, parallel shape. */
/* The cost tile reads 'this month'. The imported registers end in June 2026,
   so in August it correctly shows zero — and reads like a failed import. Say
   when spend was last booked instead of showing a 0% delta against nothing. */
function lastCostMonth(){
  var ms = WOS.filter(function(w){ return (w.mat||0) > 0 && w.month; })
              .map(function(w){ return w.month; }).sort();
  return ms.length ? ms[ms.length-1] : null;
}

(function seedCostLog(){
  if(typeof COST_LOG === 'undefined' || !COST_LOG.length) return;
  COST_LOG.forEach(function(x){
    var d = new Date(x.d + 'T12:00:00');
    var u = UNITS.find(function(y){ return y.u === x.u; });
    logJobAdd({ unit:x.u, cat:x.c, date:x.d, supplier:x.s, desc:x.t,
                mat:x.m, labH:0, inv:x.i }, u, d);
  });
  recompute();
  /* The first render has already run by the time this executes, so it painted
     the empty state. Repaint, or the log only appears on the next click. */
  if(typeof render === 'function') render();
})();

/* ---------------------------- backend at boot ---------------------------- */
(async function(){
  const btn = document.getElementById('sbBtn');
  const label = () => {
    if(!btn) return;
    const on = SB.signedIn();
    btn.innerHTML = I(on ? 'check' : 'alert', 15) +
      '<span>' + (on ? L('Connected','متصل') : L('Connect','اتصال')) + '</span>';
    btn.classList.toggle('pri', !on);
  };
  label();
  sbLabelTick = label;
  if(!SB.configured()) return;
  try{
    if(await SB.ready() && SB.isStaff()){
      if(await LIVE.start()){
        LINK.onChange(() => { render(); linkFlash(); });
        render();
        /* The CRM is its own read: it is staff-only and has no seeded copy, so
           it must not be able to hold up the register loading. */
        CRM.load().then(() => render());
        /* Separate read, and deliberately not awaited with the register: it
           decides what the screen offers, not what the screen shows. */
        ROLES.load().then(() => render());
      }
    }
  }catch(e){ console.error('backend boot', e); }
  label();
  setInterval(label, 5000);
})();

</script>
